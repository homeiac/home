<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">The final photo pipeline</title>
<desc id="desc">Photos Takeout is validated and ingested on the host into ZFS originals. The independent USB policy covers a quota subset. Originals feed the inventory, read-only Immich and caption workers. PostgreSQL owns live decisions. Local and optional cloud captions and PostgreSQL snapshots publish Parquet for DuckDB. Git and Grafana form a feedback loop.</desc>
