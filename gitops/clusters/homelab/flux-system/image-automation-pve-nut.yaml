---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: pve-nut
  namespace: flux-system
spec:
  image: ghcr.io/homeiac/pve-nut
  interval: 5m
  secretRef:
    name: ghcr-creds
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: pve-nut
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pve-nut
  filterTags:
    # Match build-sha tags (e.g. 42-abc1234) and extract the build number for
    # ordering. Alphabetical-desc on bare 7-char SHAs is unsound — see
    # build-pve-nut.yaml for the rationale.
    pattern: '^(\d+)-[a-f0-9]{7}$'
    extract: '$1'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: pve-nut
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        name: fluxcdbot
        email: fluxcd@homelab.local
      messageTemplate: |
        chore(flux): update pve-nut image to {{range .Changed.Changes}}{{.NewValue}}{{end}}
    push:
      branch: master
  update:
    path: ./gitops/clusters/homelab/infrastructure/nut-pve/deploy
    strategy: Setters
