apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-knowledge-index
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Homelab"
data:
  knowledge-index.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Knowledge index: photo inventory, Google quota, GPU summaries, ingest pipeline, host and disk health. Generated by scripts/knowledge-index/gen-dashboard.py",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Photo app traces, logs & triage",
          "url": "/d/photo-app/photo-app"
        }
      ],
      "panels": [
        {
          "id": 137,
          "type": "row",
          "title": "Work remaining & bottleneck",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 138,
          "type": "stat",
          "title": "Summaries still to do",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "(max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900))))",
              "legendFormat": "{{enricher}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "The worker counts pending items during batch selection and updates the count after successful Parquet writes. If the worker is offline, this falls back to the five-minute index export."
        },
        {
          "id": 139,
          "type": "stat",
          "title": "Summary finish estimate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "expr": "((((max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900)))) / (max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m]))) > 0)) and (max by(enricher) (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) (time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60)) == 1)) and on() ((vector(time()) < 1795280415) or (vector(time()) >= 1795281015))) or ((max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900)))) == 0) or ((((max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900)))) > 0) and (max by(enricher) (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) (time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60)) == 1)) and on() ((vector(time()) >= 1795280415) and (vector(time()) < 1795281015))) * 0 - 4 or (((max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900)))) > 0) and (max by(enricher) (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) (time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60)) == 0)) * 0 - 2 or (((max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900)))) > 0) unless max by(enricher) (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) (time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60))) * 0 - 3 or ((max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,enricher,job) ((time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1))) or max by(enricher) (media_summaries_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and on(instance,job) ((knowledge_index_exporter_success{instance=~\"$instance\"} == 1) and on(instance,job) (time() - node_textfile_mtime_seconds{file=~\".*/knowledge_index[.]prom\",instance=~\"$instance\"} < 900)))) > 0) * 0 - 1",
              "legendFormat": "{{enricher}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-4": {
                      "text": "Collecting two-slot writes",
                      "color": "blue"
                    },
                    "-1": {
                      "text": "No recent progress",
                      "color": "orange"
                    },
                    "-2": {
                      "text": "Worker stopped",
                      "color": "orange"
                    },
                    "-3": {
                      "text": "Worker status unknown",
                      "color": "gray"
                    },
                    "0": {
                      "text": "Queue clear",
                      "color": "green"
                    }
                  }
                }
              ],
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Current backlog divided by the last ten minutes of successful Parquet writes from all active backends. Assumes the same photo/video mix and no new arrivals. Requires a fresh running-worker heartbeat."
        },
        {
          "id": 140,
          "type": "stat",
          "title": "Summaries saved / minute",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m]))) * 60",
              "legendFormat": "{{enricher}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Successful rows saved to Parquet over the last ten minutes."
        },
        {
          "id": 141,
          "type": "stat",
          "title": "Summary bottleneck \u00b7 stage",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 7,
            "x": 17,
            "y": 1
          },
          "targets": [
            {
              "expr": "topk by(enricher)(1, (100 * sum by(enricher,title)(rate(media_pipeline_stage_seconds_total{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[30m])) / on(enricher) group_left sum by(enricher) (sum by(enricher,title)(rate(media_pipeline_stage_seconds_total{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[30m])))) > 0)",
              "legendFormat": "{{title}}",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "noValue": "No data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "description": "Largest share of measured operation time over 30 minutes. Concurrent operations each contribute time. Model requests include queueing, transport and inference."
        },
        {
          "id": 152,
          "type": "stat",
          "title": "Summaries saved/min \u00b7 before and now",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 10,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m] @ 1795280280)))) * 60) or (max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\",instance=\"pumped-piglet\",enricher=\"gemma4-e2b-p1\"}) * 0 + 11.789473684210524)",
              "legendFormat": "RTX \u00b7 one slot",
              "refId": "A",
              "instant": true,
              "range": false
            },
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m] @ 1795281480)))) * 60) or (max by(enricher) (media_pipeline_queue{instance=~\"$instance\",enricher=~\"$pipeline_enricher\",instance=\"pumped-piglet\",enricher=\"gemma4-e2b-p1\"}) * 0 + 20.208747368421054)",
              "legendFormat": "RTX \u00b7 two slots",
              "refId": "B",
              "instant": true,
              "range": false
            },
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m])))) * 60) and on() (vector(time()) >= 1795281015)",
              "legendFormat": "Current \u00b7 all backends",
              "refId": "C",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "noValue": "Awaiting sample"
            },
            "overrides": []
          },
          "options": {
            "textMode": "value_and_name",
            "orientation": "vertical",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "description": "Successful photo and video summaries committed to Parquet per minute. The one-slot baseline covers 16:48\u201316:58 UTC on Nov 21 with photo context active. The two-slot RTX baseline covers 17:08\u201317:18 UTC. Current includes writes from every active backend and cache. Media mix and cache hits can affect the rate."
        },
        {
          "id": 153,
          "type": "timeseries",
          "title": "Summary throughput over time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 14,
            "x": 10,
            "y": 5
          },
          "targets": [
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m])))) * 60) and on() (vector(time()) < 1795241400)",
              "legendFormat": "Gemma in Ollama",
              "refId": "A",
              "instant": false,
              "range": true,
              "interval": "30s"
            },
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m])))) * 60) and on() ((vector(time()) >= 1795241606) and (vector(time()) < 1795242360))",
              "legendFormat": "Standalone Bonsai",
              "refId": "B",
              "instant": false,
              "range": true,
              "interval": "30s"
            },
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m])))) * 60) and on() ((vector(time()) >= 1795242820) and (vector(time()) <= 1795280280))",
              "legendFormat": "Bonsai before backfill",
              "refId": "C",
              "instant": false,
              "range": true,
              "interval": "30s"
            },
            {
              "expr": "((max by(enricher) (sum by(instance,enricher) (rate(media_pipeline_persisted_items_total{status=\"ok\",instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[10m])))) * 60) and on() (vector(time()) >= 1795281015)",
              "legendFormat": "Bonsai \u00b7 summaries backfill",
              "refId": "D",
              "instant": false,
              "range": true,
              "interval": "30s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Gemma in Ollama"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "orange"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Standalone Bonsai"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "blue"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Bonsai before backfill"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "purple"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Bonsai \u00b7 summaries backfill"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "green"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "description": "Successful Parquet writes per minute in rolling ten-minute windows. The gap at the two-slot rollout excludes windows containing both configurations."
        },
        {
          "id": 154,
          "type": "stat",
          "title": "Luna captions saved to Parquet",
          "datasource": {
