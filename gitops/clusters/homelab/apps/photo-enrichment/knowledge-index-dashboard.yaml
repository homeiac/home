apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-knowledge-index
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Homelab"
data:
  knowledge-index.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Knowledge index: photo inventory, Google quota, GPU summaries, ingest pipeline, host and disk health. Generated by scripts/knowledge-index/gen-dashboard.py",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Photo app traces, logs & triage",
          "url": "/d/photo-app/photo-app"
        }
      ],
      "panels": [
        {
          "id": 175,
          "type": "row",
          "title": "Summary reconciliation \u00b7 Luna",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 188,
          "type": "stat",
          "title": "Available pairs processed",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "100 * (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"ok|skipped\"}))) / (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent|ok|skipped|unknown\"})) > 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Successful or deliberately skipped files divided by discovered local/Luna pairs. New pairs are added automatically every five minutes as local captions arrive, so this percentage can fall. 100% means caught up with discovered pairs, not both models complete over the whole library. Skipped files count as processed, not successful summaries."
        },
        {
          "id": 189,
          "type": "stat",
          "title": "Current speed \u00b7 combined",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "(sum(max by(runner) (rate(knowledge_index_reconciliation_runner_finished_total{instance=~\"$instance\"}[5m])))) * 60 and on() (time() - max(knowledge_index_reconciliation_updated_timestamp_seconds{instance=~\"$instance\"}) < 180)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: summaries/min",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Combined successful completions per minute across still-fawn and Mac, averaged over the last five minutes."
        },
        {
          "id": 190,
          "type": "stat",
          "title": "Estimated time remaining",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "expr": "(((sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"}))) / (sum(max by(runner) (rate(knowledge_index_reconciliation_runner_finished_total{instance=~\"$instance\"}[5m]))) > 0)) and on() (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"})) > 0) and on() (max(knowledge_index_reconciliation_blocked{instance=~\"$instance\"}) == 0) and on() (time() - max(knowledge_index_reconciliation_updated_timestamp_seconds{instance=~\"$instance\"}) < 180) or (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"})) == 0)) and on() (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"unknown\"})) == 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0,
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Caught up",
                      "color": "green"
                    }
                  }
                }
              ],
              "noValue": "Paused / no estimate"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Pending and in-flight files divided by combined five-minute completion rate. Assumes similar work and continued uptime. Hidden when blocked, reporting is over three minutes old, or no positive speed is measured."
        },
        {
          "id": 191,
          "type": "stat",
          "title": "Estimated finish time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 14,
            "y": 1
          },
          "targets": [
            {
              "expr": "((time() + (((((sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"}))) / (sum(max by(runner) (rate(knowledge_index_reconciliation_runner_finished_total{instance=~\"$instance\"}[5m]))) > 0)) and on() (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"})) > 0) and on() (max(knowledge_index_reconciliation_blocked{instance=~\"$instance\"}) == 0) and on() (time() - max(knowledge_index_reconciliation_updated_timestamp_seconds{instance=~\"$instance\"}) < 180) or (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"})) == 0)) and on() (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"unknown\"})) == 0)) > 0)) * 1000) or (((((sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"}))) / (sum(max by(runner) (rate(knowledge_index_reconciliation_runner_finished_total{instance=~\"$instance\"}[5m]))) > 0)) and on() (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"})) > 0) and on() (max(knowledge_index_reconciliation_blocked{instance=~\"$instance\"}) == 0) and on() (time() - max(knowledge_index_reconciliation_updated_timestamp_seconds{instance=~\"$instance\"}) < 180) or (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"})) == 0)) and on() (sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"unknown\"})) == 0)) == 0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsLocal",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "Caught up",
                      "color": "green"
                    }
                  }
                }
              ],
              "noValue": "Paused / no estimate"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Current time plus the estimated duration, shown in browser local time. This is an estimate, not a deadline."
        },
        {
          "id": 192,
          "type": "stat",
          "title": "Remaining cost \u00b7 observed",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 19,
            "y": 1
          },
          "targets": [
            {
              "expr": "(sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"}))) * 0.000869",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2,
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Last reported pending and in-flight files \u00d7 observed $0.869 per 1,000 successful reconciliations. Skipped files are excluded. Assumes similar work and overhead; this forecasts plan usage, not an invoice. Account usage readings remain only in the private local database. Token-based usage and reservation accounting below are separate."
        },
        {
          "id": 176,
          "type": "stat",
          "title": "Reconciled summaries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"ok\"}))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Successful current revisions among discovered local/Luna pairs, not whole-library caption coverage. New pairs are discovered every five minutes. Earlier revisions remain in history."
        },
        {
          "id": 177,
          "type": "stat",
          "title": "Ready pairs still to reconcile",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"}))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Pending and active items with both local and Luna captions. New pairs join automatically as local descriptions arrive. Prior successes and skipped items are preserved."
        },
        {
          "id": 178,
          "type": "stat",
          "title": "Critical reviews for you",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 5
          },
          "targets": [
            {
              "expr": "max(knowledge_index_reconciliation_risk{instance=~\"$instance\",risk=\"critical\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Only material contradictions about the main person or an important life, family or work event that cannot safely be omitted. Minor details and unknown background people never require review."
        },
        {
          "id": 179,
          "type": "stat",
          "title": "Minor differences handled",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "expr": "max(knowledge_index_reconciliation_risk{instance=~\"$instance\",risk=\"low\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Uncertain minor details were omitted or generalized automatically. These are not waiting for human review."
        },
        {
          "id": 180,
          "type": "stat",
          "title": "Skipped responses",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"skipped\"}))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Isolated unusable responses are skipped without retrying or stopping the queue. No action required from you; originals remain intact."
        },
        {
          "id": 181,
          "type": "stat",
          "title": "Progress / new-pair check age",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 5
          },
          "targets": [
            {
              "expr": "time() - max(knowledge_index_reconciliation_updated_timestamp_seconds{instance=~\"$instance\"})",
              "legendFormat": "Progress report",
              "refId": "A",
              "instant": true,
              "range": false
            },
            {
              "refId": "B",
              "expr": "time() - max(knowledge_index_reconciliation_discovery_timestamp_seconds{instance=~\"$instance\"})",
              "legendFormat": "New pairs checked",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 180
                  },
                  {
                    "color": "red",
                    "value": 600
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "description": "Time since progress publication and since the last successful scan for new local/Luna pairs. Discovery runs at most every five minutes across both runners. Old successes and skipped items are not resubmitted."
        },
        {
          "id": 182,
          "type": "timeseries",
          "title": "Reconciliation progress",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "expr": "sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"ok\"}))",
              "legendFormat": "Reconciled",
              "refId": "A"
            },
            {
              "expr": "sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"pending|reserved|sent\"}))",
              "legendFormat": "Remaining",
              "refId": "B"
            },
            {
              "expr": "sum(max by(state) (knowledge_index_reconciliation_jobs{instance=~\"$instance\",state=~\"skipped\"}))",
              "legendFormat": "Skipped",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "description": "Current revisions only, one row per file. New policy reassessments move affected results back to pending; older results remain preserved."
        },
        {
          "id": 183,
          "type": "timeseries",
          "title": "Reconciliations saved per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "expr": "max by(runner) (rate(knowledge_index_reconciliation_runner_finished_total{instance=~\"$instance\"}[$__rate_interval])) * 60",
              "legendFormat": "{{runner}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "description": "Luna requests are submitted by still-fawn and the Mac. These are cloud text-only reconciliations, not local GPU inference. Counts completed revisions, including intentional reassessments."
        },
        {
          "id": 184,
          "type": "stat",
          "title": "Worker safety check",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "max(knowledge_index_reconciliation_blocked{instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "No safety block",
                      "color": "green"
                    },
                    "1": {
                      "text": "Paused \u2014 check worker",
                      "color": "orange"
                    }
                  }
                }
              ],
              "noValue": "No recent data"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Authentication, rate-limit or usage-overrun protections pause new submissions. No safety block does not mean a worker is online or budget is available; check report age, saved/min and Luna budget available."
        },
        {
          "id": 185,
          "type": "stat",
          "title": "Reconciliation usage estimate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
