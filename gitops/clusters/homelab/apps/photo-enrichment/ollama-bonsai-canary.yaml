apiVersion: v1
kind: ConfigMap
metadata:
  name: ollama-bonsai-vision-canary-v1
  namespace: immich-pilot
data:
  check.mjs: "// Import verified local model files and exercise Ollama's native vision\
    \ API.\nimport { createHash } from 'node:crypto';\nimport { createReadStream,\
    \ createWriteStream } from 'node:fs';\nimport { mkdir, rename, rm } from 'node:fs/promises';\n\
    import { pipeline } from 'node:stream/promises';\nimport { execFileSync } from\
    \ 'node:child_process';\n\nconst endpoint = process.env.OLLAMA_ENDPOINT ?? 'http://127.0.0.1:11434';\n\
    const model = 'bonsai-27b';\nconst files = {\n  'Bonsai-27B-Q1_0.gguf': '17ef842e47450caeb8eaa3ebfbbab5d2f2278b62b79be107985fb69a2f819aa0',\n\
    \  'Bonsai-27B-mmproj-Q8_0.gguf': 'eb561d41a7bbeb0fcf04883c8af11078ef6cae0a66862a0b68443cfca495269d',\n\
    };\n\nasync function request(path, body, timeout = 300_000) {\n  const options\
    \ = { signal: AbortSignal.timeout(timeout) };\n  if (body) Object.assign(options,\
    \ { method: 'POST', headers: {'Content-Type': 'application/json'},\n    body:\
    \ JSON.stringify(body) });\n  const response = await fetch(endpoint + path, options);\n\
    \  const data = await response.json();\n  if (!response.ok || data.error) throw\
    \ new Error(`${path}: ${response.status} ${data.error ?? ''}`);\n  return data;\n\
    }\n\nasync function importModel() {\n  await mkdir('/store/blobs', {recursive:\
    \ true});\n  for (const [name, hash] of Object.entries(files)) {\n    const destination\
    \ = `/store/blobs/sha256-${hash}`;\n    const temp = destination + '.bonsai-import';\n\
    \    const digest = createHash('sha256');\n    try {\n      await pipeline(createReadStream(`/source/${name}`),\
    \ async function* (chunks) {\n        for await (const chunk of chunks) {\n  \
    \        digest.update(chunk);\n          yield chunk;\n        }\n      }, createWriteStream(temp));\n\
    \      if (digest.digest('hex') !== hash) throw new Error(`SHA-256 mismatch: ${name}`);\n\
    \      await rename(temp, destination);\n    } finally {\n      await rm(temp,\
    \ {force: true});\n    }\n    console.log(`Verified and staged ${name}`);\n  }\n\
    \  await request('/api/create', { model, stream: false,\n    files: Object.fromEntries(Object.entries(files).map(([name,\
    \ digest]) => [name, `sha256:${digest}`])),\n    renderer: 'qwen3.5', parser:\
    \ 'qwen3.5', parameters: {num_ctx: 8192} });\n  const info = await request('/api/show',\
    \ {model});\n  console.log(JSON.stringify({event: 'imported', capabilities: info.capabilities,\
    \ details: info.details}));\n  if (!info.capabilities?.includes('vision')) throw\
    \ new Error('Imported model has no vision capability');\n}\n\nfunction ffmpeg(args)\
    \ {\n  return execFileSync('ffmpeg', ['-v', 'error', '-nostdin', ...args], { maxBuffer:\
    \ 8 * 1024 * 1024 });\n}\n\nasync function visionCheck(name, images, question,\
    \ expected) {\n  console.log(JSON.stringify({event: 'started', name, frames: images.length}));\n\
    \  const response = await request('/api/chat', {model, think: false, stream: false,\
    \ keep_alive: '5m',\n    options: {num_ctx: 8192, num_thread: 2, num_predict:\
    \ 160, temperature: 0},\n    messages: [{role: 'user', content: question, images:\
    \ images.map(image => image.toString('base64'))}]}, 540_000);\n  const raw = response.message?.content\
    \ ?? '';\n  const result = JSON.parse(raw.match(/\\{[\\s\\S]*\\}/)?.[0] ?? 'null');\n\
    \  console.log(JSON.stringify({event: 'completed', name, frames: images.length,\n\
    \    seconds: response.total_duration / 1e9, promptTokens: response.prompt_eval_count,\
    \ content: raw}));\n  if (!result?.summary || !Array.isArray(result.tags) || !expected.test(result.summary))\
    \ {\n    throw new Error(`Invalid or visually incorrect ${name} caption`);\n \
    \ }\n}\n\nif (process.env.IMPORT_MODEL !== 'false') await importModel();\nconst\
    \ photo = ffmpeg(['-f', 'lavfi', '-i', 'color=c=green:s=768x512', '-frames:v',\
    \ '1', '-f', 'mjpeg', '-']);\nawait visionCheck('photo', [photo], 'What solid\
    \ color covers this photo? Answer only with JSON containing summary and tags.',\
    \ /\\bgreen\\b/i);\n\n// Use actual decoded frames from a two-scene video, in\
    \ reverse alphabetical color order.\nconst vid = '/tmp/bonsai-vision-canary.mp4';\n\
    ffmpeg(['-y', '-f', 'lavfi', '-i', 'color=c=red:s=768x512:r=2:d=2', '-f', 'lavfi',\
    \ '-i', 'color=c=blue:s=768x512:r=2:d=2',\n  '-filter_complex', 'concat=n=2:v=1:a=0',\
    \ '-c:v', 'libx264', vid]);\nconst frames = Array.from({length: 8}, (_, i) =>\
    \ ffmpeg(['-ss', String(i / 2), '-i', vid, '-frames:v', '1', '-f', 'mjpeg', '-']));\n\
    if (frames.some(frame => !frame.length)) throw new Error('Failed to decode all\
    \ eight video frames');\nawait visionCheck('video', frames, 'These images are\
    \ eight frames from a video in chronological order. In summary, state the first\
    \ and last colors in order. Answer only with JSON containing summary and tags.',\
    \ /\\bred\\b.*\\bblue\\b/is);\nconst active = await request('/api/ps');\nconsole.log(JSON.stringify({event:'passed',\
    \ models: active.models.map(({name, size, size_vram}) => ({name, size, size_vram}))}));\n"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-bonsai-vision-canary-v1
  namespace: immich-pilot
spec:
  podSelector:
    matchLabels:
      app: ollama-bonsai-vision-canary-v1
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-bonsai-vision-canary-v1
  namespace: immich-pilot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1500
  template:
    metadata:
      labels:
        app: ollama-bonsai-vision-canary-v1
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-pumped-piglet-gpu
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: ollama
        image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
        args:
        - serve
        restartPolicy: Always
        env:
        - name: OLLAMA_HOST
          value: 127.0.0.1:11434
        - name: OLLAMA_MODELS
          value: /store
        - name: OLLAMA_NO_CLOUD
          value: 'true'
        - name: OLLAMA_NUM_PARALLEL
          value: '1'
        - name: OLLAMA_MAX_LOADED_MODELS
          value: '1'
        - name: CUDA_VISIBLE_DEVICES
          value: '-1'
        startupProbe:
          exec:
            command:
            - ollama
            - list
          periodSeconds: 5
          failureThreshold: 24
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: '2'
            memory: 10Gi
        securityContext: &id001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - &id002
          name: store
          mountPath: /store
      containers:
      - name: canary
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        command:
        - node
        - /scripts/check.mjs
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext: *id001
        volumeMounts:
        - *id002
        - name: source
          mountPath: /source
          readOnly: true
        - name: script
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: store
        emptyDir:
          sizeLimit: 8Gi
      - name: source
        hostPath:
          path: /var/lib/photo-models/bonsai-27b
          type: Directory
      - name: script
        configMap:
          name: ollama-bonsai-vision-canary-v1
