apiVersion: v1
kind: ConfigMap
metadata:
  name: waffles-media
  namespace: immich-pilot
data:
  media-fallback-core.mjs: "// Recover a still image when Immich's generated preview\
    \ is absent.\nimport {createRequire} from 'node:module';\nimport fs from 'node:fs/promises';\n\
    import {spawn} from 'node:child_process';\nimport path from 'node:path';\nimport\
    \ crypto from 'node:crypto';\nconst require=createRequire('/usr/src/app/server/package.json');\n\
    export const error=(reason,status=502)=>Object.assign(Error(reason),{status});\n\
    \nexport async function download(response,destination,maxBytes=128*1024*1024)\
    \ {\n  if(!response.ok){await response.body?.cancel();throw error('source_http_'+response.status,response.status);}\n\
    \  if(Number(response.headers.get('content-length'))>maxBytes){await response.body?.cancel();throw\
    \ error('media_too_large',413);}\n  const file=await fs.open(destination,'wx');let\
    \ bytes=0;\n  try {for await(const chunk of response.body){bytes+=chunk.length;if(bytes>maxBytes)throw\
    \ error('media_too_large',413);await file.writeFile(chunk);}return bytes;}\n \
    \ finally {await file.close();}\n}\n\nexport function extractFrame(input,output)\
    \ {\n  return new Promise((resolve,reject)=>{\n    // First displayed frame, one\
    \ decode thread, autorotation enabled by ffmpeg.\n    // Paths are generated internally;\
    \ credentials and URLs never enter argv/logs.\n    const child=spawn('ffmpeg',['-nostdin','-hide_banner','-loglevel','error','-threads','1','-i',input,\n\
    \      '-map','0:v:0','-frames:v','1','-vf',\"scale=w='min(1600,iw)':h='min(1600,ih)':force_original_aspect_ratio=decrease\"\
    ,\n      '-threads','1','-q:v','2','-y',output],{stdio:'ignore'});\n    const\
    \ timer=setTimeout(()=>{child.kill('SIGKILL');reject(error('frame_timeout',504));},15000);\n\
    \    child.once('error',()=>{clearTimeout(timer);reject(error('frame_spawn_failed'));});\n\
    \    child.once('exit',code=>{clearTimeout(timer);code===0?resolve():reject(error('frame_decode_failed',422));});\n\
    \  });\n}\n\nexport async function recover({base,key,id,directory,fetcher=fetch,frame=extractFrame,normalize})\
    \ {\n  const fetchAsset=suffix=>fetcher(base+'/api/assets/'+id+suffix,{headers:{'x-api-key':key},redirect:'error',signal:AbortSignal.timeout(20000)});\n\
    \  const metadata=await fetchAsset('');if(!metadata.ok)throw error('metadata_http_'+metadata.status,metadata.status);\n\
    \  const asset=await metadata.json();\n  if(!['IMAGE','VIDEO'].includes(asset.type))throw\
    \ error('unsupported_asset_type',422);\n  const work=await fs.mkdtemp(path.join(directory,'working-'));\n\
    \  try {\n    const input=path.join(work,'input');const jpeg=path.join(work,'frame.jpg');\n\
    \    const source=asset.type==='VIDEO'?'video/playback':'original';\n    await\
    \ download(await fetchAsset('/'+source),input,asset.type==='VIDEO'?128*1024*1024:32*1024*1024);\n\
    \    if(asset.type==='VIDEO')await frame(input,jpeg);\n    else {\n      const\
    \ convert=normalize??(async(source,target)=>require('sharp')(source,{limitInputPixels:40000000}).rotate().resize({width:1600,height:1600,fit:'inside',withoutEnlargement:true}).jpeg({quality:90}).toFile(target));\n\
    \      await convert(input,jpeg);\n    }\n    const bytes=await fs.readFile(jpeg);\n\
    \    if(bytes.length<4||bytes[0]!==0xff||bytes[1]!==0xd8)throw error('invalid_fallback_image',422);\n\
    \    return {bytes,source:asset.type==='VIDEO'?'video_first_frame':'original_image',sha256:crypto.createHash('sha256').update(bytes).digest('hex')};\n\
    \  } finally {await fs.rm(work,{recursive:true,force:true});}\n}\n"
  media-fallback.mjs: "// Separate bounded decoder: inference processes retain their\
    \ production capacity.\nimport http from 'node:http';\nimport fs from 'node:fs/promises';\n\
    import crypto from 'node:crypto';\nimport {recover,error} from './media-fallback-core.mjs';\n\
    const base=process.env.IMMICH_URL??'http://immich-server.immich-pilot.svc.cluster.local:2283';\n\
    const directory=process.env.MEDIA_CACHE??'/data/frames-v1';await fs.mkdir(directory,{recursive:true});\n\
    const token=process.env.WORKER_TOKEN,key=process.env.IMMICH_API_KEY;\nif(!token||!key)throw\
    \ Error('Missing credentials');\nlet active=0,success=0,failed=0;const waiting=[];const\
    \ inflight=new Map();\nasync function acquire(){if(active>=2){if(waiting.length>=24)throw\
    \ error('decoder_busy',429);await new Promise(resolve=>waiting.push(resolve));}else\
    \ active++;}\nfunction release(){const next=waiting.shift();if(next)next();else\
    \ active--;}\nfunction allowed(value){return typeof value==='string'&&value.length===token.length&&crypto.timingSafeEqual(Buffer.from(value),Buffer.from(token));}\n\
    async function get(id){\n  const cache=directory+'/'+id+'.jpg';try{return {bytes:await\
    \ fs.readFile(cache),source:'cached_fallback'};}catch(e){if(e.code!=='ENOENT')throw\
    \ e;}\n  if(inflight.has(id))return inflight.get(id);\n  const promise=(async()=>{await\
    \ acquire();try{\n    const result=await recover({base,key,id,directory});\n \
    \   const tmp=cache+'.tmp';await fs.writeFile(tmp,result.bytes);await fs.rename(tmp,cache);\n\
    \    await fs.writeFile(cache+'.json',JSON.stringify({source:result.source,sha256:result.sha256,created_at:new\
    \ Date().toISOString()}));success++;return result;\n  }finally{release();}})().finally(()=>inflight.delete(id));inflight.set(id,promise);return\
    \ promise;\n}\nhttp.createServer(async(req,res)=>{\n  if(req.url==='/healthz'){res.end('ok');return;}\n\
    \  if(!allowed(req.headers.authorization?.replace(/^Bearer /,''))){res.writeHead(401);res.end();return;}\n\
    \  const match=/^\\/assets\\/([0-9a-f-]{36})$/.exec(req.url);\n  if(req.method!=='GET'||!match){res.writeHead(404);res.end();return;}\n\
    \  try{const result=await get(match[1]);res.writeHead(200,{'Content-Type':'image/jpeg','X-Waffles-Media-Source':result.source});res.end(result.bytes);}\n\
    \  catch(e){failed++;res.writeHead(Number.isInteger(e.status)?e.status:502);res.end('fallback\
    \ unavailable');console.log(JSON.stringify({event:'fallback_error',reason:/^[a-z0-9_]+$/.test(e.message)?e.message:'internal_error',active,queued:waiting.length}));}\n\
    }).listen(9201);\nsetInterval(()=>console.log(JSON.stringify({event:'progress',success,failed,active,queued:waiting.length})),15000).unref();\n\
    console.log(JSON.stringify({event:'start',concurrency:2,maximum_queue:24,maximum_source_bytes:134217728}));\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: waffles-media
  namespace: immich-pilot
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waffles-media
  namespace: immich-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: waffles-media
  template:
    metadata:
      labels: *id001
      annotations:
        checksum/code: 7040abb4b44fc3ed1bec1f9d422e3a955f7e058d3393d7b824827ca2182db5e2
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-still-fawn
      volumes:
      - name: code
        configMap:
          name: waffles-media
      - name: data
        persistentVolumeClaim:
          claimName: waffles-media
      containers:
      - name: media
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        command:
        - node
        - /code/media-fallback.mjs
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        env:
        - name: IMMICH_API_KEY
          valueFrom:
            secretKeyRef:
              name: immich-pet-tagger
              key: api-key
        - name: WORKER_TOKEN
          valueFrom:
            secretKeyRef:
              name: waffles-queue
              key: worker-token
        volumeMounts:
        - name: code
          mountPath: /code
          readOnly: true
        - name: data
          mountPath: /data
        ports:
        - name: http
          containerPort: 9201
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: waffles-media
  namespace: immich-pilot
spec:
  selector:
    app: waffles-media
  ports:
  - name: http
    port: 9201
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: waffles-media
  namespace: immich-pilot
spec:
  podSelector:
    matchLabels:
      app: waffles-media
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: waffles-queue
    ports:
    - protocol: TCP
      port: 9201
