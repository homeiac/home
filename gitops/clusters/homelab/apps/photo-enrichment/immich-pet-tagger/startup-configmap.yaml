apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-pet-tagger-startup
  namespace: immich-pilot
data:
  startup.py: "\"\"\"Keep automatic scans disabled until reference selection and validation\
    \ finish.\"\"\"\nimport asyncio\nimport os\nimport sys\n\nsys.path.insert(0, '/app')\n\
    import main\nimport uvicorn\n\n\nasync def wait_for_enrollment() -> None:\n  \
    \  \"\"\"Leave manual UI/API scans available while the automatic poller is disabled.\"\
    \"\"\n    while True:\n        await asyncio.sleep(3600)\n\n\nif os.environ.get('AUTOMATIC_SCANS',\
    \ 'false').lower() != 'true':\n    main.polling_loop = wait_for_enrollment\n\n\
    uvicorn.run(main.app, host='0.0.0.0', port=8000, timeout_keep_alive=120)\n"
