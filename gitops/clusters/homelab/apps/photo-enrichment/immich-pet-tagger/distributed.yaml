    \    token=Path(os.environ['WORKER_TOKEN_FILE']).read_text().strip()\n    children=[];stopping=False;target=0;last_heartbeat=0\n\
    \    def stop(*_):\n        nonlocal stopping\n        stopping=True\n    signal.signal(signal.SIGTERM,stop);signal.signal(signal.SIGINT,stop)\n\
