apiVersion: batch/v1
kind: Job
metadata:
  name: waffles-schema-v4
  namespace: database
spec:
  backoffLimit: 3
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: code
        configMap:
          name: waffles-code
      restartPolicy: Never
      containers:
      - name: queue
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /code
          readOnly: true
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        command:
        - node
        - /code/bootstrap.mjs
        env:
        - name: PGHOST
          value: postgres-postgresql.database.svc.cluster.local
        - name: PGDATABASE
          value: photo_enrichment
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
