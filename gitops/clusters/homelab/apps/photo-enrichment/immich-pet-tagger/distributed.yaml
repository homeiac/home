    \                    except Exception:pass\n            children=[item for item\
    \ in children if item['process'].poll() is None]\n            try:\n         \
    \       tuning=request('/api/tuning')\n                target=int(tuning['workers'][worker]['slots'])\n\
    \                if not 0<=target<=int(tuning['limits'][worker]):raise ValueError('Invalid\
