  test-queue.mjs: "// Pure validation checks run locally; --postgres also exercises\
    \ real concurrent claims.\nimport assert from 'node:assert/strict';\nimport {createRequire}\
    \ from 'node:module';\nimport {claim,finish,validateResult,validateTuning} from\
    \ './queue-core.mjs';\nconst value={seconds:1.2,size:[100,80],matches:[{box:[0.1,0.1,0.8,0.9],probability:0.95}],unknown:0,low_confidence:0,out_of_range:0};\n\
    assert.equal(validateResult(value).seconds,1.2);\nassert.deepEqual(validateTuning('mac',4),{slots:4});\n\
    assert.deepEqual(validateTuning('still-fawn',0),{slots:0});\nfor(const [worker,slots]\
    \ of [['mac',5],['pve',2],['still-fawn',-1],['rtx',1],['mac',1.5]])assert.throws(()=>validateTuning(worker,slots));\n\
    const calls=[];\nconst connection={query:async(sql)=>{calls.push(sql);return {rows:sql.includes('RETURNING')?[{asset_id:'test'}]:[]};},release:()=>calls.push('release')};\n\
    assert.equal((await claim({connect:async()=>connection},'mac')).asset_id,'test');\n\
    assert.equal(calls[0],'BEGIN');assert(calls[1].includes('pg_advisory_xact_lock'));assert(calls[2].includes('count(*)'));assert.equal(calls[3],'COMMIT');assert.equal(calls[4],'release');\n\
    for(const bad of [{...value,seconds:NaN},{...value,matches:[{box:[0.8,0,0.1,1],probability:0.95}]},{...value,matches:[{box:[0,0,1,1],probability:0.89}]}])\n\
    \  assert.throws(()=>validateResult(bad));\nif(process.argv.includes('--postgres'))\
    \ {\n  const {Pool}=createRequire('/usr/src/app/server/package.json')('pg');\n\
    \  const db=new Pool({max:3});const id='queue-test-'+Date.now();\n  try {\n  \
    \  await db.query(\"INSERT INTO waffles.runs(id,mode,state,workers,config) VALUES($1,'benchmark','running',ARRAY['pve','still-fawn'],'{}')\"\
    ,[id]);\n    for(let n=1;n<=2;n++)await db.query(\"INSERT INTO waffles.jobs(run_id,asset_id,taken_at,ordinal)\
    \ VALUES($1,$2,'2020-01-01',$3)\",[id,'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),n]);\n\
    \    const [a,b]=await Promise.all([claim(db,'pve'),claim(db,'still-fawn')]);\n\
    \    assert(a&&b&&a.asset_id!==b.asset_id,'Workers must receive distinct assets');\n\
    \    await db.query(\"UPDATE waffles.jobs SET lease_until=now()-interval '1 second'\
    \ WHERE run_id=$1 AND asset_id=$2\",[id,a.asset_id]);\n    assert.equal(await\
    \ finish(db,a,value),false,'Expired claims cannot commit');\n    const retry=await\
    \ claim(db,'pve');assert.equal(retry.asset_id,a.asset_id);assert.notEqual(retry.claim,a.claim);\n\
    \    assert.equal(await finish(db,a,value),false,'Old fencing token cannot commit');\n\
    \    assert.equal(await finish(db,retry,value),true);\n    assert.equal(await\
    \ finish(db,retry,value),false,'Duplicate completion cannot commit twice');\n\
    \    assert.equal(await finish(db,b,value),true);\n    assert.equal((await db.query(\"\
    SELECT count(*)::int n FROM waffles.jobs WHERE run_id=$1 AND status='complete'\"\
    ,[id])).rows[0].n,2);\n    console.log('PostgreSQL concurrency, lease expiry,\
    \ fencing and duplicate completion tests passed');\n  } finally {\n    await db.query('DELETE\
    \ FROM waffles.jobs WHERE run_id=$1',[id]);\n    await db.query('DELETE FROM waffles.runs\
    \ WHERE id=$1',[id]);await db.end();\n  }\n}\nconsole.log('Result validation checks\
    \ passed');\n"
