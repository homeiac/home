apiVersion: v1
kind: ConfigMap
metadata:
  name: waffles-code
  namespace: immich-pilot
data:
  schema.sql: "-- Reuse photo_enrichment's fenced SKIP LOCKED job pattern in an isolated\
    \ schema.\nCREATE TABLE IF NOT EXISTS waffles.settings (\n  key text PRIMARY KEY,\
    \ value jsonb NOT NULL\n);\nCREATE TABLE IF NOT EXISTS waffles.runs (\n  id text\
    \ PRIMARY KEY, mode text NOT NULL CHECK(mode IN ('benchmark','production')),\n\
    \  state text NOT NULL DEFAULT 'paused' CHECK(state IN ('paused','running','complete')),\n\
    \  workers text[] NOT NULL, config jsonb NOT NULL,\n  created_at timestamptz NOT\
    \ NULL DEFAULT now(), started_at timestamptz, finished_at timestamptz\n);\nCREATE\
    \ TABLE IF NOT EXISTS waffles.jobs (\n  run_id text NOT NULL REFERENCES waffles.runs(id),\
    \ asset_id uuid NOT NULL,\n  taken_at text NOT NULL, ordinal integer NOT NULL,\n\
    \  status text NOT NULL DEFAULT 'pending' CHECK(status IN ('pending','running','classified','complete','failed')),\n\
    \  claim uuid, worker text, lease_until timestamptz,\n  available_at timestamptz\
    \ NOT NULL DEFAULT now(), attempts integer NOT NULL DEFAULT 0,\n  result jsonb,\
    \ processing_seconds double precision, completed_at timestamptz,\n  applied integer\
    \ NOT NULL DEFAULT 0, last_error text,\n  PRIMARY KEY(run_id, asset_id)\n);\n\
    CREATE INDEX IF NOT EXISTS waffles_jobs_claim ON waffles.jobs(run_id,status,available_at,ordinal);\n\
    CREATE TABLE IF NOT EXISTS waffles.workers (\n  name text PRIMARY KEY, reported_at\
    \ timestamptz NOT NULL DEFAULT now(), device text,\n  ready boolean NOT NULL DEFAULT\
    \ false, model_seconds double precision,\n  rss_bytes bigint\n);\nCREATE TABLE\
    \ IF NOT EXISTS waffles.instances (\n  id text PRIMARY KEY, worker text NOT NULL,\
    \ reported_at timestamptz NOT NULL DEFAULT now(),\n  device text, ready boolean\
    \ NOT NULL DEFAULT false, draining boolean NOT NULL DEFAULT false,\n  rss_bytes\
    \ bigint NOT NULL DEFAULT 0, exit_code integer\n);\nCREATE TABLE IF NOT EXISTS\
    \ waffles.tuning_events (\n  id bigserial PRIMARY KEY, worker text NOT NULL, slots\
    \ integer NOT NULL,\n  changed_at timestamptz NOT NULL DEFAULT now(), note text\
    \ NOT NULL DEFAULT ''\n);\nINSERT INTO waffles.settings(key,value) VALUES('tuning',\n\
    \ '{\"mac\":{\"slots\":1},\"pve\":{\"slots\":1},\"still-fawn\":{\"slots\":1},\"\
    fun-bedbug\":{\"slots\":1},\"chief-horse\":{\"slots\":1}}')\n ON CONFLICT(key)\
    \ DO NOTHING;\n"
  bootstrap.mjs: "// Same scoped-role bootstrap pattern as immich_sync/bootstrap.mjs\
    \ (#217).\nimport {createRequire} from 'node:module';\nimport fs from 'node:fs/promises';\n\
