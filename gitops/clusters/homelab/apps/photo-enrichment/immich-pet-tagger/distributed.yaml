    \ is checked on every asset.\nexport async function discover(pool, api) {\n  const\
    \ db=await pool.connect();\n  let locked=false;\n  try {\n    locked=(await db.query('SELECT\
    \ pg_try_advisory_lock(244,2) AS locked')).rows[0].locked;\n    if(!locked)return;\n\
    \    const settings=(await db.query(\"SELECT value FROM waffles.settings WHERE\
    \ key='discovery'\")).rows[0]?.value;\n    if(!settings?.enabled||Date.now()-Date.parse(settings.last_success??0)<3600000)return;\n\
    \    const owner=(await(await api('/users/me')).json()).id;\n    if(!owner)throw\
    \ Error('Owner unavailable');\n    const config=(await db.query(\"SELECT value\
    \ FROM waffles.settings WHERE key='config'\")).rows[0].value;\n    const until=new\
    \ Date().toISOString();\n    await db.query(`INSERT INTO waffles.runs(id,mode,state,workers,config,started_at)\n\
    \      VALUES('new-uploads','production','running',ARRAY['mac','pve','still-fawn'],$1,now())\
    \ ON CONFLICT(id) DO NOTHING`,[config]);\n    let cursor=null,added=0;\n    const\
    \ seen=new Set();\n    do {\n      const body={size:1000,filter:{trashedAt:{eq:null},createdAt:{gte:settings.since,lte:until}},orderBy:{field:'fileCreatedAt',direction:'asc'}};\n\
    \      if(cursor)body.cursor=cursor;\n      const response=await(await api('/search/metadata','POST',body)).json();\n\
    \      const block=response.assets??response;\n      if(!Array.isArray(block.items))throw\
    \ Error('Unexpected search response');\n      const items=block.items.filter(a=>a.ownerId===owner).map(a=>({id:a.id,date:a.fileCreatedAt}));\n\
    \      // Page insertion is atomic and idempotent. Cursor advances only after\
    \ all\n      // pages succeed; a retry overlaps safely with historical and prior\
    \ uploads.\n      added+=(await db.query(`INSERT INTO waffles.jobs(run_id,asset_id,taken_at,ordinal)\n\
