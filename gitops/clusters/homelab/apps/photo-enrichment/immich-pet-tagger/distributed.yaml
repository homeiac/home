  burst_guard.py: "\"\"\"Protect the permanent baseline by refusing extra workers\
    \ under memory pressure.\"\"\"\nfrom pathlib import Path\nimport subprocess\n\
    import sys\nimport time\n\nwarning_since=None\n\ndef can_run(starting=False):\n\
    \    global warning_since\n    if sys.platform=='darwin':\n        try:level=int(subprocess.check_output(['sysctl','-n','kern.memorystatus_vm_pressure_level'],text=True))\n\
    \        except Exception:return False\n        if level==1:warning_since=None;return\
    \ True\n        if starting or level>=4:return False\n        if warning_since\
    \ is None:warning_since=time.monotonic()\n        return time.monotonic()-warning_since<6\n\
    \    try:\n        memory=dict(line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())\n\
    \        if int(memory['MemAvailable'].split()[0])<(1800 if starting else 512)*1024:return\
    \ False\n        limit=Path('/sys/fs/cgroup/memory.max').read_text().strip()\n\
    \        current=int(Path('/sys/fs/cgroup/memory.current').read_text())\n    \
    \    return limit=='max' or int(limit)-current>(1500 if starting else 128)*1024**2\n\
    \    except Exception:return False\n"
  test-queue.mjs: "// Pure validation checks run locally; --postgres also exercises\
    \ real concurrent claims.\nimport assert from 'node:assert/strict';\nimport {createRequire}\
    \ from 'node:module';\nimport {claim,finish,fail,applyFailure,validateResult,validateTuning,validateBurst}\
    \ from './queue-core.mjs';\nconst value={seconds:1.2,size:[100,80],matches:[{box:[0.1,0.1,0.8,0.9],probability:0.95}],unknown:0,low_confidence:0,out_of_range:0};\n\
    assert.equal(validateResult(value).seconds,1.2);\nassert.deepEqual(validateTuning('mac',1),{slots:1});\n\
    for(const [worker,slots] of [['mac',4],['pve',2],['still-fawn',0],['rtx',1],['mac',1.5]])assert.throws(()=>validateTuning(worker,slots));\n\
    assert.deepEqual(validateBurst('mac',15,'benchmark'),{slots:15,mode:'benchmark',cpu_cores:0,device:'mps',cpu_threads:2});\n\
    assert.deepEqual(validateBurst('still-fawn',0,'production'),{slots:0,mode:'production',cpu_cores:3,device:'cpu',cpu_threads:2});\n\
    assert.deepEqual(validateBurst('still-fawn',2,'benchmark',1),{slots:2,mode:'benchmark',cpu_cores:1,device:'cpu',cpu_threads:2});\n\
    assert.throws(()=>validateBurst('still-fawn',2,'benchmark',4));\nassert.equal(validateBurst('mac',1,'benchmark',0,'cpu').device,'cpu');\n\
    assert.equal(validateBurst('mac',1,'benchmark',0,'cpu',16).cpu_threads,16);\n\
    assert.throws(()=>validateBurst('mac',1,'benchmark',0,'cpu',17));\nassert.throws(()=>validateBurst('still-fawn',1,'benchmark',1,'mps'));\n\
    assert.throws(()=>validateBurst('mac',1,'benchmark',0,'cuda'));\nfor(const [worker,slots,mode]\
    \ of [['mac',16,'benchmark'],['pve',2,'production'],['chief-horse',1,'production'],['mac',-1,'production'],['mac',1,'other']])assert.throws(()=>validateBurst(worker,slots,mode));\n\
    const calls=[];\nconst connection={query:async(sql)=>{calls.push(sql);return {rows:sql.includes('RETURNING')?[{asset_id:'test'}]:[]};},release:()=>calls.push('release')};\n\
    assert.equal((await claim({connect:async()=>connection},'mac')).asset_id,'test');\n\
    assert.equal(calls[0],'BEGIN');assert(calls[1].includes('pg_advisory_xact_lock'));assert(calls[2].includes('count(*)'));assert.equal(calls[3],'COMMIT');assert.equal(calls[4],'release');\n\
    for(const bad of [{...value,seconds:NaN},{...value,matches:[{box:[0.8,0,0.1,1],probability:0.95}]},{...value,matches:[{box:[0,0,1,1],probability:0.89}]}])\n\
    \  assert.throws(()=>validateResult(bad));\nif(process.argv.includes('--postgres'))\
    \ {\n  const {Pool}=createRequire('/usr/src/app/server/package.json')('pg');\n\
    \  const db=new Pool({max:4});const suffix=String(Date.now());\n  const names=Object.fromEntries(['jobs','runs','settings'].map(n=>[n,'waffles.test_'+n+'_'+suffix]));\n\
    \  const rewrite=sql=>Object.entries(names).reduce((s,[name,table])=>s.replaceAll('waffles.'+name,table),sql).replaceAll('pg_advisory_xact_lock(244,','pg_advisory_xact_lock(1244,');\n\
    \  const isolated={query:(sql,args)=>db.query(rewrite(sql),args),connect:async()=>{const\
    \ connection=await db.connect();return {query:(sql,args)=>connection.query(rewrite(sql),args),release:()=>connection.release()};}};\n\
    \  try {\n    for(const name of ['runs','jobs','settings'])await db.query(`CREATE\
    \ TABLE ${names[name]} (LIKE waffles.${name} INCLUDING ALL)`);\n    await db.query(`ALTER\
    \ TABLE ${names.jobs} ADD COLUMN IF NOT EXISTS pool text NOT NULL DEFAULT 'base'`);\n\
    \    await db.query(`ALTER TABLE ${names.jobs} ADD COLUMN IF NOT EXISTS device\
    \ text`);\n    await db.query(`ALTER TABLE ${names.jobs} ADD COLUMN IF NOT EXISTS\
    \ apply_attempts integer NOT NULL DEFAULT 0`);\n    await isolated.query(\"INSERT\
    \ INTO waffles.settings VALUES('burst','{\\\"pve\\\":{\\\"slots\\\":2,\\\"mode\\\
    \":\\\"benchmark\\\"}}')\");\n    for(const [id,mode] of [['bench','benchmark'],['prod','production']])\
    \ {\n      await isolated.query(\"INSERT INTO waffles.runs(id,mode,state,workers,config)\
    \ VALUES($1,$2,'running',ARRAY['pve'],'{}')\",[id,mode]);\n      for(let n=1;n<=3;n++)await\
    \ isolated.query(\"INSERT INTO waffles.jobs(run_id,asset_id,taken_at,ordinal)\
    \ VALUES($1,$2,'2020-01-01',$3)\",[id,'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),n]);\n\
    \    }\n    const [a,b,c]=await Promise.all([claim(isolated,'pve','burst'),claim(isolated,'pve','burst'),claim(isolated,'pve','burst')]);\n\
    \    const leased=[a,b,c].filter(Boolean);assert.equal(leased.length,2,'Concurrent\
    \ claims cannot exceed burst slots');\n    assert.notEqual(leased[0].asset_id,leased[1].asset_id);\n\
    \    const baseline=await claim(isolated,'pve');assert.equal(baseline.run_id,'prod','Baseline\
    \ keeps serving production while burst slots are occupied');\n    assert.equal(await\
    \ claim(isolated,'pve'),null,'Baseline cap remains one');\n    const old=leased[0];\n\
    \    await isolated.query(\"UPDATE waffles.jobs SET lease_until=now()-interval\
    \ '1 second' WHERE run_id=$1 AND asset_id=$2\",[old.run_id,old.asset_id]);\n \
    \   assert.equal(await finish(isolated,old,value),false,'Expired claims cannot\
    \ commit');\n    const retry=await claim(isolated,'pve','burst');assert.equal(retry.asset_id,old.asset_id);assert.notEqual(retry.claim,old.claim);\n\
    \    assert.equal(await finish(isolated,old,value),false,'Old fencing token cannot\
    \ commit');\n    assert.equal(await finish(isolated,retry,value),true);\n    assert.equal(await\
    \ finish(isolated,retry,value),false,'Duplicate completion cannot commit twice');\n\
    \    await isolated.query(\"UPDATE waffles.settings SET value='{\\\"pve\\\":{\\\
    \"slots\\\":0,\\\"mode\\\":\\\"benchmark\\\"}}' WHERE key='burst'\");\n    assert.equal(await\
    \ claim(isolated,'pve','burst'),null);\n    assert.equal(await finish(isolated,baseline,value),true);\n\
    \    for(let attempt=1;attempt<=4;attempt++) {\n      assert.equal(await applyFailure(isolated,baseline,attempt===1?1:0,'apply_http_404'),true);\n\
    \      const row=(await isolated.query('SELECT status,apply_attempts,applied FROM\
    \ waffles.jobs WHERE run_id=$1 AND asset_id=$2',[baseline.run_id,baseline.asset_id])).rows[0];\n\
    \      assert.equal(row.apply_attempts,attempt);assert.equal(row.applied,1);\n\
    \      assert.equal(row.status,attempt===4?'failed':'classified');\n    }\n  \
    \  assert.equal(await applyFailure(isolated,baseline,0,'apply_http_404'),false,'Exhausted\
    \ writes cannot retry forever');\n    let unavailable=await claim(isolated,'pve');assert.equal(unavailable.run_id,'prod','Zero\
    \ burst slots must not stop baseline work');\n    const missingId=unavailable.asset_id;\n\
    \    for(let attempt=1;attempt<=4;attempt++) {\n      assert.equal(unavailable.attempts,attempt);\n\
    \      await isolated.query(\"UPDATE waffles.jobs SET last_error='thumbnail_http_404'\
    \ WHERE run_id=$1 AND asset_id=$2\",[unavailable.run_id,missingId]);\n      assert.equal(await\
    \ fail(isolated,unavailable),true);\n      assert.equal(await fail(isolated,unavailable),false,'Repeated\
    \ failure acknowledgement is fenced');\n      const row=(await isolated.query('SELECT\
    \ status,last_error FROM waffles.jobs WHERE run_id=$1 AND asset_id=$2',[unavailable.run_id,missingId])).rows[0];\n\
    \      assert.equal(row.status,attempt===4?'failed':'pending');assert.equal(row.last_error,'thumbnail_http_404');\n\
    \      if(attempt<4){\n        await isolated.query('UPDATE waffles.jobs SET available_at=now()\
    \ WHERE run_id=$1 AND asset_id=$2',[unavailable.run_id,missingId]);\n        unavailable=await\
    \ claim(isolated,'pve');assert.equal(unavailable.asset_id,missingId);\n      }\n\
    \    }\n    assert.notEqual((await claim(isolated,'pve')).asset_id,missingId,'Exhausted\
    \ thumbnail failure must not block the next asset');\n    console.log('404 failure\
    \ retained after four attempts; next production asset continues; duplicate failures\
    \ are fenced');\n    console.log('Isolated PostgreSQL pool separation, concurrent\
    \ caps, fencing and baseline continuity passed');\n  } finally {\n    for(const\
    \ name of ['jobs','runs','settings'])await db.query(`DROP TABLE IF EXISTS ${names[name]}`);\n\
    \    await db.end();\n  }\n}\nconsole.log('Result validation checks passed');\n"
