  queue-core.mjs: "// Fenced claims adapted from photo_enrichment/postgres.py; inference\
    \ is outside transactions.\nimport crypto from 'node:crypto';\nexport const WORKERS=['mac','pve','still-fawn','fun-bedbug','chief-horse'];\n\
    export const SLOT_LIMITS={mac:4,pve:1,'still-fawn':2,'fun-bedbug':1,'chief-horse':1};\n\
    export const CLAIM_SQL=`WITH candidate AS (\n SELECT j.run_id,j.asset_id FROM\
    \ waffles.jobs j JOIN waffles.runs r ON r.id=j.run_id\n WHERE r.state='running'\
    \ AND $1=ANY(r.workers)\n AND ((j.status='pending' AND j.available_at<=now())\
    \ OR (j.status='running' AND j.lease_until<now()))\n AND j.attempts<4\n AND (SELECT\
    \ count(*) FROM waffles.jobs active WHERE active.worker=$1 AND active.status='running'\
    \ AND active.lease_until>now())\n     < coalesce((SELECT (value->$1->>'slots')::int\
    \ FROM waffles.settings WHERE key='tuning'),1)\n ORDER BY r.created_at,j.ordinal\
    \ FOR UPDATE OF j SKIP LOCKED LIMIT 1)\n UPDATE waffles.jobs j SET status='running',claim=$2,worker=$1,lease_until=now()+interval\
    \ '90 seconds',attempts=attempts+1\n FROM candidate c WHERE j.run_id=c.run_id\
    \ AND j.asset_id=c.asset_id RETURNING j.*,\n (SELECT config FROM waffles.runs\
    \ WHERE id=j.run_id) AS config`;\n\nexport async function claim(pool,worker) {\n\
    \  if(!WORKERS.includes(worker))throw Error('Invalid worker');\n  const db=await\
    \ pool.connect();\n  try {\n    await db.query('BEGIN');\n    // Separate statements\
    \ ensure a fresh READ COMMITTED snapshot after waiting\n    // for the per-backend\
    \ lock. Concurrent processes cannot exceed live slots.\n    await db.query(\"\
    SELECT pg_advisory_xact_lock(244,hashtext($1))\",[worker]);\n    const job=(await\
    \ db.query(CLAIM_SQL,[worker,crypto.randomUUID()])).rows[0]??null;\n    await\
    \ db.query('COMMIT');return job;\n  }catch(e){await db.query('ROLLBACK');throw\
    \ e;}finally{db.release();}\n}\n\nexport function validateTuning(worker,slots)\
    \ {\n  if(!WORKERS.includes(worker)||!Number.isInteger(slots)||slots<0||slots>SLOT_LIMITS[worker])throw\
    \ Error('Invalid worker slot limit');\n  return {slots};\n}\n\nexport function\
    \ validateResult(value) {\n  if(!value || !Number.isFinite(value.seconds) || value.seconds<0\
    \ || value.seconds>3600)throw Error('Invalid duration');\n  if(!Array.isArray(value.matches)\
    \ || value.matches.length>100)throw Error('Invalid matches');\n  if(!Array.isArray(value.size)\
    \ || value.size.length!==2 || value.size.some(v=>!Number.isInteger(v)||v<1||v>100000))throw\
    \ Error('Invalid size');\n  for(const match of value.matches) {\n    if(!Number.isFinite(match.probability)||match.probability<0.9||match.probability>1)throw\
    \ Error('Invalid confidence');\n    const b=match.box;\n    if(!Array.isArray(b)||b.length!==4||b.some(v=>!Number.isFinite(v)||v<0||v>1)||b[0]>=b[2]||b[1]>=b[3])throw\
    \ Error('Invalid box');\n  }\n  for(const key of ['unknown','low_confidence','out_of_range'])\n\
    \    if(!Number.isInteger(value[key])||value[key]<0||value[key]>100)throw Error('Invalid\
    \ outcome');\n  return {seconds:value.seconds,size:value.size,matches:value.matches,\n\
    \          unknown:value.unknown,low_confidence:value.low_confidence,out_of_range:value.out_of_range};\n\
    }\n\nexport async function finish(db,job,value) {\n  const result=validateResult(value);\n\
    \  return (await db.query(`UPDATE waffles.jobs j SET\n    status=CASE WHEN r.mode='benchmark'\
    \ THEN 'complete' ELSE 'classified' END,\n    result=$4,processing_seconds=$5,lease_until=NULL,\n\
    \    completed_at=CASE WHEN r.mode='benchmark' THEN now() ELSE NULL END\n    FROM\
    \ waffles.runs r WHERE j.run_id=r.id AND j.run_id=$1 AND j.asset_id=$2 AND j.claim=$3\n\
    \    AND j.status='running' AND j.lease_until>now() RETURNING j.asset_id`,\n \
    \   [job.run_id,job.asset_id,job.claim,result,result.seconds])).rowCount===1;\n\
    }\n"
