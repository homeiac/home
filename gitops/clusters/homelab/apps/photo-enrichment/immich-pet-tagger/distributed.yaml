apiVersion: v1
kind: ConfigMap
metadata:
  name: waffles-code
  namespace: database
data:
  schema.sql: "-- Reuse photo_enrichment's fenced SKIP LOCKED job pattern in an isolated\
    \ schema.\nCREATE TABLE IF NOT EXISTS waffles.settings (\n  key text PRIMARY KEY,\
    \ value jsonb NOT NULL\n);\nCREATE TABLE IF NOT EXISTS waffles.runs (\n  id text\
    \ PRIMARY KEY, mode text NOT NULL CHECK(mode IN ('benchmark','production')),\n\
    \  state text NOT NULL DEFAULT 'paused' CHECK(state IN ('paused','running','complete')),\n\
    \  workers text[] NOT NULL, config jsonb NOT NULL,\n  created_at timestamptz NOT\
    \ NULL DEFAULT now(), started_at timestamptz, finished_at timestamptz\n);\nCREATE\
    \ TABLE IF NOT EXISTS waffles.jobs (\n  run_id text NOT NULL REFERENCES waffles.runs(id),\
    \ asset_id uuid NOT NULL,\n  taken_at text NOT NULL, ordinal integer NOT NULL,\n\
    \  status text NOT NULL DEFAULT 'pending' CHECK(status IN ('pending','running','classified','complete','failed')),\n\
    \  claim uuid, worker text, lease_until timestamptz,\n  available_at timestamptz\
    \ NOT NULL DEFAULT now(), attempts integer NOT NULL DEFAULT 0,\n  result jsonb,\
    \ processing_seconds double precision, completed_at timestamptz,\n  applied integer\
    \ NOT NULL DEFAULT 0, last_error text,\n  PRIMARY KEY(run_id, asset_id)\n);\n\
    CREATE INDEX IF NOT EXISTS waffles_jobs_claim ON waffles.jobs(run_id,status,available_at,ordinal);\n\
    CREATE TABLE IF NOT EXISTS waffles.workers (\n  name text PRIMARY KEY, reported_at\
    \ timestamptz NOT NULL DEFAULT now(), device text,\n  ready boolean NOT NULL DEFAULT\
    \ false, model_seconds double precision,\n  rss_bytes bigint\n);\nCREATE TABLE\
    \ IF NOT EXISTS waffles.instances (\n  id text PRIMARY KEY, worker text NOT NULL,\
    \ reported_at timestamptz NOT NULL DEFAULT now(),\n  device text, ready boolean\
    \ NOT NULL DEFAULT false, draining boolean NOT NULL DEFAULT false,\n  rss_bytes\
    \ bigint NOT NULL DEFAULT 0, exit_code integer\n);\nCREATE TABLE IF NOT EXISTS\
    \ waffles.tuning_events (\n  id bigserial PRIMARY KEY, worker text NOT NULL, slots\
    \ integer NOT NULL,\n  changed_at timestamptz NOT NULL DEFAULT now(), note text\
    \ NOT NULL DEFAULT ''\n);\nINSERT INTO waffles.settings(key,value) VALUES('tuning',\n\
    \ '{\"mac\":{\"slots\":1},\"pve\":{\"slots\":1},\"still-fawn\":{\"slots\":1},\"\
    fun-bedbug\":{\"slots\":1},\"chief-horse\":{\"slots\":1}}')\n ON CONFLICT(key)\
    \ DO NOTHING;\nALTER TABLE waffles.jobs ADD COLUMN IF NOT EXISTS pool text NOT\
    \ NULL DEFAULT 'base';\nALTER TABLE waffles.jobs ADD COLUMN IF NOT EXISTS device\
    \ text;\nALTER TABLE waffles.jobs ADD COLUMN IF NOT EXISTS apply_attempts integer\
    \ NOT NULL DEFAULT 0;\nUPDATE waffles.jobs SET device=CASE WHEN worker='mac' THEN\
    \ 'mps' ELSE 'cpu' END WHERE worker IS NOT NULL AND device IS NULL;\nCREATE INDEX\
    \ IF NOT EXISTS waffles_active_pool ON waffles.jobs(worker,pool) WHERE status='running';\n\
    ALTER TABLE waffles.instances ADD COLUMN IF NOT EXISTS pool text NOT NULL DEFAULT\
    \ 'base';\nALTER TABLE waffles.instances ADD COLUMN IF NOT EXISTS cpu_seconds\
    \ double precision NOT NULL DEFAULT 0;\nALTER TABLE waffles.instances ADD COLUMN\
    \ IF NOT EXISTS accelerator_bytes bigint NOT NULL DEFAULT 0;\nALTER TABLE waffles.instances\
    \ ADD COLUMN IF NOT EXISTS cpu_affinity integer;\nALTER TABLE waffles.instances\
    \ ADD COLUMN IF NOT EXISTS cpu_threads integer;\nINSERT INTO waffles.settings(key,value)\
    \ VALUES('burst',\n '{\"mac\":{\"slots\":0,\"mode\":\"production\"},\"pve\":{\"\
    slots\":0,\"mode\":\"production\"},\"still-fawn\":{\"slots\":0,\"mode\":\"production\"\
    },\"fun-bedbug\":{\"slots\":0,\"mode\":\"production\"},\"chief-horse\":{\"slots\"\
    :0,\"mode\":\"production\"}}')\n ON CONFLICT(key) DO NOTHING;\n"
  bootstrap.mjs: "// Same scoped-role bootstrap pattern as immich_sync/bootstrap.mjs\
    \ (#217).\nimport {createRequire} from 'node:module';\nimport fs from 'node:fs/promises';\n\
    const {Client}=createRequire('/usr/src/app/server/package.json')('pg');\nconst\
    \ db=new Client();\ntry {\n  await db.connect();\n  await db.query(\"SET log_statement='none'\"\
    );\n  await db.query('BEGIN');\n  await db.query('SELECT pg_advisory_xact_lock(244,1)');\n\
    \  if(!(await db.query(\"SELECT 1 FROM pg_roles WHERE rolname='waffles_worker'\"\
    )).rowCount)\n    await db.query('CREATE ROLE waffles_worker LOGIN');\n  const\
    \ statement=(await db.query(\"SELECT format('ALTER ROLE waffles_worker PASSWORD\
    \ %L',$1::text) command\",[process.env.ROLE_PASSWORD])).rows[0].command;\n  await\
    \ db.query(statement);\n  await db.query('GRANT CONNECT ON DATABASE photo_enrichment\
    \ TO waffles_worker');\n  await db.query('CREATE SCHEMA IF NOT EXISTS waffles\
    \ AUTHORIZATION waffles_worker');\n  await db.query('SET LOCAL ROLE waffles_worker');\n\
    \  await db.query(await fs.readFile('/code/schema.sql','utf8'));\n  await db.query('COMMIT');\n\
    \  console.log('Isolated Waffles queue schema ready');\n} catch(e) {\n  try{await\
    \ db.query('ROLLBACK');}catch{}\n  console.error('Waffles schema bootstrap failed:',e.code??'unknown');process.exitCode=1;\n\
    } finally {await db.end();}\n"
  queue-core.mjs: "// Fenced claims adapted from photo_enrichment/postgres.py; inference\
    \ is outside transactions.\nimport crypto from 'node:crypto';\nexport const WORKERS=['mac','pve','still-fawn','fun-bedbug','chief-horse'];\n\
    export const SLOT_LIMITS={mac:1,pve:1,'still-fawn':1,'fun-bedbug':1,'chief-horse':1};\n\
    export const BURST_LIMITS={mac:15,pve:1,'still-fawn':3,'fun-bedbug':0,'chief-horse':0};\n\
    export const BURST_CPU_LIMITS={mac:0,pve:1,'still-fawn':3,'fun-bedbug':0,'chief-horse':0};\n\
    export const THREAD_LIMITS={mac:16,pve:2,'still-fawn':2,'fun-bedbug':2,'chief-horse':2};\n\
    export const CLAIM_SQL=`WITH candidate AS (\n SELECT j.run_id,j.asset_id FROM\
    \ waffles.jobs j JOIN waffles.runs r ON r.id=j.run_id\n WHERE r.state='running'\
    \ AND $1=ANY(r.workers)\n AND r.mode=CASE WHEN $3='base' THEN\n   CASE WHEN EXISTS(SELECT\
    \ 1 FROM waffles.runs prod WHERE prod.mode='production' AND prod.state='running'\
    \ AND $1=ANY(prod.workers)) THEN 'production' ELSE 'benchmark' END\n   ELSE coalesce((SELECT\
    \ value->$1->>'mode' FROM waffles.settings WHERE key='burst'),'production') END\n\
    \ AND ((j.status='pending' AND j.available_at<=now()) OR (j.status='running' AND\
    \ j.lease_until<now()))\n AND j.attempts<4\n AND (SELECT count(*) FROM waffles.jobs\
    \ active WHERE active.worker=$1 AND active.pool=$3 AND active.status='running'\
    \ AND active.lease_until>now())\n     < CASE WHEN $3='base' THEN 1 ELSE coalesce((SELECT\
    \ (value->$1->>'slots')::int FROM waffles.settings WHERE key='burst'),0) END\n\
    \ ORDER BY r.created_at,j.ordinal FOR UPDATE OF j SKIP LOCKED LIMIT 1)\n UPDATE\
    \ waffles.jobs j SET status='running',claim=$2,worker=$1,pool=$3,device=$4,lease_until=now()+interval\
    \ '90 seconds',attempts=attempts+1\n FROM candidate c WHERE j.run_id=c.run_id\
    \ AND j.asset_id=c.asset_id RETURNING j.*,\n (SELECT config FROM waffles.runs\
    \ WHERE id=j.run_id) AS config`;\n\nexport async function claim(pool,worker,lane='base',device=worker==='mac'?'mps':'cpu')\
    \ {\n  if(!WORKERS.includes(worker))throw Error('Invalid worker');\n  if(!['base','burst'].includes(lane))throw\
    \ Error('Invalid worker pool');\n  if(!['cpu','mps'].includes(device)||(worker!=='mac'&&device!=='cpu'))throw\
    \ Error('Invalid device');\n  const db=await pool.connect();\n  try {\n    await\
    \ db.query('BEGIN');\n    // Separate statements ensure a fresh READ COMMITTED\
    \ snapshot after waiting\n    // for the per-backend lock. Concurrent processes\
    \ cannot exceed live slots.\n    await db.query(\"SELECT pg_advisory_xact_lock(244,hashtext($1))\"\
    ,[worker]);\n    const job=(await db.query(CLAIM_SQL,[worker,crypto.randomUUID(),lane,device])).rows[0]??null;\n\
    \    await db.query('COMMIT');return job;\n  }catch(e){await db.query('ROLLBACK');throw\
    \ e;}finally{db.release();}\n}\n\nexport function validateTuning(worker,slots)\
    \ {\n  if(!WORKERS.includes(worker)||slots!==1)throw Error('Baseline workers must\
    \ remain at one');\n  return {slots};\n}\n\nexport function validateBurst(worker,slots,mode,cpu=BURST_CPU_LIMITS[worker],device=worker==='mac'?'mps':'cpu',threads=2)\
    \ {\n  if(!WORKERS.includes(worker)||!Number.isInteger(slots)||slots<0||slots>BURST_LIMITS[worker]||!['production','benchmark'].includes(mode))throw\
    \ Error('Invalid burst policy');\n  if(!Number.isInteger(cpu)||cpu<(BURST_CPU_LIMITS[worker]?1:0)||cpu>BURST_CPU_LIMITS[worker])throw\
    \ Error('Invalid burst CPU parallelism');\n  if(!['cpu','mps'].includes(device)||(worker!=='mac'&&device!=='cpu'))throw\
    \ Error('Invalid burst compute device');\n  if(!Number.isInteger(threads)||threads<1||threads>THREAD_LIMITS[worker])throw\
    \ Error('Invalid extra-worker thread count');\n  if((worker!=='mac'||device!=='cpu')&&threads!==2)throw\
    \ Error('Thread tuning is limited to Mac CPU extras');\n  return {slots,mode,cpu_cores:cpu,device,cpu_threads:threads};\n\
    }\n\nexport function validateResult(value) {\n  if(!value || !Number.isFinite(value.seconds)\
    \ || value.seconds<0 || value.seconds>3600)throw Error('Invalid duration');\n\
    \  if(!Array.isArray(value.matches) || value.matches.length>100)throw Error('Invalid\
    \ matches');\n  if(!Array.isArray(value.size) || value.size.length!==2 || value.size.some(v=>!Number.isInteger(v)||v<1||v>100000))throw\
    \ Error('Invalid size');\n  for(const match of value.matches) {\n    if(!Number.isFinite(match.probability)||match.probability<0.9||match.probability>1)throw\
    \ Error('Invalid confidence');\n    const b=match.box;\n    if(!Array.isArray(b)||b.length!==4||b.some(v=>!Number.isFinite(v)||v<0||v>1)||b[0]>=b[2]||b[1]>=b[3])throw\
    \ Error('Invalid box');\n  }\n  for(const key of ['unknown','low_confidence','out_of_range'])\n\
    \    if(!Number.isInteger(value[key])||value[key]<0||value[key]>100)throw Error('Invalid\
    \ outcome');\n  return {seconds:value.seconds,size:value.size,matches:value.matches,\n\
    \          unknown:value.unknown,low_confidence:value.low_confidence,out_of_range:value.out_of_range};\n\
    }\n\nexport async function finish(db,job,value) {\n  const result=validateResult(value);\n\
    \  return (await db.query(`UPDATE waffles.jobs j SET\n    status=CASE WHEN r.mode='benchmark'\
    \ THEN 'complete' ELSE 'classified' END,\n    result=$4,processing_seconds=$5,lease_until=NULL,\n\
    \    completed_at=CASE WHEN r.mode='benchmark' THEN now() ELSE NULL END\n    FROM\
    \ waffles.runs r WHERE j.run_id=r.id AND j.run_id=$1 AND j.asset_id=$2 AND j.claim=$3\n\
    \    AND j.status='running' AND j.lease_until>now() RETURNING j.asset_id`,\n \
    \   [job.run_id,job.asset_id,job.claim,result,result.seconds])).rowCount===1;\n\
    }\n\nexport async function fail(db,job) {\n  // Four total claims, then retain\
    \ an asset-level failure and move on.\n  // A stale worker cannot consume another\
    \ attempt or change a newer claim.\n  return (await db.query(`UPDATE waffles.jobs\
    \ SET status=CASE WHEN attempts>=4 THEN 'failed' ELSE 'pending' END,\n    available_at=now()+interval\
    \ '30 seconds',\n    last_error=CASE WHEN last_error LIKE 'thumbnail_http_%' THEN\
    \ last_error ELSE 'inference_failed' END,\n    lease_until=NULL\n    WHERE run_id=$1\
    \ AND asset_id=$2 AND claim=$3 AND status='running' AND lease_until>now()`,\n\
    \    [job.run_id,job.asset_id,job.claim])).rowCount===1;\n}\n\nexport async function\
    \ applyFailure(db,job,added,reason) {\n  if(!Number.isInteger(added)||added<0||added>1||!/^apply_(failed|http_[45][0-9]{2})$/.test(reason))throw\
    \ Error('Invalid apply failure');\n  return (await db.query(`UPDATE waffles.jobs\
    \ SET\n    status=CASE WHEN apply_attempts>=3 THEN 'failed' ELSE 'classified'\
    \ END,\n    apply_attempts=apply_attempts+1,available_at=now()+interval '60 seconds',\n\
    \    last_error=$4,applied=applied+$3\n    WHERE run_id=$1 AND asset_id=$2 AND\
    \ status='classified'`,\n    [job.run_id,job.asset_id,added,reason])).rowCount===1;\n\
    }\n"
  coordinator.mjs: "// Single API writer + PostgreSQL queue. Workers perform inference\
    \ only.\nimport http from 'node:http';\nimport crypto from 'node:crypto';\nimport\
    \ fs from 'node:fs/promises';\nimport {createRequire} from 'node:module';\nimport\
    \ {claim,finish,fail,applyFailure,WORKERS,SLOT_LIMITS,BURST_LIMITS,BURST_CPU_LIMITS,THREAD_LIMITS,validateTuning,validateBurst}\
    \ from './queue-core.mjs';\nimport {discover} from './discovery.mjs';\nconst {Pool}=createRequire('/usr/src/app/server/package.json')('pg');\n\
    const pool=new Pool({max:6,connectionTimeoutMillis:10000,idleTimeoutMillis:30000});\n\
    const IMMICH=process.env.IMMICH_URL??'http://immich-server.immich-pilot.svc.cluster.local:2283';\n\
    const workerToken=process.env.WORKER_TOKEN,adminToken=process.env.ADMIN_TOKEN;\n\
    const uuid=/^[0-9a-f-]{36}$/i;\nlet report='',healthy=false,tagId=null;\nconst\
    \ safeEqual=(a,b)=>typeof a==='string'&&typeof b==='string'&&a.length===b.length&&crypto.timingSafeEqual(Buffer.from(a),Buffer.from(b));\n\
    async function api(path,method='GET',body) {\n  const r=await fetch(IMMICH+'/api'+path,{method,headers:{'x-api-key':process.env.IMMICH_API_KEY,'Content-Type':'application/json'},\n\
    \    body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(15000)});\n\
    \  if(!r.ok)throw Object.assign(Error('Immich HTTP '+r.status),{status:r.status});\n\
    \  return r;\n}\nasync function jsonBody(req) {\n  let value='';for await(const\
    \ chunk of req){value+=chunk;if(value.length>25e6)throw Error('Too large');}\n\
    \  return JSON.parse(value||'{}');\n}\nconst respond=(res,value,status=200)=>{res.writeHead(status,{'Content-Type':'application/json'});res.end(JSON.stringify(value));};\n\
    async function transaction(fn) {\n  const db=await pool.connect();try {await db.query('BEGIN');const\
    \ value=await fn(db);await db.query('COMMIT');return value;}\n  catch(e){await\
    \ db.query('ROLLBACK');throw e;}finally{db.release();}\n}\n\nasync function writeOne()\
    \ {\n  // Hold one row lock across API writes, never model inference. A crash\
    \ is\n  // recoverable: re-read existing faces before creating one, and reapply\
    \ review tag.\n  return transaction(async db=>{\n    const job=(await db.query(`SELECT\
    \ j.*,r.config FROM waffles.jobs j JOIN waffles.runs r ON r.id=j.run_id\n    \
    \  WHERE j.status='classified' AND j.available_at<=now() AND r.state='running'\n\
    \      ORDER BY j.ordinal FOR UPDATE OF j SKIP LOCKED LIMIT 1`)).rows[0];\n  \
    \  if(!job)return false;\n    let added=0;\n    try {\n      if(job.result.matches.length)\
    \ {\n        const faces=await (await api('/faces?id='+job.asset_id)).json();\n\
    \        if(!faces.some(f=>(f.person?.id??f.personId)===job.config.person_id))\
    \ {\n          const best=[...job.result.matches].sort((a,b)=>b.probability-a.probability)[0];\n\
    \          const [width,height]=job.result.size,b=best.box;\n          await api('/faces','POST',{assetId:job.asset_id,personId:job.config.person_id,\n\
    \            imageWidth:width,imageHeight:height,x:Math.round(b[0]*width),y:Math.round(b[1]*height),\n\
    \            width:Math.max(1,Math.round((b[2]-b[0])*width)),height:Math.max(1,Math.round((b[3]-b[1])*height))});\n\
    \          added=1;\n        }\n        if(!tagId){const tags=await(await api('/tags','PUT',{tags:['Pets/Review']})).json();tagId=tags.find(t=>t.value==='Pets/Review'||t.name==='Pets/Review')?.id;if(!tagId)throw\
    \ Error('Review tag unavailable');}\n        await api('/tags/'+tagId+'/assets','PUT',{ids:[job.asset_id]});\n\
    \      }\n      await db.query(\"UPDATE waffles.jobs SET status='complete',completed_at=now(),applied=applied+$3,last_error=NULL,apply_attempts=apply_attempts+1\
    \ WHERE run_id=$1 AND asset_id=$2\",[job.run_id,job.asset_id,added]);\n    } catch(e)\
    \ {\n      // Retry application without repeating inference; record no private\
    \ API response.\n      await applyFailure(db,job,added,Number.isInteger(e.status)?'apply_http_'+e.status:'apply_failed');\n\
    \      console.error('Immich apply retry:',/^Immich HTTP \\d+$/.test(e.message)?e.message:e.constructor.name);\n\
    \    }\n    return true;\n  });\n}\n\nasync function refresh() {\n  try {\n  \
    \  await pool.query(\"UPDATE waffles.jobs SET status='failed',last_error='lease_exhausted'\
    \ WHERE status='running' AND lease_until<now() AND attempts>=4\");\n    await\
    \ pool.query(`UPDATE waffles.runs r SET state='complete',finished_at=now() WHERE\
    \ r.state='running'\n      AND EXISTS(SELECT 1 FROM waffles.jobs j WHERE j.run_id=r.id)\n\
    \      AND NOT EXISTS(SELECT 1 FROM waffles.jobs j WHERE j.run_id=r.id AND j.status\
    \ IN ('pending','running','classified'))`);\n    const rows=(await pool.query(`SELECT\
    \ r.id,r.mode,r.state,extract(epoch FROM r.started_at)::float8 started,\n    \
    \  CASE WHEN r.state='complete' THEN (SELECT extract(epoch FROM max(done.completed_at))::float8\
    \ FROM waffles.jobs done WHERE done.run_id=r.id) END finished,j.worker,j.status,count(j.asset_id)::int\
    \ count,\n      coalesce(sum(j.processing_seconds),0)::float8 seconds,coalesce(sum(j.applied),0)::int\
    \ applied\n      FROM waffles.runs r LEFT JOIN waffles.jobs j ON j.run_id=r.id\
    \ GROUP BY r.id,j.worker,j.status`)).rows;\n    const devices=(await pool.query(\"\
    SELECT run_id,worker,pool,coalesce(device,'unknown') device,count(*)::int jobs\
    \ FROM waffles.jobs WHERE status='complete' GROUP BY run_id,worker,pool,device\"\
    )).rows;\n    const failures=(await pool.query(\"SELECT run_id,coalesce(last_error,'unknown')\
    \ reason,count(*)::int jobs FROM waffles.jobs WHERE status='failed' GROUP BY run_id,last_error\"\
    )).rows;\n    const instances=(await pool.query(\"SELECT *,extract(epoch FROM\
    \ reported_at)::float8 reported FROM waffles.instances WHERE reported_at>now()-interval\
    \ '60 seconds'\")).rows;\n    const burst=(await pool.query(\"SELECT value FROM\
    \ waffles.settings WHERE key='burst'\")).rows[0]?.value??{};\n    await pool.query(\"\
    DELETE FROM waffles.instances WHERE reported_at<now()-interval '7 days'\");\n\
    \    const metric=(name,value,labels={})=>'waffles_'+name+'{'+Object.entries(labels).map(([k,v])=>k+'='+JSON.stringify(v)).join(',')+'}\
    \ '+Number(value);\n    const lines=[metric('queue_up',1),metric('queue_report_timestamp_seconds',Date.now()/1000)];\n\
    \    for(const row of devices)lines.push(metric('device_jobs',row.jobs,{run:row.run_id,worker:row.worker,pool:row.pool,device:row.device}));\n\
    \    for(const row of failures)lines.push(metric('failed_jobs',row.jobs,{run:row.run_id,reason:row.reason}));\n\
    \    const mac=(await pool.query(\"SELECT value FROM waffles.settings WHERE key='mac-observation'\"\
    )).rows[0]?.value;\n    if(mac)for(const [name,value] of Object.entries(mac))lines.push(metric('mac_'+name,value));\n\
    \    const discovery=(await pool.query(\"SELECT value FROM waffles.settings WHERE\
    \ key='discovery'\")).rows[0]?.value;\n    lines.push(metric('discovery_enabled',Number(Boolean(discovery?.enabled))),metric('discovery_error',Number(Boolean(discovery?.error))));\n\
    \    if(discovery?.last_success)lines.push(metric('discovery_last_success_timestamp_seconds',Date.parse(discovery.last_success)/1000));\n\
    \    const seen=new Set();\n    for(const row of rows) {\n      const labels={run:row.id,mode:row.mode};\n\
    \      if(!seen.has(row.id)) {\n        seen.add(row.id);lines.push(metric('run_state',{paused:0,running:1,complete:2}[row.state],labels));\n\
    \        if(row.started)lines.push(metric('run_started_timestamp_seconds',row.started,labels));\n\
    \        if(row.finished)lines.push(metric('run_finished_timestamp_seconds',row.finished,labels));\n\
    \      }\n      if(row.status) {\n        const label={...labels,worker:row.worker??'unassigned',state:row.status};\n\
    \        lines.push(metric('jobs',row.count,label),metric('processing_seconds',row.seconds,label),metric('assignments',row.applied,label));\n\
    \      }\n    }\n    for(const name of WORKERS) {\n      const group=instances.filter(w=>w.worker===name),active=group.filter(w=>w.ready&&!w.draining).length;\n\
    \      lines.push(metric('worker_ready',Number(active>0),{worker:name}),metric('worker_active_instances',active,{worker:name}),\n\
    \        metric('worker_desired_instances',1+(burst[name]?.slots??0),{worker:name}),metric('worker_slot_limit',1+BURST_LIMITS[name],{worker:name}));\n\
    \      for(const lane of ['base','burst']) {\n        lines.push(metric('pool_active_instances',group.filter(w=>w.ready&&!w.draining&&w.pool===lane).length,{worker:name,pool:lane}),\n\
    \          metric('pool_desired_instances',lane==='base'?1:(burst[name]?.slots??0),{worker:name,pool:lane}));\n\
    \      }\n      lines.push(metric('burst_cpu_cores',burst[name]?.cpu_cores??BURST_CPU_LIMITS[name],{worker:name}),metric('burst_cpu_threads',burst[name]?.cpu_threads??2,{worker:name}));\n\
    \      lines.push(metric('burst_device',(burst[name]?.device??(name==='mac'?'mps':'cpu'))==='mps'?1:0,{worker:name}));\n\
    \      for(const instance of group.filter(w=>w.pool==='burst')) {\n        if(instance.ready&&!instance.draining&&instance.device==='cpu'&&instance.cpu_threads)\n\
    \          lines.push(metric('instance_cpu_threads',instance.cpu_threads,{worker:name,instance:instance.id}));\n\
    \        lines.push(metric('instance_cpu_seconds_total',instance.cpu_seconds,{worker:name,instance:instance.id}),\n\
    \          metric('instance_accelerator_bytes',instance.accelerator_bytes,{worker:name,instance:instance.id}));\n\
    \      }\n      if(group.length)lines.push(metric('worker_report_timestamp_seconds',Math.max(...group.map(w=>w.reported)),{worker:name}),\n\
    \        metric('worker_rss_bytes',group.reduce((total,w)=>total+Number(w.rss_bytes??0),0),{worker:name}));\n\
    \    }\n    report=lines.join('\\n')+'\\n';healthy=true;\n  }catch{healthy=false;report='waffles_queue_up{}\
    \ 0\\n';}\n}\n\nhttp.createServer(async(req,res)=>{\n  try {\n    const url=new\
