    \ request failed:',e.code??e.constructor.name);respond(res,{error:'request failed'},400);}\n\
    }).listen(9200,'0.0.0.0');\nawait refresh();setInterval(refresh,15000);\nsetInterval(()=>discover(pool,api),60000);\n\
    for(;;){try{if(!await writeOne())await new Promise(r=>setTimeout(r,1000));}catch{await\
    \ new Promise(r=>setTimeout(r,5000));}}\n"
  discovery.mjs: "// Hourly upload discovery with durable cursor; private owner scope\
    \ is checked on every asset.\nexport async function discover(pool, api) {\n  const\
    \ db=await pool.connect();\n  let locked=false;\n  try {\n    locked=(await db.query('SELECT\
    \ pg_try_advisory_lock(244,2) AS locked')).rows[0].locked;\n    if(!locked)return;\n\
    \    const settings=(await db.query(\"SELECT value FROM waffles.settings WHERE\
    \ key='discovery'\")).rows[0]?.value;\n    if(!settings?.enabled||Date.now()-Date.parse(settings.last_success??0)<3600000)return;\n\
    \    const owner=(await(await api('/users/me')).json()).id;\n    if(!owner)throw\
    \ Error('Owner unavailable');\n    const config=(await db.query(\"SELECT value\
    \ FROM waffles.settings WHERE key='config'\")).rows[0].value;\n    const until=new\
    \ Date().toISOString();\n    await db.query(`INSERT INTO waffles.runs(id,mode,state,workers,config,started_at)\n\
    \      VALUES('new-uploads','production','running',ARRAY['mac','pve','still-fawn'],$1,now())\
    \ ON CONFLICT(id) DO NOTHING`,[config]);\n    let cursor=null,added=0;\n    const\
    \ seen=new Set();\n    do {\n      const body={size:1000,filter:{trashedAt:{eq:null},createdAt:{gte:settings.since,lte:until}},orderBy:{field:'fileCreatedAt',direction:'asc'}};\n\
    \      if(cursor)body.cursor=cursor;\n      const response=await(await api('/search/metadata','POST',body)).json();\n\
    \      const block=response.assets??response;\n      if(!Array.isArray(block.items))throw\
    \ Error('Unexpected search response');\n      const items=block.items.filter(a=>a.ownerId===owner).map(a=>({id:a.id,date:a.fileCreatedAt}));\n\
    \      // Page insertion is atomic and idempotent. Cursor advances only after\
    \ all\n      // pages succeed; a retry overlaps safely with historical and prior\
    \ uploads.\n      added+=(await db.query(`INSERT INTO waffles.jobs(run_id,asset_id,taken_at,ordinal)\n\
    \        SELECT 'new-uploads',x.id,x.date,coalesce((SELECT max(ordinal)+1 FROM\
    \ waffles.jobs WHERE run_id='new-uploads'),0)+row_number() OVER()::int\n     \
    \   FROM jsonb_to_recordset($1::jsonb) x(id uuid,date text)\n        WHERE NOT\
    \ EXISTS(SELECT 1 FROM waffles.jobs j JOIN waffles.runs r ON r.id=j.run_id WHERE\
    \ r.mode='production' AND j.asset_id=x.id)\n        ON CONFLICT DO NOTHING`,[JSON.stringify(items)])).rowCount;\n\
    \      cursor=block.nextCursor??null;\n      if(cursor&&seen.has(cursor))throw\
    \ Error('Repeated search cursor');\n      if(cursor)seen.add(cursor);\n    }while(cursor);\n\
    \    if(added)await db.query(\"UPDATE waffles.runs SET state='running',finished_at=NULL\
    \ WHERE id='new-uploads' AND state='complete'\");\n    const next={...settings,since:new\
    \ Date(Date.parse(until)-300000).toISOString(),last_success:until,last_added:added,error:false};\n\
    \    await db.query(\"UPDATE waffles.settings SET value=$1 WHERE key='discovery'\"\
    ,[next]);\n    console.log('Upload discovery complete:',added,'new jobs');\n \
    \ }catch(e){\n    await db.query(\"UPDATE waffles.settings SET value=jsonb_set(value,'{error}','true')\
    \ WHERE key='discovery'\");\n    console.error('Upload discovery failed:',e.code??e.constructor.name);\n\
    \  }finally{\n    if(locked)await db.query('SELECT pg_advisory_unlock(244,2)');\n\
    \    db.release();\n  }\n}\n"
  distributed-worker.py: "#!/usr/bin/env python3\n\"\"\"Run unchanged upstream detection/embedding/classification\
    \ with fenced PG jobs.\n\nThe coordinator proxies thumbnails and owns all Immich\
    \ writes. This worker gets\nno Immich API credential, does not enroll pets, and\
    \ never writes face metadata.\n\"\"\"\nimport json\nimport logging\nimport os\n\
    from pathlib import Path\nimport resource\nimport signal\nimport sys\nimport threading\n\
    import time\nimport urllib.request\n\n\ndef main() -> None:\n    \"\"\"Maintain\
    \ a heartbeat while processing one independently claimed photo.\"\"\"\n    logging.basicConfig(level=logging.INFO,\
    \ format='%(asctime)s %(levelname)s %(message)s')\n    base = os.environ['QUEUE_URL'].rstrip('/')\n\
    \    token = Path(os.environ['WORKER_TOKEN_FILE']).read_text().strip()\n    worker\
    \ = os.environ['WORKER_NAME']\n    directory = Path(os.environ.get('DATA_DIR',\
    \ '/data'))\n    directory.mkdir(parents=True, exist_ok=True)\n    os.chdir(directory)\n\
    \    # This key authenticates only the restricted thumbnail proxy, not Immich.\n\
    \    os.environ['IMMICH_URL'] = base + '/immich'\n    os.environ['IMMICH_API_KEY']\
    \ = token\n    os.environ.setdefault('HOME', str(directory))\n    os.environ.setdefault('TORCH_HOME',\
    \ str(directory / '.cache/torch'))\n    os.environ.setdefault('HF_HOME', str(directory\
    \ / '.cache/huggingface'))\n    os.environ.setdefault('YOLO_CONFIG_DIR', str(directory\
    \ / '.ultralytics'))\n    sys.path.insert(0, os.environ.get('UPSTREAM_APP', '/app'))\n\
    \    state = dict(worker=worker, instance=os.environ.get('WAFFLES_INSTANCE',worker),\
    \ ready=False, device='loading', draining=False)\n    draining = threading.Event()\n\
    \    def drain(*_):\n        state['draining'] = True\n        draining.set()\n\
    \    signal.signal(signal.SIGTERM, drain)\n    signal.signal(signal.SIGINT, drain)\n\
    \n    def request(path: str, body=None):\n        req = urllib.request.Request(base\
    \ + path, headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},\n\
    \                                     data=None if body is None else json.dumps(body).encode())\n\
    \        with urllib.request.urlopen(req, timeout=40) as response:\n         \
    \   return json.load(response)\n\n    def heartbeat() -> None:\n        while\
    \ True:\n            try:\n                rss = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss\n\
    \                request('/api/heartbeat', {**state, 'rss_bytes': rss if sys.platform\
    \ == 'darwin' else rss * 1024})\n            except Exception:\n             \
    \   logging.warning('Queue heartbeat unavailable')\n            time.sleep(15)\n\
    \n    threading.Thread(target=heartbeat, daemon=True).start()\n    while True:\n\
    \        try:\n            config = request('/api/config')\n            break\n\
    \        except Exception:\n            time.sleep(10)\n    import numpy as np\n\
    \    from sklearn.linear_model import LogisticRegression\n    from sklearn.preprocessing\
    \ import StandardScaler\n    import classifier\n    import embedder\n    import\
    \ inference\n    from device import pick_device\n    scaler = StandardScaler()\n\
    \    for name, value in config['scaler'].items():\n        setattr(scaler, name,\
    \ np.asarray(value) if isinstance(value, list) else value)\n    model = LogisticRegression()\n\
    \    for name, value in config['model'].items():\n        setattr(model, name,\
    \ np.asarray(value) if isinstance(value, list) else value)\n    # Prevent per-asset\
    \ debug logs from exposing IDs in normal pod logs.\n    for name in ('embedder',\
    \ 'detector', 'immich'):\n        logging.getLogger(name).setLevel(logging.ERROR)\n\
    \    with inference.inference_session():\n        state.update(ready=True, device=pick_device())\n\
    \        logging.info('Worker %s ready on %s', worker, state['device'])\n    \
    \    while not draining.is_set():\n            job = None\n            try:\n\
    \                if os.environ.get('NATIVE_CAPACITY_GUARD') == 'true':\n     \
    \               from native_guard import can_run\n                    if not can_run():\n\
    \                        state['ready'] = False\n                        request('/api/heartbeat',\
    \ state)\n                        logging.info('Native capacity guard: unloading\
    \ models and returning to standby')\n                        return\n        \
    \        job = request('/api/claim', {'worker': worker})\n                if not\
    \ job:\n                    time.sleep(2)\n                    continue\n    \
    \            # Runs retain their classifier snapshot across future enrollment\n\
    \                # changes; never classify an old run with a newer global model.\n\
    \                if job.get('config') and job['config'] != config:\n         \
    \           config = job['config']\n                    for obj, values in [(scaler,\
    \ config['scaler']), (model, config['model'])]:\n                        for name,\
    \ value in values.items():\n                            setattr(obj, name, np.asarray(value)\
    \ if isinstance(value, list) else value)\n                state.update({key: job[key]\
    \ for key in ('run_id', 'asset_id', 'claim')})\n                started = time.monotonic()\n\
    \                errors = inference.model_error_count()\n                image\
    \ = embedder.fetch_thumbnail(job['asset_id'])\n                if image is None:\n\
    \                    raise RuntimeError('Thumbnail unavailable')\n           \
    \     crops = embedder.crop_animals(image, conf=0.25) or [(None, image)]\n   \
    \             result = dict(size=list(image.size), matches=[], unknown=0, low_confidence=0,\
    \ out_of_range=0)\n                for box, crop in crops:\n                 \
    \   vector = embedder.embed_image(crop)\n                    if vector is None\
    \ or inference.model_error_count() != errors:\n                        raise RuntimeError('Model\
    \ inference failed')\n                    name, probability = classifier.classify(vector,\
    \ config['names'], model, scaler)\n                    if name != 'Waffles':\n\
    \                        result['unknown'] += 1\n                    elif box\
    \ is None or probability < 0.90:\n                        result['low_confidence']\
    \ += 1\n                    else:\n                        result['matches'].append({'box':\
    \ [float(x) for x in box], 'probability': float(probability)})\n             \
    \   result['seconds'] = time.monotonic() - started\n                accepted =\
    \ request('/api/finish', {**{k: job[k] for k in ('run_id', 'asset_id', 'claim')},\
    \ 'result': result})\n                if not accepted['accepted']:\n         \
    \           logging.warning('Discarded expired claim result')\n            except\
    \ Exception as exc:\n                logging.warning('Job or queue request failed:\
    \ %s', type(exc).__name__)\n                if job:\n                    try:\n\
    \                        request('/api/fail', {k: job[k] for k in ('run_id', 'asset_id',\
    \ 'claim')})\n                    except Exception:\n                        pass\
    \  # The lease will expire; stale results cannot commit.\n                time.sleep(5)\n\
    \            finally:\n                for key in ('run_id', 'asset_id', 'claim'):\n\
    \                    state.pop(key, None)\n        state['ready'] = False\n  \
    \      request('/api/heartbeat', state)\n\n\nif __name__ == '__main__':\n    main()\n"
  supervisor.py: "#!/usr/bin/env python3\n\"\"\"Resize inference processes from durable\
    \ live tuning, draining work on scale-down.\"\"\"\nimport json\nimport logging\n\
    import os\nfrom pathlib import Path\nimport resource\nimport signal\nimport socket\n\
    import subprocess\nimport sys\nimport time\nimport urllib.request\nimport uuid\n\
    \n\ndef main() -> None:\n    logging.basicConfig(level=logging.INFO,format='%(asctime)s\
    \ %(levelname)s %(message)s')\n    base=os.environ['QUEUE_URL'].rstrip('/');worker=os.environ['WORKER_NAME']\n\
    \    token=Path(os.environ['WORKER_TOKEN_FILE']).read_text().strip()\n    children=[];stopping=False;target=0;last_heartbeat=0\n\
    \    def stop(*_):\n        nonlocal stopping\n        stopping=True\n    signal.signal(signal.SIGTERM,stop);signal.signal(signal.SIGINT,stop)\n\
    \    def request(path,body=None):\n        req=urllib.request.Request(base+path,headers={'Authorization':'Bearer\
    \ '+token,'Content-Type':'application/json'},data=None if body is None else json.dumps(body).encode())\n\
    \        with urllib.request.urlopen(req,timeout=10) as response:return json.load(response)\n\
    \    try:\n        while not stopping:\n            for item in children:\n  \
    \              code=item['process'].poll()\n                if code is not None:\n\
    \                    logging.info('Inference process exited: code=%s planned_drain=%s',code,item['draining'])\n\
    \                    try:request('/api/heartbeat',{'worker':worker,'instance':item['instance'],'device':'stopped','ready':False,'draining':item['draining'],'exit_code':code})\n\
    \                    except Exception:pass\n            children=[item for item\
    \ in children if item['process'].poll() is None]\n            try:\n         \
    \       tuning=request('/api/tuning')\n                target=int(tuning['workers'][worker]['slots'])\n\
    \                if not 0<=target<=int(tuning['limits'][worker]):raise ValueError('Invalid\
    \ tuning')\n            except Exception:\n                logging.warning('Live\
    \ tuning unavailable; retaining current process target')\n            active=[item\
    \ for item in children if not item['draining']]\n            for item in active[target:]:\n\
    \                item['draining']=True;item['process'].terminate()\n         \
    \       logging.info('Draining one %s process',worker)\n            while len(children)<target:\n\
    \                if os.environ.get('NATIVE_CAPACITY_GUARD')=='true':\n       \
    \             from native_guard import can_run\n                    if not can_run(starting=True):break\n\
    \                instance=worker+'-'+uuid.uuid4().hex[:12]\n                path=Path(__file__).with_name('distributed-worker.py')\n\
    \                if not path.exists():path=Path(__file__).with_name('worker.py')\n\
    \                process=subprocess.Popen([sys.executable,'-B',str(path)],env={**os.environ,'WAFFLES_INSTANCE':instance})\n\
    \                children.append({'process':process,'draining':False,'instance':instance})\n\
    \                logging.info('Started %s inference process; desired slots=%d',worker,target)\n\
    \            if time.monotonic()-last_heartbeat>=15:\n                rss=resource.getrusage(resource.RUSAGE_SELF).ru_maxrss\n\
    \                try:request('/api/heartbeat',{'worker':worker,'instance':worker+'-supervisor-'+socket.gethostname(),'role':'supervisor','device':'standby','ready':False,'rss_bytes':rss\
    \ if sys.platform=='darwin' else rss*1024})\n                except Exception:pass\n\
    \                last_heartbeat=time.monotonic()\n            time.sleep(3)\n\
    \    finally:\n        for item in children:\n            if item['process'].poll()\
    \ is None:item['process'].terminate()\n        deadline=time.monotonic()+60\n\
    \        for item in children:\n            try:item['process'].wait(timeout=max(0.1,deadline-time.monotonic()))\n\
    \            except subprocess.TimeoutExpired:item['process'].kill()\n\n\nif __name__=='__main__':main()\n"
  test-queue.mjs: "// Pure validation checks run locally; --postgres also exercises\
    \ real concurrent claims.\nimport assert from 'node:assert/strict';\nimport {createRequire}\
    \ from 'node:module';\nimport {claim,finish,validateResult,validateTuning} from\
    \ './queue-core.mjs';\nconst value={seconds:1.2,size:[100,80],matches:[{box:[0.1,0.1,0.8,0.9],probability:0.95}],unknown:0,low_confidence:0,out_of_range:0};\n\
    assert.equal(validateResult(value).seconds,1.2);\nassert.deepEqual(validateTuning('mac',4),{slots:4});\n\
    assert.deepEqual(validateTuning('still-fawn',0),{slots:0});\nfor(const [worker,slots]\
    \ of [['mac',5],['pve',2],['still-fawn',-1],['rtx',1],['mac',1.5]])assert.throws(()=>validateTuning(worker,slots));\n\
    const calls=[];\nconst connection={query:async(sql)=>{calls.push(sql);return {rows:sql.includes('RETURNING')?[{asset_id:'test'}]:[]};},release:()=>calls.push('release')};\n\
    assert.equal((await claim({connect:async()=>connection},'mac')).asset_id,'test');\n\
    assert.equal(calls[0],'BEGIN');assert(calls[1].includes('pg_advisory_xact_lock'));assert(calls[2].includes('count(*)'));assert.equal(calls[3],'COMMIT');assert.equal(calls[4],'release');\n\
    for(const bad of [{...value,seconds:NaN},{...value,matches:[{box:[0.8,0,0.1,1],probability:0.95}]},{...value,matches:[{box:[0,0,1,1],probability:0.89}]}])\n\
    \  assert.throws(()=>validateResult(bad));\nif(process.argv.includes('--postgres'))\
    \ {\n  const {Pool}=createRequire('/usr/src/app/server/package.json')('pg');\n\
    \  const db=new Pool({max:3});const id='queue-test-'+Date.now();\n  try {\n  \
    \  await db.query(\"INSERT INTO waffles.runs(id,mode,state,workers,config) VALUES($1,'benchmark','running',ARRAY['pve','still-fawn'],'{}')\"\
    ,[id]);\n    for(let n=1;n<=2;n++)await db.query(\"INSERT INTO waffles.jobs(run_id,asset_id,taken_at,ordinal)\
    \ VALUES($1,$2,'2020-01-01',$3)\",[id,'00000000-0000-4000-8000-'+String(n).padStart(12,'0'),n]);\n\
    \    const [a,b]=await Promise.all([claim(db,'pve'),claim(db,'still-fawn')]);\n\
    \    assert(a&&b&&a.asset_id!==b.asset_id,'Workers must receive distinct assets');\n\
    \    await db.query(\"UPDATE waffles.jobs SET lease_until=now()-interval '1 second'\
    \ WHERE run_id=$1 AND asset_id=$2\",[id,a.asset_id]);\n    assert.equal(await\
    \ finish(db,a,value),false,'Expired claims cannot commit');\n    const retry=await\
    \ claim(db,'pve');assert.equal(retry.asset_id,a.asset_id);assert.notEqual(retry.claim,a.claim);\n\
    \    assert.equal(await finish(db,a,value),false,'Old fencing token cannot commit');\n\
    \    assert.equal(await finish(db,retry,value),true);\n    assert.equal(await\
    \ finish(db,retry,value),false,'Duplicate completion cannot commit twice');\n\
    \    assert.equal(await finish(db,b,value),true);\n    assert.equal((await db.query(\"\
    SELECT count(*)::int n FROM waffles.jobs WHERE run_id=$1 AND status='complete'\"\
    ,[id])).rows[0].n,2);\n    console.log('PostgreSQL concurrency, lease expiry,\
    \ fencing and duplicate completion tests passed');\n  } finally {\n    await db.query('DELETE\
    \ FROM waffles.jobs WHERE run_id=$1',[id]);\n    await db.query('DELETE FROM waffles.runs\
    \ WHERE id=$1',[id]);await db.end();\n  }\n}\nconsole.log('Result validation checks\
    \ passed');\n"
