      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "run",
            "label": "Run",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(waffles_run_state, run)",
            "refresh": 1,
            "sort": 1,
            "current": {
              "text": "historical-waffles",
              "value": "historical-waffles"
            }
          }
        ]
      },
      "links": [
        {
          "title": "Pet Tagger \u00b7 references",
          "url": "https://pets.app.home.panderosystems.com",
          "type": "link",
          "targetBlank": true
        },
        {
          "title": "Knowledge Index",
          "url": "/d/knowledge-index/knowledge-index",
          "type": "link"
        }
      ],
      "panels": [
        {
          "id": 1,
          "title": "Photos processed",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "description": "Distinct assets with committed results in this run. Includes non-Waffles photos. Benchmark runs finish after classification and never write to Immich.",
          "targets": [
            {
              "refId": "A",
              "expr": "((sum(waffles_jobs{run=\"$run\",state=~\"complete\",worker=~\".*\"}) or vector(0)) and on() max(waffles_run_state{run=\"$run\"})) and on() ((max(waffles_queue_up)==1) and on() (time()-max(waffles_queue_report_timestamp_seconds)<60))",
              "legendFormat": "Committed results",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "decimals": 0,
              "noValue": "No data yet",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "graphMode": "none",
            "textMode": "value_and_name",
            "colorMode": "value",
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
