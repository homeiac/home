  selector:
    app: photo-otel
  ports:
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
  - name: metrics
    port: 8889
    targetPort: metrics
  - name: health
    port: 13133
    targetPort: health
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: photo-otel-private
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
    - 192.168.4.0/24
    - 100.64.0.0/10
    - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: photo-otel
  namespace: monitoring
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`photo-otel.app.home.panderosystems.com`)
    kind: Rule
    middlewares:
    - name: photo-otel-private
    services:
    - name: photo-otel
      port: 4318
  tls: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: photo-otel
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: photo-otel
  endpoints:
  - port: metrics
    interval: 15s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: photo-observability-datasources
  namespace: monitoring
  labels:
    grafana_datasource: '1'
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- name: Photo traces\n  uid: photo-tempo\n\
    \  type: tempo\n  access: proxy\n  url: http://photo-tempo.monitoring.svc.cluster.local:3200\n\
    \  jsonData:\n    tracesToLogsV2:\n      datasourceUid: photo-loki\n      spanStartTimeShift:\
    \ -1m\n      spanEndTimeShift: 1m\n      customQuery: true\n      query: '{service_name=\"\
    photo-review\"} | json | trace_id=\"$${__span.traceId}\"'\n- name: Photo logs\n\
    \  uid: photo-loki\n  type: loki\n  access: proxy\n  url: http://photo-loki.monitoring.svc.cluster.local:3100\n\
    \  jsonData:\n    derivedFields:\n    - name: TraceID\n      matcherRegex: '\"\
    trace_id\":\\s*\"([a-f0-9]{32})\"'\n      datasourceUid: photo-tempo\n      url:\
    \ $${__value.raw}\n"
