apiVersion: v1
kind: ConfigMap
metadata:
  name: photo-otel-config
  namespace: monitoring
data:
  config.yaml: "extensions:\n  health_check:\n    endpoint: 0.0.0.0:13133\nreceivers:\n\
    \  otlp:\n    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n\
    \  memory_limiter:\n    check_interval: 1s\n    limit_mib: 192\n    spike_limit_mib:\
    \ 32\n  batch:\n    timeout: 1s\n    send_batch_size: 256\nexporters:\n  otlp/tempo:\n\
    \    endpoint: photo-tempo.monitoring.svc.cluster.local:4317\n    tls:\n     \
    \ insecure: true\n  otlphttp/loki:\n    endpoint: http://photo-loki.monitoring.svc.cluster.local:3100/otlp\n\
    \  prometheus:\n    endpoint: 0.0.0.0:8889\n    resource_to_telemetry_conversion:\n\
    \      enabled: true\nservice:\n  extensions:\n  - health_check\n  pipelines:\n\
    \    traces:\n      receivers:\n      - otlp\n      processors:\n      - memory_limiter\n\
    \      - batch\n      exporters:\n      - otlp/tempo\n    logs:\n      receivers:\n\
    \      - otlp\n      processors:\n      - memory_limiter\n      - batch\n    \
    \  exporters:\n      - otlphttp/loki\n    metrics:\n      receivers:\n      -\
    \ otlp\n      processors:\n      - memory_limiter\n      - batch\n      exporters:\n\
    \      - prometheus\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-otel
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photo-otel
