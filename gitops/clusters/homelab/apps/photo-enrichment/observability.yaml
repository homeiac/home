apiVersion: v1
kind: ConfigMap
metadata:
  name: photo-tempo-config
  namespace: monitoring
data:
  config.yaml: "target: all\nstream_over_http_enabled: true\nserver:\n  http_listen_port:\
    \ 3200\ndistributor:\n  receivers:\n    otlp:\n      protocols:\n        grpc:\n\
    \          endpoint: 0.0.0.0:4317\nstorage:\n  trace:\n    backend: local\n  \
    \  wal:\n      path: /var/tempo/wal\n    local:\n      path: /var/tempo/blocks\n\
    backend_worker:\n  compaction:\n    block_retention: 48h\nusage_report:\n  reporting_enabled:\
    \ false\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photo-tempo
  namespace: monitoring
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-tempo
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photo-tempo
  template:
    metadata:
      labels:
        app: photo-tempo
      annotations:
        checksum/config: bc26f10ff6a1aaef819ffa91664062c98b31893e2e80f1c12cf81751363b7532
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-still-fawn
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: photo-tempo
        image: grafana/tempo:3.1.0
        args:
        - -config.file=/etc/photo-observability/config.yaml
        ports:
        - name: http
          containerPort: 3200
        - name: otlp-grpc
          containerPort: 4317
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/photo-observability
          readOnly: true
        - name: data
          mountPath: /var/tempo
        readinessProbe:
          httpGet:
            path: /ready
            port: 3200
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /ready
            port: 3200
          initialDelaySeconds: 90
          periodSeconds: 20
          failureThreshold: 6
      volumes:
      - name: config
        configMap:
          name: photo-tempo-config
      - name: data
        persistentVolumeClaim:
          claimName: photo-tempo
---
apiVersion: v1
kind: Service
metadata:
  name: photo-tempo
  namespace: monitoring
  labels:
    app: photo-tempo
spec:
  selector:
    app: photo-tempo
  ports:
  - name: http
    port: 3200
    targetPort: http
  - name: otlp-grpc
    port: 4317
    targetPort: otlp-grpc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: photo-loki-config
  namespace: monitoring
data:
  config.yaml: "auth_enabled: false\nserver:\n  http_listen_port: 3100\n  grpc_listen_port:\
    \ 9096\ncommon:\n  instance_addr: 127.0.0.1\n  path_prefix: /loki\n  replication_factor:\
    \ 1\n  ring:\n    kvstore:\n      store: inmemory\n  storage:\n    filesystem:\n\
    \      chunks_directory: /loki/chunks\n      rules_directory: /loki/rules\nschema_config:\n\
    \  configs:\n  - from: '2020-10-24'\n    store: tsdb\n    object_store: filesystem\n\
    \    schema: v13\n    index:\n      prefix: index_\n      period: 24h\nstorage_config:\n\
    \  tsdb_shipper:\n    active_index_directory: /loki/index\n    cache_location:\
    \ /loki/index-cache\ningester:\n  wal:\n    dir: /loki/wal\ncompactor:\n  working_directory:\
    \ /loki/compactor\n  compaction_interval: 10m\n  retention_enabled: true\n  retention_delete_delay:\
    \ 2h\n  retention_delete_worker_count: 10\n  delete_request_store: filesystem\n\
    limits_config:\n  allow_structured_metadata: true\n  retention_period: 72h\nanalytics:\n\
    \  reporting_enabled: false\n"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photo-loki
  namespace: monitoring
spec:
