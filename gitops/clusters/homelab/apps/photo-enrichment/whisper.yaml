apiVersion: apps/v1
kind: Deployment
metadata:
  name: photo-whisper
  namespace: immich-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: photo-whisper
  template:
    metadata:
      labels:
        app: photo-whisper
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-pumped-piglet-gpu
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: models
        image: alpine/git:v2.49.1@sha256:53a6239398162098fed2f49a46512f9cbba9e3f31b9f2cea4fa90129ee069a99
        command:
        - /bin/sh
        - -ec
        args:
        - "fetch() {\n  name=\"$1\"; url=\"$2\"; digest=\"$3\"\n  if ! echo \"$digest  /models/$name\" | sha256sum -c -s; then\n   \
          \ wget -q -O \"/models/$name.partial\" \"$url\"\n    echo \"$digest  /models/$name.partial\" | sha256sum -c -s\n    mv \"\
          /models/$name.partial\" \"/models/$name\"\n  fi\n  chmod 644 \"/models/$name\"\n}\nfetch ggml-base-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q5_1.bin\
          \ 422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898\nfetch ggml-small-q5_1.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small-q5_1.bin\
          \ ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb\nfetch ggml-silero-v6.2.0.bin https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin\
          \ 2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987\n"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - name: models
          mountPath: /models
      containers:
      - name: whisper
        image: ghcr.io/ggml-org/whisper.cpp@sha256:456ff35fac081ea8a7f4a0fecf31ba5f5263a250510826ad1442c9c9ada2715a
        command:
        - /app/build/bin/whisper-server
        args:
        - -m
        - /models/ggml-small-q5_1.bin
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        - -l
        - auto
        - -t
        - '2'
        - -bs
        - '1'
        - -bo
        - '1'
        - -nc
        - -sns
        - -fa
        - --vad
        - -vm
        - /models/ggml-silero-v6.2.0.bin
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          failureThreshold: 120
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        resources:
          requests:
            nvidia.com/gpu: '1'
            cpu: 250m
            memory: 512Mi
          limits:
            nvidia.com/gpu: '1'
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: models
        hostPath:
          path: /var/lib/photo-models/whisper
          type: DirectoryOrCreate
      - name: temporary
        emptyDir:
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: photo-whisper
  namespace: immich-pilot
spec:
  selector:
    app: photo-whisper
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: photo-whisper-private
  namespace: immich-pilot
spec:
  ipAllowList:
    sourceRange:
    - 192.168.4.0/24
    - 100.64.0.0/10
    - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: photo-whisper
  namespace: immich-pilot
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`whisper.app.home.panderosystems.com`) && (Path(`/inference`) || Path(`/health`))
    kind: Rule
    middlewares:
    - name: photo-whisper-private
    services:
    - name: photo-whisper
      port: 8080
  tls:
    secretName: wildcard-home-tls
---
