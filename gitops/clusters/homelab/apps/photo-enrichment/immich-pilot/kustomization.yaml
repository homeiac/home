apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - database.yaml
  - database-secret.sops.yaml
  - google-oauth.sops.yaml
  - release.yaml
  - ingress.yaml
  - piglet-storage.yaml
  - family-viewers.yaml
  - family-viewers.sops.yaml
configMapGenerator:
  - name: immich-family-viewer-script
    namespace: immich-pilot
    files: [family-viewers.mjs]
  - name: immich-album-grid-v1
    namespace: immich-pilot
    options:
      disableNameSuffixHash: true
    files: [album-grid.cjs]
