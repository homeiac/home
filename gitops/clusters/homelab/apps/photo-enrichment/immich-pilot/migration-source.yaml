# Temporary read-only helper for the move to piglet. Old PVCs remain rollback copies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-migration-source
  namespace: immich-pilot
spec:
  replicas: 1
  selector:
    matchLabels: {app: immich-migration-source}
  template:
    metadata:
      labels: {app: immich-migration-source}
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-still-fawn
      containers:
        - name: archive
          image: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
          command: [sleep, infinity]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: library, mountPath: /source/library, readOnly: true}
            - {name: valkey, mountPath: /source/valkey, readOnly: true}
      volumes:
        - name: library
          persistentVolumeClaim: {claimName: immich-library, readOnly: true}
        - name: valkey
          persistentVolumeClaim: {claimName: immich-valkey, readOnly: true}
