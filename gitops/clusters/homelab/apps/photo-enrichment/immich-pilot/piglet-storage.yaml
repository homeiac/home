# Local SSD state on VM 105. Retain source and target volumes for rollback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-piglet-library
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-path
  local:
    path: /var/lib/immich-pilot/library
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3s-vm-pumped-piglet-gpu
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-piglet
  namespace: immich-pilot
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  volumeName: immich-piglet-library
  resources:
    requests:
      storage: 20Gi
---
