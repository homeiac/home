apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: immich-pilot
spec:
  interval: 24h
  url: https://immich-app.github.io/immich-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich-pilot
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-pumped-piglet-gpu
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.4.2
    immich:
      # Preserve the existing UI-managed upload layout when switching to a config file.
      configuration:
        storageTemplate:
          enabled: true
          template: '{{y}}/{{MM}}/{{dd}}/{{filename}}'
        ffmpeg:
          accel: nvenc
          accelDecode: false
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library-piglet
    server:
      defaultPodOptions:
        runtimeClassName: nvidia
      persistence:
        originals:
          enabled: true
          type: hostPath
          hostPath: /mnt/gphotos/library
          hostPathType: Directory
          globalMounts:
            - path: /external/gphotos
              readOnly: true
      serviceMonitor:
        main:
          labels:
            release: kube-prometheus-stack
      controllers:
        main:
          replicas: 1
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
              env:
                # OTel 0.300 constructs an invalid base URL from Immich's default ::.
                # This IPv4 cluster needs a routable metrics listener, not an IPv6 URL.
                IMMICH_HOST: 0.0.0.0
                IMMICH_LOG_FORMAT: json
                NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
                DB_HOSTNAME: immich-postgres
                DB_USERNAME: immich
                DB_DATABASE_NAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database
                      key: password
              resources:
                # The initial 89k-asset scan saturates 2 CPUs and approaches 4Gi.
                # Give image workers headroom; the scheduler still shares the node.
                requests: {cpu: '1', memory: 2Gi, nvidia.com/gpu: '1'}
                limits: {cpu: '4', memory: 6Gi, nvidia.com/gpu: '1'}
    machine-learning:
      defaultPodOptions:
        runtimeClassName: nvidia
      controllers:
        main:
          replicas: 0  # Temporary: release one accounted share for Whisper live trials.
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.4.2-cuda@sha256:0a8aeaeb6771da78c4f54bc00b429b113267db50aa121aa6e30f78ef86a31e33
              env:
                MACHINE_LEARNING_MODEL_REVISION: v2
                MACHINE_LEARNING_REQUEST_THREADS: '2'
                MACHINE_LEARNING_MODEL_INTER_OP_THREADS: '1'
                MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: '2'
                # Reuse fixed-shape TensorRT engines and bound shared RTX 3070 memory.
                MACHINE_LEARNING_MAX_BATCH_SIZE__OCR: '1'
              resources:
                requests: {cpu: 500m, memory: 1Gi, nvidia.com/gpu: '1'}
                limits: {cpu: '2', memory: 4Gi, nvidia.com/gpu: '1'}
      persistence:
        cache:
          retain: true
          type: persistentVolumeClaim
          existingClaim: immich-cache-piglet
          accessMode: ReadWriteOnce
          size: 10Gi
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                tag: 9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: '1', memory: 512Mi}
      persistence:
        data:
          retain: true
          type: persistentVolumeClaim
          existingClaim: immich-valkey-piglet
          size: 1Gi
