apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: immich-pilot
spec:
  interval: 24h
  url: https://immich-app.github.io/immich-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich-pilot
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: immich
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-still-fawn
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.4.2
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: immich-library
    server:
      serviceMonitor:
        main:
          labels:
            release: kube-prometheus-stack
      controllers:
        main:
          replicas: 0 # Quiesce while moving durable state to piglet.
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
              env:
                # OTel 0.300 constructs an invalid base URL from Immich's default ::.
                # This IPv4 cluster needs a routable metrics listener, not an IPv6 URL.
                IMMICH_HOST: 0.0.0.0
                IMMICH_LOG_FORMAT: json
                DB_HOSTNAME: immich-postgres
                DB_USERNAME: immich
                DB_DATABASE_NAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-database
                      key: password
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {cpu: '2', memory: 4Gi}
    machine-learning:
      controllers:
        main:
          replicas: 0
          strategy: Recreate
          containers:
            main:
              image:
                tag: v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
              env:
                MACHINE_LEARNING_MODEL_REVISION: v2
                MACHINE_LEARNING_REQUEST_THREADS: '2'
                MACHINE_LEARNING_MODEL_INTER_OP_THREADS: '1'
                MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: '2'
              resources:
                requests: {cpu: 500m, memory: 1Gi}
                limits: {cpu: '2', memory: 4Gi}
      persistence:
        cache:
          retain: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 10Gi
    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              image:
                tag: 9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: '1', memory: 512Mi}
      persistence:
        data:
          retain: true
          type: persistentVolumeClaim
          size: 1Gi
