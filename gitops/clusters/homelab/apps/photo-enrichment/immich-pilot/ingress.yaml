# Traefik's existing default wildcard certificate covers this private pilot.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: private
  namespace: immich-pilot
spec:
  ipAllowList:
    sourceRange: [192.168.4.0/24, 100.64.0.0/10, 10.42.0.0/16]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich
  namespace: immich-pilot
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`immich.app.home.panderosystems.com`)
      kind: Rule
      middlewares:
        - name: private
      services:
        - name: immich-server
          port: 2283
  tls: {}
