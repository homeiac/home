    datetime.timezone.utc).strftime(''%Y-%m-%d'')\n    context = json.dumps(hints, ensure_ascii=False)[:2000]\n    prompt
    = (''These chronological frames sample a '' + str(round(duration, 1)) + '' second video at seconds ''\n              +
