    "gphotos.py": "#!/usr/bin/env python3\n\"\"\"Google Photos adapter for the knowledge index (issue #212).\n\nUsage:\n  gphotos.py
    emit <unit> <root> <out_dir> [--paths-from FILE] [--versions DIR] [--prom FILE] [--expected N]\n\n  root       library
    root, read-only: the folder that holds \"Google Photos/\" (<dataset>/library)\n  out_dir    the knowledge-index dataset;
    this adapter writes only below it:\n               files/gphotos/<unit>.parquet             one row per file (common `files`
    schema)\n               gphotos_sidecars/<unit>.parquet          one row per Takeout .json sidecar\n               files/gphotos/<unit>.versions.parquet    only
    with --versions (rows under \".versions/\")\n  --paths-from FILE   index only these library-relative paths (one per line)
    instead of walking root\n                      (the ingest hook passes the files an archive just delivered)\n  --prom
    FILE         write live progress metrics (Prometheus textfile, updated every ~2 s; see progress.py)\n  --expected N        files
    the ledger says exist (progress ratio while listing)\n  --versions DIR      also index DIR (<dataset>/.versions); paths
    are stored as \".versions/<rel>\"\n\nAdapter contract (docs/runbooks/knowledge-index.md): emit(unit, root, out_dir) is
    idempotent (parquet is\nwritten to <name>.tmp and renamed, so re-running a unit replaces its file), reads only from root,
    writes\nonly below out_dir, and prints one summary line: \"rows=N bytes=B seconds=S\".\n\nSidecar matching is NOT done
    here: a photo and its sidecar can come from different archives. This adapter\nrecords, per sidecar, `target_name` (the
    media file name it describes, with the \"(n)\" duplicate suffix\nre-inserted before the extension, as gphotos-quota-list.py
    does) and knowledge.sql joins across the library.\n\"\"\"\nimport datetime\nimport json\nimport os\nimport re\nimport
    sys\nimport time\n\nsys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))\nfrom progress import
    Progress  # noqa: E402\n\nMEDIA_EXTS = {\"cr2\", \"jpg\", \"jpeg\", \"heic\", \"png\", \"gif\", \"webp\", \"mp4\", \"mov\",
    \"3gp\", \"avi\", \"mpg\", \"m4v\"}\nDUP = re.compile(r\"\\((\\d+)\\)\\.json$\")\n\nFILES_SCHEMA = (\n    \"source VARCHAR,
    unit VARCHAR, path VARCHAR, name VARCHAR, ext VARCHAR, size_bytes BIGINT, \"\n    \"mtime TIMESTAMP, kind VARCHAR, hash_algo
    VARCHAR, hash VARCHAR, origin_id VARCHAR, ingested_at TIMESTAMP\"\n)\nSIDECAR_SCHEMA = (\n    \"path VARCHAR, title VARCHAR,
    target_name VARCHAR, description VARCHAR, upload_ts BIGINT, taken_ts BIGINT, \"\n    \"geo_lat DOUBLE, geo_lon DOUBLE,
    geo_alt DOUBLE, url VARCHAR, device_type VARCHAR, device_folder VARCHAR, \"\n    \"app_package VARCHAR, views INTEGER,
    favorited BOOLEAN, people VARCHAR[], parse_error VARCHAR\"\n)\n\n\ndef sidecar_target(jname, title):\n    \"\"\"Media
    file name a sidecar describes (same rule as gphotos-quota-list.py).\"\"\"\n    m = DUP.search(jname)\n    if m and title:\n        stem,
    ext = os.path.splitext(title)\n        return \"%s(%s)%s\" % (stem, m.group(1), ext)\n    return title\n\n\ndef file_kind(name):\n    ext
    = os.path.splitext(name)[1][1:].lower()\n    if ext == \"json\":\n        return \"sidecar\"\n    return \"media\" if
    ext in MEDIA_EXTS else \"other\"\n\n\ndef _int(v):\n    try:\n        return int(float(v))\n    except (TypeError, ValueError):\n        return
    None\n\n\ndef _float(v):\n    try:\n        return float(v)\n    except (TypeError, ValueError):\n        return None\n\n\ndef
    parse_sidecar(abs_path, rel_path):\n    \"\"\"One gphotos_sidecars row (tuple in SIDECAR_SCHEMA order); unparseable ->
    NULLs + parse_error.\"\"\"\n    jname = os.path.basename(rel_path)\n    try:\n        with open(abs_path, encoding=\"utf-8\")
    as fh:\n            meta = json.load(fh)\n        if not isinstance(meta, dict):\n            raise ValueError(\"top level
    is not an object\")\n    except (OSError, ValueError) as exc:\n        return (rel_path,) + (None,) * 15 + (\"%s: %s\"
    % (type(exc).__name__, exc),)\n    title = meta.get(\"title\")\n    geo = meta.get(\"geoData\") or {}\n    origin = (meta.get(\"googlePhotosOrigin\")
    or {}).get(\"mobileUpload\") or {}\n    people = [p.get(\"name\") for p in (meta.get(\"people\") or []) if isinstance(p,
    dict) and p.get(\"name\")]\n    fav = meta.get(\"favorited\")\n    return (\n        rel_path, title, sidecar_target(jname,
    title), meta.get(\"description\"),\n        _int((meta.get(\"creationTime\") or {}).get(\"timestamp\")),\n        _int((meta.get(\"photoTakenTime\")
