    "[Unit]\nDescription=GitOps photo and video caption worker\nWants=network-online.target\nAfter=network-online.target zfs-mount.service\nRequiresMountsFor=/local-3TB-backup/knowledge-index
    /local-3TB-backup/gphotos\nStartLimitIntervalSec=0\n\n[Service]\nType=simple\nEnvironmentFile=/etc/default/knowledge-index\nEnvironment=PYTHONUNBUFFERED=1\nEnvironment=KI_PIPELINE_PROM=/var/lib/prometheus/node-exporter/knowledge_index_pipeline.prom\nEnvironment=KI_GPU_DISPATCH_POLICY_FILE=/opt/knowledge-index/caption-gitops/dispatch-policy.json\nExecStart=/opt/knowledge-index/venv/bin/python
    /opt/knowledge-index/caption-gitops/run.py\nRestart=always\nRestartSec=60\nRestartPreventExitStatus=75\nTimeoutStopSec=45\nKillMode=control-group\nNice=10\nIOSchedulingClass=idle\n\n[Install]\nWantedBy=multi-user.target\n",
    "knowledge.sql": "-- Knowledge index views (issue #212). Applied by kidx.py rebuild; @INDEX@ = the index dataset mount
    point.\n-- No data lives in knowledge.duckdb: every view reads the immutable Parquet below @INDEX@, so a rule\n-- change
    (e.g. the quota cutoff) never needs a re-ingest.\n\n-- ---- common facts: latest row wins when a later unit re-delivers
    a path (a re-exported, replaced file)\nCREATE OR REPLACE VIEW files AS\nSELECT * FROM read_parquet(''@INDEX@/files/*/*.parquet'',
    union_by_name = true)\nQUALIFY row_number() OVER (PARTITION BY source, path ORDER BY ingested_at DESC, unit DESC) = 1;\n\n--
    ---- Photos raw sidecar fields (one row per .json), same latest-wins rule (the newer unit''s file name sorts later: units
    are archive names / backfill-YYYYMMDD)\nCREATE OR REPLACE VIEW gphotos_sidecars AS\nSELECT * EXCLUDE (filename) FROM read_parquet(''@INDEX@/gphotos_sidecars/*.parquet'',
    union_by_name = true, filename = true)\nQUALIFY row_number() OVER (PARTITION BY path ORDER BY filename DESC) = 1;\n\n--
    ---- mutable per-location inventory (Phase 2 fills it; empty and typed until then)\nCREATE OR REPLACE VIEW copies AS\nSELECT
    * FROM read_parquet(''@INDEX@/copies/*.parquet'', union_by_name = true);\n\n-- ---- Photos: library files vs. replaced
    older copies kept under .versions/\nCREATE OR REPLACE VIEW gphotos_files AS\n-- Older inventory partitions predate CR2
    support. Reclassify without rescanning originals.\nSELECT * REPLACE (CASE WHEN kind=''other'' AND lower(ext)=''cr2'' THEN
    ''media'' ELSE kind END AS kind)\nFROM files WHERE source = ''gphotos'' AND path NOT LIKE ''.versions/%'';\n\nCREATE OR
    REPLACE VIEW gphotos_versions AS\nSELECT * FROM files WHERE source = ''gphotos'' AND path LIKE ''.versions/%'';\n\n--
    ---- sidecars that carry a title AND an upload time (the only ones that identify a photo''s upload date),\n-- ---- each
    with the two file names it can describe: the title itself and \"<stem>-edited<ext>\"\nCREATE OR REPLACE VIEW gphotos_sidecar_targets
    AS\nSELECT s.*,\n       regexp_replace(path, ''/[^/]+$'', '''') AS folder,\n       CASE WHEN regexp_matches(target_name,
    ''^.+\\.[^.]*$'')\n            THEN regexp_replace(target_name, ''^(.+)(\\.[^.]*)$'', ''\\1-edited\\2'')\n            ELSE
    target_name || ''-edited'' END AS edited_name\nFROM gphotos_sidecars s\nWHERE title IS NOT NULL AND upload_ts IS NOT NULL;\n\n--
    ---- every non-sidecar library file (kind media or other, as gphotos-quota-list.py: it treats every\n-- ---- non-.json
    file as media) joined to its sidecar by (folder, title incl. \"(n)\" suffix, \"-edited\")\nCREATE OR REPLACE VIEW gphotos_media
    AS\nWITH m AS (\n  SELECT f.*, regexp_replace(f.path, ''/[^/]+$'', '''') AS folder FROM gphotos_files f WHERE f.kind <>
    ''sidecar''\n), cand AS (\n  SELECT m.path AS media_path, t.path AS sidecar_path,\n         CASE WHEN m.name = t.target_name
    THEN 1 ELSE 2 END AS prio\n  FROM m JOIN gphotos_sidecar_targets t\n    ON t.folder = m.folder AND (m.name = t.target_name
    OR m.name = t.edited_name)\n), best AS (\n  SELECT media_path, sidecar_path FROM cand\n  QUALIFY row_number() OVER (PARTITION
    BY media_path ORDER BY prio, sidecar_path) = 1\n)\nSELECT m.path, m.name, m.ext, m.kind, m.size_bytes, m.mtime, m.unit,
    m.folder,\n       regexp_extract(m.folder, ''[^/]+$'') AS folder_name,\n       b.sidecar_path,\n       t.upload_ts, t.taken_ts,
    t.url, t.description, t.device_type, t.favorited, t.people,\n       NOT (coalesce(t.geo_lat, 0) = 0 AND coalesce(t.geo_lon,
    0) = 0) AS has_geo,\n       CASE WHEN regexp_matches(regexp_extract(m.folder, ''[^/]+$''), ''^Photos from [0-9]{4}$'')
    THEN NULL\n            ELSE regexp_extract(m.folder, ''[^/]+$'') END AS album,\n       regexp_matches(m.name, ''-edited(\\.[^.]*)?$'')
    AS is_edited\nFROM m\nLEFT JOIN best b ON b.media_path = m.path\nLEFT JOIN gphotos_sidecar_targets t ON t.path = b.sidecar_path;\n\n--
    ---- album duplicate: a media file in an album folder with the same (name, size) as one in a \"Photos from YYYY\" folder\nCREATE
    OR REPLACE VIEW gphotos_album_dup AS\nSELECT a.* FROM gphotos_media a\nWHERE a.album IS NOT NULL\n  AND EXISTS (SELECT
    1 FROM gphotos_media y WHERE y.album IS NULL AND y.name = a.name AND y.size_bytes = a.size_bytes);\n\n-- ---- counts against
    Google quota: uploaded on/after 2021-06-01 UTC (epoch 1622505600) or no sidecar, minus album\n-- ---- duplicates; the
    matched sidecar files ride along (kind = ''sidecar''), exactly the set gphotos-quota-list.py prints\nCREATE OR REPLACE
    VIEW gphotos_quota AS\nWITH sel AS (\n  SELECT m.*, CASE WHEN m.upload_ts IS NULL THEN ''no-sidecar'' ELSE ''uploaded-on-or-after-cutoff''
    END AS quota_reason\n  FROM gphotos_media m\n  WHERE (m.upload_ts IS NULL OR m.upload_ts >= 1622505600)\n    AND NOT EXISTS
    (SELECT 1 FROM gphotos_album_dup d WHERE d.path = m.path)\n)\nSELECT path, name, kind, size_bytes, taken_ts, upload_ts,
    quota_reason FROM sel\nUNION\nSELECT s.path, f.name, ''sidecar'', f.size_bytes, NULL, NULL, s.quota_reason\nFROM (SELECT
    DISTINCT sidecar_path AS path, quota_reason FROM sel WHERE sidecar_path IS NOT NULL) s\nJOIN gphotos_files f ON f.path
    = s.path;\n\n-- ---- AI enrichment (photo/video summaries from a local GPU model): written by enrichers, one Parquet per\n--
    ---- (enricher, batch) under summaries/<enricher>/; typed and empty until the first enricher runs.\n-- ---- Latest row
    wins per (source, path, enricher); `size_bytes` records which bytes were summarized.\nCREATE OR REPLACE VIEW media_summaries
    AS\nSELECT * FROM read_parquet(''@INDEX@/summaries/*/*.parquet'', union_by_name = true)\nQUALIFY row_number() OVER (PARTITION
    BY source, path, enricher ORDER BY created_at DESC) = 1;\n\n-- ---- work queue for an enricher: media with no successful
    summary for their current bytes, with the context the\n-- ---- prompt needs. A table macro (not a view) so a brand-new
    enricher id works before it has any rows:\n-- ----   SELECT path FROM gphotos_to_summarize(''qwen25vl-3b-p1'') ORDER BY
    taken_ts DESC LIMIT 500\nCREATE OR REPLACE MACRO gphotos_to_summarize(enr) AS TABLE\nSELECT m.path, m.name, m.ext, m.size_bytes,
    m.taken_ts, m.album, m.has_geo, m.people, m.description\nFROM gphotos_media m\nLEFT JOIN media_summaries s\n  ON s.source
    = ''gphotos'' AND s.path = m.path AND s.enricher = enr AND s.size_bytes = m.size_bytes AND s.status = ''ok''\nWHERE m.kind
    = ''media'' AND s.path IS NULL;\n", "media_summary.py": "#!/usr/bin/env python3\n\"\"\"Photo/video summary enricher for
    the knowledge index (issue #212, OpenSpec change add-media-summaries-enricher).\n\nUsage:\n  media_summary.py run --index
    DIR --library DIR --endpoint URL --model NAME --enricher ID\n                       [--limit N] [--batch-size 50] [--parallel
    1] [--frames 8] [--min-free-mib 3000] [--dry-run]\n\n  --index      knowledge-index dataset mount (reads knowledge.duckdb,
