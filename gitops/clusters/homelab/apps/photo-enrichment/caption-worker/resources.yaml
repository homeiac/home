data:
  bundle.json: '{"canon_raw.py": "\"\"\"Read Canon RAW caption inputs on the index host. Never upload a derivative.\"\"\"\nimport
    base64\nimport hashlib\nimport io\nimport json\nfrom pathlib import Path, PurePosixPath\nimport subprocess\nimport time\n\nfrom
    PIL import Image, ImageOps\n\nEXTERNAL = ''/external/gphotos/''\n\n\ndef guest(*command: str) -> str:\n    \"\"\"Use the
    index host''s existing VM guest agent read path.\"\"\"\n    for attempt in range(3):\n        result = subprocess.run([''qm'',
    ''guest'', ''exec'', ''105'', ''--timeout'', ''60'', ''--'', *command],\n                                capture_output=True,
    check=True, text=True, timeout=70)\n        report = json.loads(result.stdout)\n        if report.get(''exited'') and
    report.get(''exitcode'') == 0 and not report.get(''out-truncated''):\n            return report.get(''out-data'', '''')\n        transient
    = any(code in report.get(''err-data'', '''') for code in (''502 Bad Gateway'', ''503 Service Unavailable''))\n        if
    not transient or attempt == 2:\n            raise RuntimeError(''Immich guest read failed or was truncated'')\n        time.sleep(2
    ** attempt)\n\n\ndef lookup(path: str, size: int) -> dict:\n    \"\"\"Match the exact external path and owner of the configured
    library.\"\"\"\n    relative = PurePosixPath(path)\n    if relative.is_absolute() or ''..'' in relative.parts or relative.suffix.lower()
    != ''.cr2'':\n        raise ValueError(''Invalid external CR2 path'')\n    # Only hex enters the query. Takeout paths
    may contain quotes or newlines.\n    encoded = (EXTERNAL + path).encode().hex()\n    sql = f\"\"\"\n      SELECT json_build_object(''id'',a.id,''size'',e.\"fileSizeInByte\",''native'',e.description,\n        ''unavailable'',a.\"deletedAt\"
    IS NOT NULL OR a.\"isOffline\" OR a.type<>''IMAGE'',\n        ''excluded'',h.value->>''excludeFromProcessing'',''packet'',m.value,\n        ''preview'',f.path)\n      FROM
    asset a JOIN library l ON l.id=a.\"libraryId\" AND l.\"ownerId\"=a.\"ownerId\"\n      LEFT JOIN asset_exif e ON e.\"assetId\"=a.id\n      LEFT
    JOIN asset_metadata m ON m.\"assetId\"=a.id AND m.key=''home.knowledge-index.v1''\n      LEFT JOIN asset_metadata h ON
    h.\"assetId\"=a.id AND h.key=''home.media-health.v1''\n      LEFT JOIN asset_file f ON f.\"assetId\"=a.id AND f.type=''preview''\n      WHERE
    l.name=''Existing Google Photos'' AND a.\"isExternal\"\n        AND a.\"originalPath\"=convert_from(decode(''{encoded}'',''hex''),''UTF8'')\"\"\"\n    rows
    = guest(''/usr/local/bin/k3s'',''kubectl'',''-n'',''immich-pilot'',''exec'',''deploy/immich-postgres'',''--'',''psql'',''-XAt'',''-v'',''ON_ERROR_STOP=1'',\n                 ''-U'',''immich'',''-d'',''immich'',''-c'',sql).splitlines()\n    if
    not rows:\n        return {}\n    if len(rows) != 1:\n        raise ValueError(''Ambiguous Immich RAW asset'')\n    asset
    = json.loads(rows[0])\n    if asset[''unavailable''] or asset[''excluded''] == ''true'' or asset[''size''] != size:\n        raise
    ValueError(''Immich RAW asset unavailable, excluded or changed'')\n    return asset\n\n\ndef original_path(library: str,
    path: str, size: int) -> Path:\n    \"\"\"Verify that the source still resolves inside the same library.\"\"\"\n    root
    = Path(library).resolve(strict=True)\n    original = (root / path).resolve(strict=True)\n    if not original.is_relative_to(root)
    or original.stat().st_size != size:\n        raise ValueError(''RAW original changed since import'')\n    return original\n\n\ndef
    sha256(original: Path) -> str:\n    with original.open(''rb'') as stream:\n        return hashlib.file_digest(stream,
    ''sha256'').hexdigest()\n\n\ndef match_catalog(index: str, library: str, row: dict, enricher: str, fingerprint: str) ->
    tuple | None:\n    \"\"\"Reuse a machine caption only after the candidate original matches byte-for-byte.\"\"\"\n    import
    duckdb\n    with duckdb.connect(str(Path(index) / ''knowledge.duckdb''), read_only=True) as con:\n        candidates =
    con.execute(\"\"\"SELECT path, summary, tags, model FROM media_summaries\n            WHERE source=''gphotos'' AND size_bytes=?
    AND enricher=? AND path<>?\n              AND status=''ok'' AND length(trim(summary))>0 AND model<>''immich-description''\n            ORDER
    BY path\"\"\", [row[''size_bytes''], enricher, row[''path'']]).fetchall()\n    for path, summary, tags, model in candidates:\n        try:\n            candidate
    = original_path(library, path, row[''size_bytes''])\n            if sha256(candidate) == fingerprint:\n                return
    summary, tags or [], model\n        except (OSError, ValueError):\n            continue\n    return None\n\n\ndef saved_caption(asset:
    dict, original: Path, fingerprint: str | None = None) -> tuple | None:\n    \"\"\"Prefer user text and validate any saved
    model caption against original bytes.\"\"\"\n    native = (asset.get(''native'') or '''').strip()\n    packet = asset.get(''packet'')
    or {}\n    summary = (packet.get(''summary'') or '''').strip()\n    if native and native != summary:\n        return native,
    [], ''immich-description''\n    if not summary:\n        return None\n    digest = packet.get(''contentSha256'')\n    if
    digest:\n        if (fingerprint or sha256(original)) != digest:\n            raise ValueError(''Saved caption belongs
    to different RAW bytes'')\n    return summary, packet.get(''tags'') or [], packet.get(''summaryModel'') or ''immich-description''\n\n\ndef
    jpeg(image: Image.Image, edge: int) -> bytes:\n    \"\"\"Return an oriented, bounded RGB JPEG in memory.\"\"\"\n    frame
    = ImageOps.exif_transpose(image)\n    frame.thumbnail((edge, edge), Image.Resampling.LANCZOS)\n    result = io.BytesIO()\n    frame.convert(''RGB'').save(result,
    format=''JPEG'', quality=88)\n    return result.getvalue()\n\n\ndef preview_bytes(path: str) -> bytes:\n    \"\"\"Read
    the actual Immich preview, bounded before the guest-agent transfer.\"\"\"\n    location = PurePosixPath(path)\n    if
    not location.is_relative_to(''/data/thumbs'') or ''..'' in location.parts:\n        raise ValueError(''Unexpected Immich
    preview location'')\n    # The deployment mounts this VM directory at /data. Resolve again inside the VM\n    # and stream
    bounded chunks so large previews survive guest-agent output limits.\n    program = \"\"\"import base64,json,os,sys\nfrom
    pathlib import Path\nroot=Path(''/var/lib/immich-pilot/library/thumbs'').resolve(strict=True)\npath=(root / sys.argv[1]).resolve(strict=True)\nif
    not path.is_relative_to(root): raise ValueError(''outside preview directory'')\nwith path.open(''rb'') as f:\n    stat=os.fstat(f.fileno())\n    if
    not 0 < stat.st_size <= 32*1024*1024: raise ValueError(''invalid preview size'')\n    f.seek(int(sys.argv[2]))\n    print(json.dumps([stat.st_size,stat.st_mtime_ns,base64.b64encode(f.read(196608)).decode()]))\n\"\"\"\n    data
    = bytearray()\n    revision = None\n    while True:\n        size, mtime, chunk = json.loads(guest(''python3'', ''-c'',
    program,\n            str(location.relative_to(''/data/thumbs'')), str(len(data))))\n        if revision is not None and
    revision != (size, mtime):\n            raise ValueError(''Immich preview changed during read'')\n        revision = size,
    mtime\n        block = base64.b64decode(chunk, validate=True)\n        if not block or len(data) + len(block) > size:\n            raise
    ValueError(''Incomplete Immich preview'')\n        data.extend(block)\n        if len(data) == size:\n            return
    bytes(data)\n\n\ndef frame(original: Path, preview: str | None, edge: int = 1024) -> tuple[bytes, str]:\n    \"\"\"Use
    Immich''s rendered image first, then develop the sensor data with LibRaw.\"\"\"\n    if preview:\n        try:\n            data
    = preview_bytes(preview)\n            with Image.open(io.BytesIO(data)) as image:\n                image.load()\n                if
    image.format == ''JPEG'' and max(image.size) <= edge:\n                    return data, ''immich-preview''\n                return
    jpeg(image, edge), ''immich-preview''\n        except (OSError, ValueError, RuntimeError, subprocess.SubprocessError):\n            pass\n    #
    Google Takeout can preserve the camera filename on a converted JPEG.\n    with original.open(''rb'') as stream:\n        if
    stream.read(3) == bytes.fromhex(''ff d8 ff''):\n            stream.seek(0)\n            with Image.open(stream) as image:\n                return
    jpeg(image, edge), ''original-jpeg''\n    import rawpy\n    with rawpy.imread(str(original)) as raw:\n        pixels =
    raw.postprocess(use_camera_wb=True, half_size=True, output_bps=8)\n    return jpeg(Image.fromarray(pixels), edge), ''libraw''\n",
    "caption_completion.py": "\"\"\"Caption coverage with the existing Takeout filename/size copy assumption.\n\nKeep year-folder
    files and standalone album files. Map an album copy to the\nlexically first matching year-folder path. This preserves
    the existing exclusion\ncount without merging separate year-folder files. A caption on any mapped copy\ncovers its group;
    it does not imply that every copy was sent to a model.\n\"\"\"\nimport glob\nfrom pathlib import Path\n\n\ndef completion_counts(con,
    index: str, luna_dir: str) -> list[tuple]:\n    \"\"\"Return kind, model, scope, total and complete from current media
    versions.\"\"\"\n    local = str(Path(index) / ''summaries/*/*.parquet'')\n    luna = str(Path(luna_dir) / ''*.parquet'')\n    empty
    = ''SELECT NULL::VARCHAR AS path, NULL::BIGINT AS size_bytes WHERE false''\n    local_sql = (\"SELECT DISTINCT path,size_bytes
    FROM read_parquet(?,union_by_name=true) \"\n                 \"WHERE source=''gphotos'' AND status=''ok''\") if glob.glob(local)
    else empty\n    luna_sql = (\"SELECT DISTINCT source_path AS path,size_bytes FROM read_parquet(?,union_by_name=true) \"\n                \"WHERE
    state=''ok''\") if glob.glob(luna) else empty\n    params = ([local] if glob.glob(local) else []) + ([luna] if glob.glob(luna)
    else [])\n    return con.execute(\"\"\"\n        WITH inventory AS (\n            SELECT DISTINCT path,size_bytes,name,\n                CASE
    WHEN lower(ext) IN (''mp4'',''mov'',''3gp'',''avi'',''mpg'',''m4v'')\n                     THEN ''video'' ELSE ''photo''
    END AS kind,\n                regexp_matches(path, ''/Photos from [0-9]{4}/'') AS annual\n            FROM gphotos_files
    WHERE kind=''media''\n        ), annual AS (\n            SELECT name,size_bytes,min(path) AS representative\n            FROM
    inventory WHERE annual GROUP BY name,size_bytes\n        ), local_saved AS (\"\"\" + local_sql + \"\"\"), luna_saved AS
    (\"\"\" + luna_sql + \"\"\"),\n        mapped AS (\n            SELECT i.*,\n                CASE WHEN i.annual THEN i.path
    ELSE coalesce(a.representative,i.path) END AS canonical,\n                l.path IS NOT NULL AS local_ok, c.path IS NOT
    NULL AS luna_ok\n            FROM inventory i LEFT JOIN annual a USING(name,size_bytes)\n            LEFT JOIN local_saved
    l ON l.path=i.path AND l.size_bytes=i.size_bytes\n            LEFT JOIN luna_saved c ON c.path=i.path AND c.size_bytes=i.size_bytes\n        ),
    groups AS (\n            SELECT canonical,size_bytes,kind,count(*) AS copies,\n                bool_or(local_ok) AS local_ok,
    bool_or(luna_ok) AS luna_ok\n            FROM mapped GROUP BY canonical,size_bytes,kind\n        ), coverage AS (\n            SELECT
    g.*, m.model,\n                CASE m.model WHEN ''local'' THEN local_ok WHEN ''luna'' THEN luna_ok\n                     ELSE
    local_ok OR luna_ok END AS complete\n            FROM groups g CROSS JOIN (VALUES (''local''),(''luna''),(''either''))
    m(model)\n        ) SELECT kind,model,s.scope,\n            sum(CASE s.scope WHEN ''deduplicated'' THEN 1 ELSE copies
    END)::BIGINT AS total,\n            sum(CASE WHEN complete THEN CASE s.scope WHEN ''deduplicated'' THEN 1 ELSE copies
    END\n                     ELSE 0 END)::BIGINT AS complete\n        FROM coverage CROSS JOIN (VALUES (''deduplicated''),(''including_copies''))
    s(scope)\n        GROUP BY kind,model,s.scope ORDER BY kind,model,s.scope\n    \"\"\", params).fetchall()\n", "config.json":
    "{\n  \"enabled\": true,\n  \"index\": \"/local-3TB-backup/knowledge-index\",\n  \"library\": \"/local-3TB-backup/gphotos/library\",\n  \"model\":
    \"bonsai-27b\",\n  \"enricher\": \"gemma4-e2b-p1\",\n  \"api\": \"ollama\",\n  \"parallel\": 2,\n  \"batch_size\": 16,\n  \"mac_assist\":
    true,\n  \"min_free_mib\": 3000,\n  \"extra\": {\n    \"think\": false,\n    \"options\": {\n      \"num_ctx\": 8192,\n      \"num_predict\":
    384,\n      \"temperature\": 0.2\n    }\n  },\n  \"frames\": 8,\n  \"video_edge\": 768,\n  \"video_prompt\": \"story\",\n  \"video_tokens\":
    256,\n  \"mac_video_parallel\": 1,\n  \"video_decode_threads\": 2\n}\n", "dispatch-policy.json": "{\n  \"mode\": \"continuous\",\n  \"page_size\":
    48,\n  \"mac_routing\": \"photo-first\",\n  \"queue_order\": \"photos-first\"\n}\n", "export-metrics.py": "#!/usr/bin/env
    python3\n\"\"\"Prometheus textfile metrics for the knowledge index (issue #212). Runs on the Proxmox host, scraped via
    node-exporter.\n\nUsage: export-metrics.py [--index DIR] [--photos DIR] [--out FILE] [--enrichers a,b] [--list-metrics]\n  --index    knowledge-index
    dataset mount (default: from `zfs get mountpoint local-3TB-backup/knowledge-index`)\n  --photos   photos dataset mount            (default:
    from `zfs get mountpoint local-3TB-backup/gphotos`)\n  --out      textfile (default /var/lib/prometheus/node-exporter/knowledge_index.prom;
    written atomically, tmp + rename)\n  --enrichers  extra enricher ids to report queue size for (also KI_ENRICHERS env,
    comma separated); enrichers that already have rows are always reported\n  --list-metrics  print the metric names this
    exporter can emit and exit (used by the dashboard/alert consistency test)\n\nMetrics: ollama_* (loaded model, GPU share),
    knowledge_index_* (files, bytes, sidecars, units, parquet, pending units, exporter health), gphotos_* (quota, ingest ledger),\nmedia_summaries_*
    (rows by status, queue, last batch time), knowledge_index_{backfill,enrich}_active, smart_* (USB/SATA disks: pending\nsectors
    etc., since a failing disk showed up on 2026-11-17). Missing tools (zfs, systemctl, smartctl) only omit their metrics.\n\"\"\"\nimport
    argparse\nimport glob\nimport json\nimport os\nimport subprocess\nimport sys\nimport time\n\nimport duckdb\n\nsys.path.insert(0,
    os.path.dirname(os.path.abspath(__file__)))\nfrom progress import BACKFILL_HELP  # noqa: E402\nfrom enrichers.pipeline_metrics
    import PIPELINE_HELP  # noqa: E402\nfrom caption_completion import completion_counts  # noqa: E402\n\nOUT_DEFAULT = \"/var/lib/prometheus/node-exporter/knowledge_index.prom\"\nINDEX_DATASET
    = \"local-3TB-backup/knowledge-index\"\nPHOTOS_DATASET = \"local-3TB-backup/gphotos\"\n\nHELP = {\n    \"knowledge_index_exporter_success\":
    (\"gauge\", \"1 if the last export read the index without error\"),\n    \"knowledge_index_exporter_duration_seconds\":
    (\"gauge\", \"seconds the last export took\"),\n    \"knowledge_index_last_run_timestamp_seconds\": (\"gauge\", \"unix
    time of the last export\"),\n    \"knowledge_index_files\": (\"gauge\", \"library files in the index by source and kind
    (media/sidecar/other)\"),\n    \"knowledge_index_bytes\": (\"gauge\", \"bytes of library files in the index by source
    and kind\"),\n    \"knowledge_index_versions_files\": (\"gauge\", \"older replaced copies kept under .versions\"),\n    \"knowledge_index_versions_bytes\":
    (\"gauge\", \"bytes of .versions copies\"),\n    \"knowledge_index_sidecars\": (\"gauge\", \"Takeout sidecar rows\"),\n    \"knowledge_index_sidecar_parse_errors\":
    (\"gauge\", \"sidecars that could not be parsed\"),\n    \"knowledge_index_units\": (\"gauge\", \"distinct ingest/backfill
    units in the index\"),\n    \"knowledge_index_parquet_files\": (\"gauge\", \"parquet files per table directory\"),\n    \"knowledge_index_dataset_bytes\":
    (\"gauge\", \"bytes of index files (parquet + duckdb)\"),\n    \"knowledge_index_pending_units\": (\"gauge\", \"ingested
    units whose indexing failed (index_pending)\"),\n    \"knowledge_index_backfill_active\": (\"gauge\", \"1 while the backfill
    systemd unit runs\"),\n    \"knowledge_index_enrich_active\": (\"gauge\", \"1 while the summary enricher systemd unit
    runs\"),\n    \"gphotos_media_without_sidecar\": (\"gauge\", \"media files with no usable Takeout sidecar\"),\n    \"gphotos_quota_files\":
    (\"gauge\", \"files counting against Google quota by kind\"),\n    \"gphotos_quota_bytes\": (\"gauge\", \"bytes counting
    against Google quota by kind\"),\n    \"gphotos_quota_media_files_by_year\": (\"gauge\", \"counted files (non-sidecar)
    per Photos-from-YYYY folder\"),\n    \"gphotos_quota_media_bytes_by_year\": (\"gauge\", \"counted bytes (non-sidecar)
    per Photos-from-YYYY folder\"),\n    \"gphotos_album_dup_files\": (\"gauge\", \"album copies skipped as duplicates\"),\n    \"gphotos_album_dup_bytes\":
    (\"gauge\", \"bytes of skipped album duplicates\"),\n    \"gphotos_ingest_archives\": (\"gauge\", \"Takeout archives in
    the ingest ledger\"),\n    \"gphotos_ingest_last_ok\": (\"gauge\", \"1 if the last ingest run finished ok\"),\n    \"gphotos_ingest_last_finished_timestamp_seconds\":
    (\"gauge\", \"unix time the last ingest run finished\"),\n    \"knowledge_index_caption_coverage\": (\"gauge\", \"Current
    distinct media versions by published local and Luna caption coverage\"),\n    \"knowledge_index_caption_completion\":
    (\"gauge\", \"Caption coverage using presumed Takeout copies by filename and size; complete captions cover matching copies\"),\n    \"knowledge_index_caption_first_saved_last_ten_minutes\":
    (\"gauge\", \"Current media versions whose earliest retained successful caption timestamp falls in the last ten minutes\"),\n    \"media_summaries_rows\":
    (\"gauge\", \"summary rows by enricher and status (ok/error)\"),\n    \"media_summaries_queue\": (\"gauge\", \"media files
    still to summarize per enricher\"),\n    \"ollama_up\": (\"gauge\", \"1 if the Ollama API answered\"),\n    \"ollama_models_pulled\":
    (\"gauge\", \"models stored in Ollama (/api/tags)\"),\n    \"ollama_model_loaded\": (\"gauge\", \"1 for each model currently
    loaded (/api/ps)\"),\n    \"ollama_model_size_bytes\": (\"gauge\", \"memory a loaded model uses in total\"),\n    \"ollama_model_vram_bytes\":
    (\"gauge\", \"part of a loaded model that sits in GPU memory\"),\n    \"ollama_model_gpu_fraction\": (\"gauge\", \"share
    of a loaded model in GPU memory (1 = fully on GPU; low = slow, runs on CPU)\"),\n    \"ollama_model_expires_timestamp_seconds\":
    (\"gauge\", \"unix time Ollama will unload the model\"),\n    \"knowledge_index_query_seconds\": (\"gauge\", \"seconds
    a representative question took against the index (quota = the Google-quota selection)\"),\n    \"media_summaries_ok_items\":
    (\"gauge\", \"successfully summarized items by enricher and kind (photo/video)\"),\n    \"media_summaries_video_seconds\":
    (\"gauge\", \"total duration of summarized videos by enricher\"),\n    \"media_summaries_last_batch_timestamp_seconds\":
    (\"gauge\", \"unix time of the newest summary batch per enricher\"),\n    \"smart_pending_sectors\": (\"gauge\", \"SMART
    Current_Pending_Sector per disk\"),\n    \"smart_offline_uncorrectable\": (\"gauge\", \"SMART Offline_Uncorrectable per
    disk\"),\n    \"smart_reallocated_sectors\": (\"gauge\", \"SMART Reallocated_Sector_Ct per disk\"),\n    \"smart_power_cycles\":
    (\"gauge\", \"SMART Power_Cycle_Count per disk\"),\n    \"smart_passed\": (\"gauge\", \"1 if the SMART overall health
    assessment passed\"),\n}\n\nHELP.update({k: v for k, v in BACKFILL_HELP.items() if k.startswith(\"knowledge_index_backfill_process_\")})\nPROGRESS_HELP
    = BACKFILL_HELP   # written live by adapters/gphotos.py --prom (progress.py); listed here so --list-metrics covers them\n\n\nclass
    Out:\n    def __init__(self):\n        self.rows = {}\n\n    def add(self, name, value, **labels):\n        self.rows.setdefault(name,
    []).append((labels, value))\n\n    def render(self):\n        lines = []\n        for name in sorted(self.rows):\n            typ,
    hlp = HELP[name]\n            lines += [\"# HELP %s %s\" % (name, hlp), \"# TYPE %s %s\" % (name, typ)]\n            for
    labels, v in self.rows[name]:\n                lab = \",\".join(''%s=\"%s\"'' % (k, str(x).replace(\"\\\\\", \"\\\\\\\\\").replace(''\"'',
    ''\\\\\"'')) for k, x in sorted(labels.items()))\n                lines.append(\"%s%s %s\" % (name, \"{%s}\" % lab if
    lab else \"\", repr(float(v)) if isinstance(v, float) else int(v)))\n        return \"\\n\".join(lines) + \"\\n\"\n\n\ndef
    run(cmd, timeout=30):\n    try:\n        return subprocess.run(cmd, capture_output=True, text=True, timeout=timeout).stdout\n    except
    (OSError, subprocess.SubprocessError):\n        return \"\"\n\n\ndef mountpoint(dataset):\n    out = run([\"zfs\", \"get\",
    \"-H\", \"-o\", \"value\", \"mountpoint\", dataset]).strip()\n    return out if out.startswith(\"/\") else None\n\n\ndef
    dir_bytes(path):\n    return sum(os.path.getsize(os.path.join(d, f)) for d, _, fs in os.walk(path) for f in fs if os.path.isfile(os.path.join(d,
    f)))\n\n\ndef collect_coverage(o, con, index, luna_dir):\n    \"\"\"Use published datasets only. A path and current byte
    size identify a library item.\"\"\"\n    local_files = os.path.join(index, \"summaries\", \"*\", \"*.parquet\")\n    luna_files
    = os.path.join(luna_dir, \"*.parquet\")\n    if not glob.glob(luna_files):\n        return\n    rows = con.execute(\"\"\"\n        WITH
    catalog AS (SELECT DISTINCT path, size_bytes FROM gphotos_files WHERE kind=''media''),\n        local_results AS (\n            SELECT
    path, size_bytes, min(created_at) AS first_local\n            FROM read_parquet(?, union_by_name=true)\n            WHERE
    source=''gphotos'' AND status=''ok'' GROUP BY path, size_bytes\n        ), cloud_results AS (\n            SELECT source_path
    AS path, size_bytes, min(finished_at) AS first_cloud\n            FROM read_parquet(?, union_by_name=true)\n            WHERE
    state=''ok'' GROUP BY source_path, size_bytes\n        ), assets AS (\n            SELECT CASE WHEN l.path IS NOT NULL
    AND c.path IS NOT NULL THEN ''both''\n                        WHEN l.path IS NOT NULL THEN ''local_only''\n                        WHEN
    c.path IS NOT NULL THEN ''luna_only'' ELSE ''neither'' END AS coverage,\n                   least(first_local, first_cloud)
    AS first_caption\n            FROM catalog LEFT JOIN local_results l USING(path, size_bytes)\n            LEFT JOIN cloud_results
    c USING(path, size_bytes)\n        ) SELECT coverage, count(*), count(*) FILTER (WHERE\n                 first_caption
    BETWEEN timezone(''UTC'', current_timestamp) - INTERVAL ''10 minutes''\n                                   AND timezone(''UTC'',
    current_timestamp))\n          FROM assets GROUP BY coverage\n    \"\"\", [local_files, luna_files]).fetchall()\n    counts
    = {coverage: count for coverage, count, _ in rows}\n    for coverage in (\"local_only\", \"luna_only\", \"both\", \"neither\"):\n        o.add(\"knowledge_index_caption_coverage\",
    counts.get(coverage, 0), coverage=coverage)\n    o.add(\"knowledge_index_caption_first_saved_last_ten_minutes\", sum(n
    for _, _, n in rows))\n\n\ndef collect_index(o, index, enrichers):\n    db = os.path.join(index, \"knowledge.duckdb\")\n    con
    = duckdb.connect(db, read_only=True)\n    q = lambda sql, *p: con.execute(sql, list(p)).fetchall()\n    for kind, n, b
    in q(\"SELECT kind, count(*), coalesce(sum(size_bytes),0) FROM gphotos_files GROUP BY 1\"):\n        o.add(\"knowledge_index_files\",
    n, source=\"gphotos\", kind=kind)\n        o.add(\"knowledge_index_bytes\", b, source=\"gphotos\", kind=kind)\n    n,
    b = q(\"SELECT count(*), coalesce(sum(size_bytes),0) FROM gphotos_versions\")[0]\n    o.add(\"knowledge_index_versions_files\",
    n); o.add(\"knowledge_index_versions_bytes\", b)\n    n, e = q(\"SELECT count(*), coalesce(sum(CASE WHEN parse_error IS
