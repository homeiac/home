apiVersion: batch/v1
kind: Job
metadata:
  name: caption-worker-a6ba0c720248
  namespace: monitoring
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: caption-worker-installer
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: install
        image: alpine/git:v2.49.1@sha256:53a6239398162098fed2f49a46512f9cbba9e3f31b9f2cea4fa90129ee069a99
        command:
        - /bin/sh
        - -ec
        - cp /credentials/id_ed25519 /work/deploy.key; chmod 600 /work/deploy.key; exec ssh -T -o BatchMode=yes -o ConnectTimeout=10
          -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/credentials/known_hosts
          -i /work/deploy.key root@pumped-piglet.maas caption-reconcile < /bundle/bundle.json
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: bundle
          mountPath: /bundle
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: work
          mountPath: /work
      volumes:
      - name: bundle
        configMap:
          name: caption-worker-a6ba0c720248
      - name: credentials
        secret:
          secretName: caption-worker-deploy
          defaultMode: 288
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
