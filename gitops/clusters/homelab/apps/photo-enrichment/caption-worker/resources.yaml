    self.lock:\n            rows = defaultdict(list)\n\n            def add(name, value, **labels):\n                labels[\"enricher\"]
    = self.enricher\n                lab = \",\".join(f\"{k}={json.dumps(str(v), ensure_ascii=False)}\" for k, v in sorted(labels.items()))\n                rows[name].append(f\"{name}{{{lab}}}
