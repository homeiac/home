    and the host-local Ollama endpoint.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport sys\n\n\ndef main()
    -> None:\n    \"\"\"Keep model identity stable; endpoint and Mac authentication remain host-local.\"\"\"\n    root = Path(''/opt/knowledge-index'')\n    config
    = json.loads((root / ''caption-gitops/config.json'').read_text())\n    endpoint = os.environ[''KI_OLLAMA_URL'']\n    if
    config.get(''priority_manifest''):\n        os.environ[''KI_SUMMARY_PRIORITY_MANIFEST''] = config[''priority_manifest'']\n    args
    = [str(root / ''venv/bin/python''), str(root / ''enrichers/media_summary.py''), ''run'']\n    for name in (''index'',
    ''library'', ''model'', ''enricher'', ''api'', ''parallel'', ''batch_size'', ''min_free_mib''):\n        args.extend([''--''
    + name.replace(''_'', ''-''), str(config[name])])\n    args.extend([''--endpoint'', endpoint, ''--extra-json'', json.dumps(config[''extra''])])\n    if
    config[''mac_assist'']:\n        args.append(''--mac-assist'')\n    os.execv(args[0], args)\n\n\nif __name__ == ''__main__'':\n    main()\n",
    "summary_cache.py": "\"\"\"Persistent reuse of successful captions for identical model inputs.\n\nPaths are deliberately
    excluded, but prompt context, image bytes, model and\ninference settings must match. No filename/size heuristic can cause
    a hit.\n\"\"\"\nimport hashlib\nimport json\nimport sqlite3\nfrom pathlib import Path\nfrom threading import Lock\n\n\nclass
    SummaryCache:\n    \"\"\"Store only parsed successful answers; survive batch retries and restarts.\"\"\"\n\n    def __init__(self,
    path: str):\n        Path(path).parent.mkdir(parents=True, exist_ok=True)\n        self.connection = sqlite3.connect(path,
    check_same_thread=False)\n        self.lock = Lock()\n        self.connection.execute(\"CREATE TABLE IF NOT EXISTS answers
    (key TEXT PRIMARY KEY, answer TEXT NOT NULL)\")\n\n    @staticmethod\n    def key(prompt: str, images: list[bytes], settings:
    dict) -> str:\n        \"\"\"Fingerprint exact inputs with unambiguous boundaries and a cache version.\"\"\"\n        digest
    = hashlib.sha256()\n        for part in [b\"summary-cache-v1\", json.dumps(settings, sort_keys=True, separators=(\",\",
    \":\")).encode(),\n                     prompt.encode(), *images]:\n            digest.update(len(part).to_bytes(8, \"big\"))\n            digest.update(part)\n        return
    digest.hexdigest()\n\n    def get(self, key: str) -> tuple[str, list[str]] | None:\n        \"\"\"Return a previously
    validated answer, if present.\"\"\"\n        with self.lock:\n            row = self.connection.execute(\"SELECT answer
    FROM answers WHERE key=?\", (key,)).fetchone()\n        if row is None:\n            return None\n        summary, tags
    = json.loads(row[0])\n        return summary, tags\n\n    def put(self, key: str, summary: str, tags: list[str]) -> None:\n        \"\"\"Atomically
    save a successful parsed answer, independently of Parquet batches.\"\"\"\n        with self.lock, self.connection:\n            self.connection.execute(\"INSERT
    OR IGNORE INTO answers VALUES (?, ?)\",\n                                    (key, json.dumps([summary, tags])))\n\n    def
    close(self) -> None:\n        \"\"\"Release the connection.\"\"\"\n        self.connection.close()\n\n    def __enter__(self):\n        return
    self\n\n    def __exit__(self, *exc):\n        self.close()\n"}'
