apiVersion: v1
kind: ConfigMap
metadata:
  name: caption-worker-2244713d49e0
  namespace: monitoring
data:
  bundle.json: '{"config.json": "{\n  \"enabled\": true,\n  \"index\": \"/local-3TB-backup/knowledge-index\",\n  \"library\":
    \"/local-3TB-backup/gphotos/library\",\n  \"model\": \"bonsai-27b\",\n  \"enricher\": \"gemma4-e2b-p1\",\n  \"api\": \"ollama\",\n  \"parallel\":
    2,\n  \"batch_size\": 16,\n  \"mac_assist\": true,\n  \"min_free_mib\": 3000,\n  \"extra\": {\"think\": false, \"options\":
    {\"num_ctx\": 8192, \"num_predict\": 384, \"temperature\": 0.2}}\n}\n", "dispatch-policy.json": "{\n  \"mode\": \"continuous\",\n  \"page_size\":
    48,\n  \"mac_routing\": \"photo-first\",\n  \"queue_order\": \"photos-first\"\n}\n", "knowledge-index-enrich.service":
    "[Unit]\nDescription=GitOps photo and video caption worker\nWants=network-online.target\nAfter=network-online.target zfs-mount.service\nRequiresMountsFor=/local-3TB-backup/knowledge-index
    /local-3TB-backup/gphotos\nStartLimitIntervalSec=0\n\n[Service]\nType=simple\nEnvironmentFile=/etc/default/knowledge-index\nEnvironment=PYTHONUNBUFFERED=1\nEnvironment=KI_PIPELINE_PROM=/var/lib/prometheus/node-exporter/knowledge_index_pipeline.prom\nEnvironment=KI_GPU_DISPATCH_POLICY_FILE=/opt/knowledge-index/caption-gitops/dispatch-policy.json\nExecStart=/opt/knowledge-index/venv/bin/python
    /opt/knowledge-index/caption-gitops/run.py\nRestart=always\nRestartSec=60\nRestartPreventExitStatus=75\nTimeoutStopSec=45\nKillMode=control-group\nNice=10\nIOSchedulingClass=idle\n\n[Install]\nWantedBy=multi-user.target\n",
    "media_summary.py": "#!/usr/bin/env python3\n\"\"\"Photo/video summary enricher for the knowledge index (issue #212, OpenSpec
    change add-media-summaries-enricher).\n\nUsage:\n  media_summary.py run --index DIR --library DIR --endpoint URL --model
    NAME --enricher ID\n                       [--limit N] [--batch-size 50] [--parallel 1] [--frames 8] [--min-free-mib 3000]
    [--dry-run]\n\n  --index      knowledge-index dataset mount (reads knowledge.duckdb, writes summaries/<enricher>/<batch>.parquet)\n  --library    photos
    library root, read-only: the folder that holds \"Google Photos/\" (<dataset>/library)\n  --endpoint   OpenAI-compatible
    server on the home network, e.g. http://<gpu-vm>:11434 (Ollama) or a llama.cpp server\n  --enricher   id of this model+prompt
    combination, e.g. qwen25vl-3b-p1 (bump it to re-summarize with a new model/prompt)\n  --api ollama       use Ollama native
    /api/chat (recommended with Ollama: honors think:false; --num-ctx sets the context)\n  --extra-json JSON  extra chat-request
    fields, e.g. ''{\"think\": false}'' (thinking models: 10x slower and wasteful otherwise)\n  --dry-run    summarize --limit
    files, print them, write nothing (the \"sample\" mode)\n  --prom FILE  publish live stage / Ollama timings for node-exporter
    (ignored in sample mode)\n  --min-free-mib  refuse to start when the GPU has less free memory (nvidia-smi); 0 disables;
    --smi-cmd overrides the binary\n\nQueue: SELECT ... FROM gphotos_to_summarize(<enricher>): media with no `ok` row for
    their current bytes (errors are retried).\nPhoto: one image (long edge 1024). Video: --frames frames across the clip +
    audio transcript (faster-whisper, if installed).\nReads media read-only, writes summaries below <index>/summaries and
    optional telemetry to --prom,\nsends nothing outside the given endpoint. Telemetry never contains media paths or contents.\n\"\"\"\nimport
    argparse\nimport base64\nimport datetime\nimport fcntl\nimport json\nimport os\nimport re\nimport subprocess\nimport sys\nimport
    time\nimport urllib.request\nfrom collections import deque\nfrom concurrent.futures import FIRST_COMPLETED, ThreadPoolExecutor,
    wait\nfrom copy import copy\nfrom contextlib import nullcontext\nfrom functools import partial\n\nimport duckdb\nfrom
    pipeline_metrics import PipelineMetrics\nfrom summary_cache import SummaryCache\n\nVIDEO_EXTS = {\"mp4\", \"mov\", \"3gp\",
    \"avi\", \"mpg\", \"m4v\"}\nSCHEMA = (\"source VARCHAR, path VARCHAR, size_bytes BIGINT, enricher VARCHAR, model VARCHAR,
    prompt_version VARCHAR, \"\n          \"summary VARCHAR, tags VARCHAR[], frames_sampled INTEGER, duration_s DOUBLE, status
    VARCHAR, error VARCHAR, \"\n          \"created_at TIMESTAMP\")\nPROMPT_VERSION = \"p1\"\n\n\ndef free_gpu_mib(smi_cmd):\n    \"\"\"Free
    GPU memory in MiB (minimum over GPUs), or None when nvidia-smi is unavailable.\"\"\"\n    try:\n        out = subprocess.run([smi_cmd,
    \"--query-gpu=memory.free\", \"--format=csv,noheader,nounits\"],\n                             capture_output=True, text=True,
    timeout=20, check=True).stdout\n        return min(int(x) for x in out.split())\n    except (OSError, subprocess.SubprocessError,
    ValueError):\n        return None\n\n\ndef _ffmpeg(args, timeout=120):\n    return subprocess.run([\"ffmpeg\", \"-v\",
    \"error\", \"-nostdin\"] + args, capture_output=True, timeout=timeout)\n\n\ndef jpeg_frame(path, t=None):\n    \"\"\"One
    JPEG (long edge <= 1024) from an image or from second `t` of a video; raises RuntimeError when undecodable.\"\"\"\n    if
    t is None and os.path.splitext(path)[1].lower() in {''.heic'', ''.heif'', ''.hif''}:\n        import io\n        from
    PIL import Image, ImageOps\n        from pillow_heif import register_heif_opener\n\n        register_heif_opener()\n        with
    Image.open(path) as source:\n            image = ImageOps.exif_transpose(source)\n            image.thumbnail((1024, 1024),
    Image.Resampling.LANCZOS)\n            result = io.BytesIO()\n            image.convert(''RGB'').save(result, ''JPEG'',
    quality=88)\n            return result.getvalue()\n    scale = \"scale=''if(gt(iw,ih),min(1024,iw),-2)'':''if(gt(iw,ih),-2,min(1024,ih))''\"\n    pre
    = [\"-ss\", \"%.2f\" % t] if t is not None else []\n    r = _ffmpeg(pre + [\"-i\", path, \"-vf\", scale, \"-frames:v\",
    \"1\", \"-f\", \"image2pipe\", \"-vcodec\", \"mjpeg\", \"-\"])\n    if r.returncode != 0 or not r.stdout:\n        raise
    RuntimeError(\"cannot decode %s: %s\" % (os.path.basename(path), \" \".join(r.stderr.decode(errors=\"replace\").split())[:200]))\n    return
    r.stdout\n\n\ndef video_duration(path):\n    r = subprocess.run([\"ffprobe\", \"-v\", \"error\", \"-show_entries\", \"format=duration\",
    \"-of\", \"default=nw=1:nk=1\", path],\n                       capture_output=True, text=True, timeout=60)\n    try:\n        return
    float(r.stdout.strip())\n    except ValueError:\n        raise RuntimeError(\"cannot read duration of %s\" % os.path.basename(path))\n\n\ndef
    transcript(path):\n    \"\"\"Speech transcript via faster-whisper when installed and the video has audio; '''' otherwise.\"\"\"\n    try:\n        from
    faster_whisper import WhisperModel\n    except ImportError:\n        return \"\"\n    r = subprocess.run([\"ffprobe\",
    \"-v\", \"error\", \"-select_streams\", \"a\", \"-show_entries\", \"stream=index\", \"-of\", \"csv=p=0\", path],\n                       capture_output=True,
    text=True, timeout=60)\n    if not r.stdout.strip():\n        return \"\"\n    model = WhisperModel(os.environ.get(\"KI_WHISPER_MODEL\",
    \"small\"), compute_type=\"int8\")\n    segs, _ = model.transcribe(path)\n    return \" \".join(s.text.strip() for s in
    segs)[:4000]\n\n\ndef build_prompt(row, is_video, nframes, speech):\n    ctx = []\n    if row[\"taken_ts\"]:\n        ctx.append(\"taken
    \" + datetime.datetime.fromtimestamp(row[\"taken_ts\"], datetime.timezone.utc).strftime(\"%Y-%m-%d\"))\n    if row[\"album\"]:\n        ctx.append(\"album
    ''%s''\" % row[\"album\"])\n    if row[\"has_geo\"]:\n        ctx.append(\"it has GPS location\")\n    if row[\"people\"]:\n        ctx.append(\"people
    tagged: \" + \", \".join(row[\"people\"]))\n    what = (\"%d frames sampled evenly across a video clip\" % nframes) if
    is_video else \"a photo\"\n    p = [\"You are given %s. Context: %s.\" % (what, \"; \".join(ctx) or \"none\"),\n         \"Describe
    what is happening: who or what is shown, the setting, the activity\" + (\", and how it changes over the clip\" if is_video
    else \"\") + \".\",\n         \"Be factual; say ''unclear'' instead of guessing.\"]\n    if speech:\n        p.append(\"Audio
    transcript: \" + speech)\n    p.append(''Answer ONLY with JSON: {\"summary\": \"<2-3 sentences>\", \"tags\": [\"<up to
    8 short keywords>\"]}'')\n    return \"\\n\".join(p)\n\n\ndef parse_answer(text):\n    \"\"\"Extract {\"summary\",\"tags\"}
    from a model reply (tolerates code fences / chatter around the JSON).\"\"\"\n    m = re.search(r\"\\{.*\\}\", text, re.S)\n    if
    not m:\n        raise ValueError(\"no JSON in model reply\")\n    d = json.loads(m.group(0))\n    summary = str(d.get(\"summary\",
    \"\")).strip()\n    if not summary:\n        raise ValueError(\"empty summary\")\n    tags = [str(t).strip() for t in
    (d.get(\"tags\") or []) if str(t).strip()][:8]\n    return summary, tags\n\n\ndef ask_model(endpoint, model, prompt, jpegs,
    timeout=600, extra=None, api=\"openai\", num_ctx=8192, keep_alive=\"30m\", metrics=None, kind=\"photo\", headers=None):\n    \"\"\"One
    chat request with all images. api=\"ollama\" uses Ollama''s native /api/chat: it honors `think: false`\n    (the OpenAI-compatible
    /v1 endpoint did not on 2026-11-16: reasoning models then spent ~500 hidden tokens, 18-45 s/item instead of ~2-5 s).\"\"\"\n    b64
    = [base64.b64encode(j).decode() for j in jpegs]\n    if api == \"ollama\":\n        body = {\"model\": model, \"stream\":
    False, \"keep_alive\": keep_alive, \"options\": {\"num_ctx\": num_ctx, \"temperature\": 0.2},\n                \"messages\":
    [{\"role\": \"user\", \"content\": prompt, \"images\": b64}]}\n        body.update(extra or {})\n        url = endpoint.rstrip(\"/\")
    + \"/api/chat\"\n    else:\n        content = [{\"type\": \"text\", \"text\": prompt}] + [{\"type\": \"image_url\", \"image_url\":
    {\"url\": \"data:image/jpeg;base64,\" + x}} for x in b64]\n        body = {\"model\": model, \"messages\": [{\"role\":
    \"user\", \"content\": content}], \"temperature\": 0.2, **(extra or {})}\n        url = endpoint.rstrip(\"/\") + \"/v1/chat/completions\"\n    req
    = urllib.request.Request(url, json.dumps(body).encode(), {\"Content-Type\": \"application/json\", **(headers or {})})\n    mac_frames
    = metrics.mac_request(jpegs) if endpoint == MAC_ENDPOINT and metrics is not None else None\n    started = time.monotonic()\n    backend
    = \"metal\" if endpoint == MAC_ENDPOINT else \"primary\"\n    tracking = metrics.backend_request(backend) if metrics is
    not None else nullcontext()\n    with tracking, urllib.request.urlopen(req, timeout=timeout) as resp:\n        out = json.load(resp)\n    if
    mac_frames is not None:\n        metrics.mac_response(mac_frames, kind, time.monotonic() - started, out)\n    if api ==
    \"ollama\" and metrics is not None:\n        metrics.ollama(out, kind)\n    return out[\"message\"][\"content\"] if api
    == \"ollama\" else out[\"choices\"][0][\"message\"][\"content\"]\n\n\ndef summarize(row, library, a, metrics=None, cache=None):\n    \"\"\"->
    dict of result columns for one queue row; never raises (errors become status=''error'' rows).\"\"\"\n    base = {\"source\":
    \"gphotos\", \"path\": row[\"path\"], \"size_bytes\": row[\"size_bytes\"], \"enricher\": a.enricher, \"model\": a.model,\n            \"prompt_version\":
    PROMPT_VERSION, \"summary\": None, \"tags\": None, \"frames_sampled\": None, \"duration_s\": None,\n            \"status\":
    \"error\", \"error\": None, \"inference_backend\": getattr(a, \"backend\", \"primary\")}\n    ap = os.path.join(library,
    row[\"path\"])\n    metrics = metrics or PipelineMetrics(None, a.enricher)\n    kind = \"video\" if row[\"ext\"] in VIDEO_EXTS
    else \"photo\"\n    try:\n        with metrics.measure(\"decode\", kind):\n            if kind == \"video\":\n                dur
    = video_duration(ap)\n                n = max(1, min(a.frames, int(dur) or 1))\n                jpegs = [jpeg_frame(ap,
    dur * (i + 0.5) / n) for i in range(n)]\n            else:\n                jpegs = [jpeg_frame(ap)]\n        speech =
    \"\"\n        if kind == \"video\":\n            with metrics.measure(\"transcribe\", kind):\n                speech =
    transcript(ap)\n            base.update(frames_sampled=n, duration_s=dur)\n        with metrics.measure(\"prompt\", kind):\n            prompt
    = build_prompt(row, kind == \"video\", len(jpegs), speech)\n        cache_key = SummaryCache.key(prompt, jpegs, {\n            \"endpoint\":
    a.endpoint, \"enricher\": a.enricher, \"model\": a.model,\n            \"prompt_version\": PROMPT_VERSION, \"api\": a.api,
    \"num_ctx\": a.num_ctx, \"extra\": a.extra,\n        }) if cache is not None else None\n        cached = cache.get(cache_key)
    if cache is not None else None\n        if cached is None:\n            base[\"_model_failure\"] = True\n            with
    metrics.measure(\"inference\", kind):\n                answer = ask_model(a.endpoint, a.model, prompt, jpegs, extra=a.extra,
    api=a.api,\n                                   num_ctx=a.num_ctx, metrics=metrics, kind=kind, timeout=getattr(a, \"request_timeout\",
    600),\n                                   headers=getattr(a, \"model_headers\", None))\n            with metrics.measure(\"parse\",
    kind):\n                summary, tags = parse_answer(answer)\n            base.pop(\"_model_failure\", None)\n            if
    cache is not None:\n                cache.put(cache_key, summary, tags)\n        else:\n            summary, tags = cached\n            metrics.cache_hit(kind)\n            base[\"inference_backend\"]
    = \"cache\"\n        base.update(summary=summary, tags=tags, status=\"ok\")\n    except Exception as exc:  # one bad file
    must not stop the run\n        base[\"error\"] = (\"%s: %s\" % (type(exc).__name__, exc))[:500]\n    metrics.item(kind,
    base[\"status\"])\n    return base\n\n\ndef write_batch(rows, out_dir, enricher):\n    d = os.path.join(out_dir, \"summaries\",
    enricher)\n    os.makedirs(d, exist_ok=True)\n    target = os.path.join(d, \"b%s-%04d.parquet\" % (datetime.datetime.now(datetime.timezone.utc).strftime(\"%Y%m%dT%H%M%S%f\"),
    len(os.listdir(d))))\n    tmp = target + \".tmp\"\n    now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)\n    con
    = duckdb.connect()\n    con.execute(\"CREATE TABLE t (%s)\" % SCHEMA)\n    cols = [\"source\", \"path\", \"size_bytes\",
    \"enricher\", \"model\", \"prompt_version\", \"summary\", \"tags\", \"frames_sampled\",\n            \"duration_s\", \"status\",
    \"error\"]\n    con.executemany(\"INSERT INTO t VALUES (%s)\" % \",\".join(\"?\" * 13), [tuple(r[c] for c in cols) + (now,)
    for r in rows])\n    con.execute(\"COPY t TO ''%s'' (FORMAT parquet, COMPRESSION zstd)\" % tmp.replace(\"''\", \"''''\"))\n    os.replace(tmp,
    target)\n    return target\n\n\ndef queue(index, enricher, limit, seen=(), metrics=None, *, photos_first=False):\n    \"\"\"Select
    pending work while skipping paths already attempted in this run.\"\"\"\n    priority = \"coalesce(list_contains(?, lower(ext)),
    false), \" if photos_first else \"\"\n    params = [enricher, sorted(VIDEO_EXTS), limit + len(seen)] if photos_first else
    [enricher, limit + len(seen)]\n    with duckdb.connect(os.path.join(index, \"knowledge.duckdb\"), read_only=True) as con:\n        cur
    = con.execute(\"SELECT *, count(*) OVER () AS pending_count FROM gphotos_to_summarize(?) \"\n                          f\"ORDER
    BY {priority}taken_ts DESC NULLS LAST, path LIMIT ?\", params)\n        names = [column[0] for column in cur.description[:-1]]\n        rows
    = cur.fetchall()\n    if metrics is not None:\n        metrics.queue_size(rows[0][-1] if rows else 0)\n    return [r for
    r in (dict(zip(names, row[:-1])) for row in rows) if r[\"path\"] not in seen][:limit]\n\n\nMAC_ENDPOINT = \"http://127.0.0.1:19476\"\n\n\ndef
    mac_headers():\n    with open(\"/opt/knowledge-index/mac-bonsai.key\", encoding=\"ascii\") as file:\n        return {\"Authorization\":
    \"Bearer \" + file.read().strip()}\n\n\ndef mac_route(args):\n    \"\"\"Discover the authenticated Mac server''s Git-configured
    request limit.\"\"\"\n    if not getattr(args, \"mac_assist\", False) or args.model != \"bonsai-27b\" or args.dry_run:\n        return
    0, None\n    try:\n        headers = mac_headers()\n        probe = urllib.request.Request(MAC_ENDPOINT + \"/v1/models\",
    headers=headers)\n        with urllib.request.urlopen(probe, timeout=1) as response:\n            models = json.load(response)[\"data\"]\n        for
    model in models:\n            if model[\"id\"] == \"bonsai-27b-metal\":\n                for tag in model[\"tags\"]:\n                    match
    = re.fullmatch(r\"backfill-parallel=([1-9]|1[0-9]|20)\", tag)\n                    if match:\n                        return
    int(match[1]), headers\n    except (OSError, ValueError, KeyError, TypeError):\n        pass\n    return 0, None\n\n\ndef
    split_batch(rows, primary_slots, mac_slots, primary, metal, *, refill=None, prefer_photos=False):\n    \"\"\"Keep slots
    fed across queue reads. Retry interrupted Mac work on the RTX.\"\"\"\n    pending = deque(rows)\n    retry = deque()\n    disabled
    = False\n    with ThreadPoolExecutor(max_workers=primary_slots + mac_slots) as pool:\n        active = {}\n\n        def
    submit(backend):\n            nonlocal refill\n            if backend == \"metal\" and disabled:\n                return\n            if
    not pending and not retry and refill is not None and not disabled:\n                pending.extend(refill())\n                if
    not pending:\n                    refill = None\n            candidates = retry if backend == \"primary\" and retry else
    pending\n            if candidates:\n                if backend == \"metal\" and prefer_photos:\n                    #
    Long visual prompts take substantially longer on the Mac.\n                    photo = next((i for i, row in enumerate(candidates)
    if row[\"ext\"] not in VIDEO_EXTS), 0)\n                    row = candidates[photo]\n                    del candidates[photo]\n                else:\n                    row
    = candidates.popleft()\n                task = metal if backend == \"metal\" else primary\n                active[pool.submit(task,
    row)] = (backend, row)\n\n        for backend, count in ((\"primary\", primary_slots), (\"metal\", mac_slots)):\n            for
    _ in range(count):\n                submit(backend)\n        while active:\n            completed, _ = wait(active, return_when=FIRST_COMPLETED)\n            for
    future in completed:\n                backend, row = active.pop(future)\n                result = future.result()\n                if
    backend == \"metal\" and result[\"status\"] != \"ok\" and result.get(\"_model_failure\"):\n                    disabled
    = True\n                    retry.append(row)\n                    submit(backend)\n                else:\n                    submit(backend)\n                    yield
    row, result\n            # Primary slots may already have drained when a late Mac request fails.\n            primary_active
    = sum(backend == \"primary\" for backend, _ in active.values())\n            for _ in range(min(len(retry), primary_slots
    - primary_active)):\n                submit(\"primary\")\n\n\ndef persist(batch, args, metrics, seen):\n    \"\"\"Only
    the host writes Parquet and advances durable counters.\"\"\"\n    with metrics.measure(\"write\"):\n        write_batch([result
    for _, result in batch], args.index, args.enricher)\n    for row, result in batch:\n        kind = \"video\" if row[\"ext\"]
    in VIDEO_EXTS else \"photo\"\n        metrics.item(kind, result[\"status\"], persisted=True, backend=result.get(\"inference_backend\",
    \"primary\"))\n        if result[\"status\"] == \"ok\":\n            seen.discard(row[\"path\"])\n\n\nclass DispatchPolicy:\n    \"\"\"Poll
    the deployed Git policy and retain the last valid settings during outages.\"\"\"\n\n    def __init__(self, args):\n        self.current
    = (getattr(args, \"dispatch_mode\", \"continuous\"),\n                        getattr(args, \"dispatch_size\", 0),\n                        getattr(args,
    \"mac_routing\", \"photo-first\"))\n        self.url = os.environ.get(\"KI_GPU_DISPATCH_POLICY_URL\") if not args.dry_run
    else None\n        self.ref = os.environ.get(\"KI_GPU_DISPATCH_GIT_REF\")\n        self.local_policy = os.environ.get(\"KI_GPU_DISPATCH_POLICY_FILE\")
    if not args.dry_run else None\n        self.revision = None\n        self.queue_order = \"newest\"\n        self.next_poll
    = 0\n\n    def poll(self):\n        now = time.monotonic()\n        if self.local_policy and now >= self.next_poll:\n            self.next_poll
    = now + 30\n            try:\n                with open(self.local_policy, encoding=\"utf-8\") as stream:\n                    policy
    = json.load(stream)\n                mode, size, routing, order = (policy[k] for k in (\"mode\", \"page_size\", \"mac_routing\",
    \"queue_order\"))\n                if (mode not in (\"batch\", \"continuous\") or type(size) is not int or not 0 <= size
    <= 512\n                        or routing not in (\"fifo\", \"photo-first\") or order not in (\"newest\", \"photos-first\")):\n                    raise
    ValueError(\"Invalid applied dispatch policy\")\n                self.current, self.queue_order = (mode, size, routing),
    order\n            except (OSError, ValueError, KeyError, TypeError):\n                print(\"WARN: keeping the last
    valid applied dispatch policy\", file=sys.stderr)\n        if not self.local_policy and self.url and self.ref and now
    >= self.next_poll:\n            self.next_poll = now + 30\n            try:\n                result = subprocess.check_output(\n                    [\"git\",
    \"ls-remote\", \"--exit-code\", \"https://github.com/homeiac/home.git\", self.ref],\n                    timeout=3, stderr=subprocess.DEVNULL,
    text=True,\n                )\n                revision, _ = result.strip().split(\"\\t\")\n                if not re.fullmatch(r\"[0-9a-f]{40}\",
    revision):\n                    raise ValueError(\"Invalid Git dispatch revision\")\n                if revision == self.revision:\n                    return
    self.current\n                with urllib.request.urlopen(self.url.format(revision=revision), timeout=2) as response:\n                    policy
    = json.load(response)\n                mode, size, routing = policy[\"mode\"], policy[\"page_size\"], policy[\"mac_routing\"]\n                order
    = policy.get(\"queue_order\", \"newest\")\n                if (mode not in (\"batch\", \"continuous\") or type(size) is
    not int or not 0 <= size <= 512\n                        or routing not in (\"fifo\", \"photo-first\") or order not in
    (\"newest\", \"photos-first\")):\n                    raise ValueError(\"Invalid Git dispatch policy\")\n                self.current
    = mode, size, routing\n                self.queue_order = order\n                self.revision = revision\n            except
    (OSError, ValueError, KeyError, TypeError, subprocess.SubprocessError):\n                print(\"WARN: keeping the last
    valid Git dispatch policy\", file=sys.stderr)\n        return self.current\n\n\ndef run(a):\n    if a.min_free_mib > 0:\n        free
    = free_gpu_mib(a.smi_cmd)\n        if free is None:\n            print(\"WARN: cannot read GPU memory (%s unavailable);
    continuing\" % a.smi_cmd, file=sys.stderr)\n        elif free < a.min_free_mib:\n            print(\"not starting: free
    GPU memory %d MiB < %d MiB (Frigate needs it)\" % (free, a.min_free_mib), file=sys.stderr)\n            return 3\n    done
    = errors = 0\n    t0 = time.time()\n    remaining = a.limit\n    policy = DispatchPolicy(a)\n    seen = set()\n    cache_context
    = nullcontext(None) if a.dry_run else SummaryCache(os.path.join(a.index, \"summary-cache.sqlite3\"))\n    with cache_context
    as cache, PipelineMetrics(None if a.dry_run else getattr(a, \"prom\", None), a.enricher) as metrics:\n        primary
    = partial(summarize, library=a.library, a=a, metrics=metrics, cache=cache)\n        metal_args = copy(a)\n        metal_args.model
    = \"bonsai-27b-metal\"\n        metal_args.endpoint = MAC_ENDPOINT\n        metal_args.api = \"openai\"\n        metal_args.extra
    = {\"max_tokens\": 384, \"chat_template_kwargs\": {\"enable_thinking\": False}}\n        metal_args.backend = \"metal\"\n        metal_args.request_timeout
    = 180\n        metal = partial(summarize, library=a.library, a=metal_args, metrics=metrics, cache=cache)\n        while
    remaining > 0:\n            settings = policy.poll()\n            queue_order = policy.queue_order\n            dispatch_mode,
