    OSError:\n                    pass\n", "run.py": "#!/usr/bin/env python3\n\"\"\"Run the existing worker with GitOps settings
    and the host-local Ollama endpoint.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport sys\n\n\ndef main()
    -> None:\n    \"\"\"Keep model identity stable; endpoint and Mac authentication remain host-local.\"\"\"\n    root = Path(''/opt/knowledge-index'')\n    config
    = json.loads((root / ''caption-gitops/config.json'').read_text())\n    endpoint = os.environ[''KI_OLLAMA_URL'']\n    if
    config.get(''priority_manifest''):\n        os.environ[''KI_SUMMARY_PRIORITY_MANIFEST''] = config[''priority_manifest'']\n    args
    = [str(root / ''venv/bin/python''), str(root / ''enrichers/media_summary.py''), ''run'']\n    for name in (''index'',
    ''library'', ''model'', ''enricher'', ''api'', ''parallel'', ''batch_size'', ''min_free_mib''):\n        args.extend([''--''
    + name.replace(''_'', ''-''), str(config[name])])\n    args.extend([''--endpoint'', endpoint, ''--extra-json'', json.dumps(config[''extra''])])\n    for
    name in (''frames'', ''video_edge'', ''video_prompt'', ''video_tokens'', ''mac_video_parallel'', ''video_decode_threads''):\n        if
    name in config:\n            args.extend([''--'' + name.replace(''_'', ''-''), str(config[name])])\n    if config[''mac_assist'']:\n        args.append(''--mac-assist'')\n    os.execv(args[0],
    args)\n\n\nif __name__ == ''__main__'':\n    main()\n", "summary_cache.py": "\"\"\"Persistent reuse of successful captions
    for identical model inputs.\n\nPaths are deliberately excluded, but prompt context, image bytes, model and\ninference
    settings must match. No filename/size heuristic can cause a hit.\n\"\"\"\nimport hashlib\nimport json\nimport sqlite3\nfrom
    pathlib import Path\nfrom threading import Lock\n\n\nclass SummaryCache:\n    \"\"\"Store only parsed successful answers;
    survive batch retries and restarts.\"\"\"\n\n    def __init__(self, path: str):\n        Path(path).parent.mkdir(parents=True,
    exist_ok=True)\n        self.connection = sqlite3.connect(path, check_same_thread=False)\n        self.lock = Lock()\n        self.raw_locks
    = [Lock() for _ in range(64)]\n        self.connection.execute(\"\"\"CREATE TABLE IF NOT EXISTS raw_answers\n            (enricher
    TEXT, sha256 TEXT, answer TEXT NOT NULL, PRIMARY KEY(enricher,sha256))\"\"\")\n        self.connection.execute(\"CREATE
