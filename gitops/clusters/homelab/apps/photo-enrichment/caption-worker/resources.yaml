    INTO t VALUES (%s)\" % ph, rows)\n    con.execute(\"COPY t TO ''%s'' (FORMAT parquet, COMPRESSION zstd)\" % tmp.replace(\"''\",
    \"''''\"))\n    os.replace(tmp, target)\n\n\ndef emit(unit, root, out_dir, paths=None, versions=None, prom=None, expected=0):\n    \"\"\"Index
    `root` (or only `paths`, library-relative) as `unit`. Returns (rows, bytes).\"\"\"\n    t0 = time.time()\n    root = root.rstrip(\"/\")\n    now
    = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)\n    prog = Progress(unit, prom, expected)\n    try:\n        return
    _emit(unit, root, out_dir, paths, versions, prog, now, t0)\n    except BaseException:\n        prog.finish(ok=False)\n        raise\n\n\ndef
    _emit(unit, root, out_dir, paths, versions, prog, now, t0):\n    import duckdb\n    rels = sorted(set(paths)) if paths
    is not None else sorted(_walk(root, lambda n: prog.update(listed=n)))\n    prog.update(force=True, phase=\"reading\",
    listed=len(rels), total=len(rels))\n    files, sidecars, nbytes_seen, nerr = [], [], 0, 0\n    for i, rel in enumerate(rels,
    1):\n        ap = os.path.join(root, rel)\n        if not os.path.isfile(ap):\n            continue  # listed but gone
    (replaced later): skip, never fail the unit\n        row = _file_row(\"gphotos\", unit, rel, ap, now)\n        files.append(row)\n        nbytes_seen
    += row[5]\n        if rel.endswith(\".json\"):\n            sc = parse_sidecar(ap, rel)\n            sidecars.append(sc)\n            nerr
    += 1 if sc[-1] else 0\n        if i % 200 == 0:\n            prog.update(done=i, sidecars=len(sidecars), bytes=nbytes_seen,
    errors=nerr)\n    prog.update(force=True, phase=\"writing\", done=len(rels), sidecars=len(sidecars), bytes=nbytes_seen,
    errors=nerr)\n    con = duckdb.connect()\n    _write_parquet(con, FILES_SCHEMA, files, os.path.join(out_dir, \"files\",
    \"gphotos\", unit + \".parquet\"))\n    _write_parquet(con, SIDECAR_SCHEMA, sidecars, os.path.join(out_dir, \"gphotos_sidecars\",
    unit + \".parquet\"))\n    nrows, nbytes = len(files), sum(r[5] for r in files)\n    if versions:\n        prog.update(force=True,
    phase=\"versions\")\n        vers = [_file_row(\"gphotos\", unit, \".versions/\" + rel, os.path.join(versions, rel), now)\n                for
    rel in sorted(_walk(versions.rstrip(\"/\")))]\n        _write_parquet(con, FILES_SCHEMA, vers, os.path.join(out_dir, \"files\",
    \"gphotos\", unit + \".versions.parquet\"))\n        nrows += len(vers)\n        nbytes += sum(r[5] for r in vers)\n    prog.finish(ok=True)\n    print(\"rows=%d
    bytes=%d seconds=%.1f\" % (nrows, nbytes, time.time() - t0))\n    return nrows, nbytes\n\n\ndef main(argv):\n    if len(argv)
    < 5 or argv[1] != \"emit\":\n        sys.exit(__doc__)\n    unit, root, out_dir = argv[2:5]\n    opts = argv[5:]\n    paths
    = versions = prom = None\n    expected = 0\n    if \"--prom\" in opts:\n        prom = opts[opts.index(\"--prom\") + 1]\n    if
    \"--expected\" in opts:\n        expected = int(opts[opts.index(\"--expected\") + 1])\n    if \"--paths-from\" in opts:\n        with
    open(opts[opts.index(\"--paths-from\") + 1], encoding=\"utf-8\") as fh:\n            paths = [ln.rstrip(\"\\n\") for ln
