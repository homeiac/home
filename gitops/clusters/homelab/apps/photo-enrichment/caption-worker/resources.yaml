    video_saved(self, duration: float, backend: str) -> None:\n        \"\"\"Publish useful work alongside clips/minute; count
    only durable output.\"\"\"\n        with self.lock:\n            self.video_seconds[backend] += max(0, duration)\n            self.video_counts[backend]
    += 1\n\n    def cache_hit(self, kind: str) -> None:\n        \"\"\"Count a caption reused from the local cache.\"\"\"\n        with
    self.lock:\n            self.cache_hits[kind] += 1\n\n    @contextmanager\n    def backend_request(self, backend):\n        with
    self.lock:\n            self.backend_active[backend] += 1\n        try:\n            yield\n        finally:\n            with
    self.lock:\n                self.backend_active[backend] -= 1\n\n    def mac_capacity(self, offered, video=None):\n        with
