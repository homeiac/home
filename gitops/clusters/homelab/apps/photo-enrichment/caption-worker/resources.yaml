    If there is no clear change, describe the scene. ''\n              ''Keep distinctive visible details useful for remembering
    this moment. Do not invent actions between ''\n              ''frames, dialogue, names, relationships, emotions or events.
    Metadata is a hint, not visual proof. ''\n              ''Omit uncertain incidental details. Context: '' + context + ''.
    '')\n    if speech:\n        prompt += ''Audio transcript (may contain errors): '' + speech[:2000] + ''. ''\n    return
