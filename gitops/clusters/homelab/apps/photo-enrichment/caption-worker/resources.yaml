    kind] += elapsed\n            self.mac_counts[\"round_trip\", kind] += 1\n            for phase, key in ((\"prompt\",
    \"prompt_ms\"), (\"generation\", \"predicted_ms\")):\n                value = timings.get(key)\n                if isinstance(value,
