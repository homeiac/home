    FROM gphotos_to_summarize(<enricher>): media with no `ok` row for their current bytes (errors are retried).\nPhoto: one
    image (long edge 1024). Video: --frames frames across the clip + audio transcript (faster-whisper, if installed).\nReads
    media read-only, writes summaries below <index>/summaries and optional telemetry to --prom,\nsends nothing outside the
    given endpoint. Telemetry never contains media paths or contents.\n\"\"\"\nimport argparse\nimport base64\nimport datetime\nimport
