    ''1''] if decode else []\n    r = _ffmpeg(decode + pre + [\"-i\", path, \"-vf\", scale, \"-frames:v\", \"1\"] + encode
    + [\"-f\", \"image2pipe\", \"-vcodec\", \"mjpeg\", \"-\"])\n    if r.returncode != 0 or not r.stdout:\n        raise RuntimeError(\"cannot
    decode %s: %s\" % (os.path.basename(path), \" \".join(r.stderr.decode(errors=\"replace\").split())[:200]))\n    return
