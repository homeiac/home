    % len(self.raw_locks)]\n\n    def raw_caption(self, enricher: str, fingerprint: str) -> tuple | None:\n        with self.lock:\n            row
    = self.connection.execute(\"SELECT answer FROM raw_answers WHERE enricher=? AND sha256=?\",\n                                          (enricher,
