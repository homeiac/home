    OR IGNORE INTO answers VALUES (?, ?)\",\n                                    (key, json.dumps([summary, tags])))\n\n    def
    close(self) -> None:\n        \"\"\"Release the connection.\"\"\"\n        self.connection.close()\n\n    def __enter__(self):\n        return
