    \ SET state='conflict',reason=excluded.reason,updated_at=now()`,[old.id,job.source_path,job.asset_id,version,reason]);continue;\n\
    \    }\n    const face=candidate.face;used.add(face.id);\n    if(face.person?.id!==personId){\n\
    \      await db.query(`INSERT INTO immich_sync.faces(source_face,source_path,asset_id,face_id,person_id,source_hash,state)\
    \ VALUES($1,$2,$3,$4,$5,$6,'pending')\n        ON CONFLICT(source_face) DO UPDATE\
    \ SET face_id=excluded.face_id,person_id=excluded.person_id,source_hash=excluded.source_hash,state='pending'`,[old.id,job.source_path,job.asset_id,face.id,personId,version]);\n\
    \      await api('/faces/'+personId,'PUT',{id:face.id});\n      const after=await\
    \ api('/faces?id='+job.asset_id);\n      if(after.find(f=>f.id===face.id)?.person?.id!==personId)throw\
    \ Error('Face readback mismatch');\n      current=after;\n    }\n    await db.query(`INSERT\
    \ INTO immich_sync.faces(source_face,source_path,asset_id,face_id,person_id,source_hash,state)\
    \ VALUES($1,$2,$3,$4,$5,$6,'applied')\n      ON CONFLICT(source_face) DO UPDATE\
    \ SET face_id=excluded.face_id,person_id=excluded.person_id,source_hash=excluded.source_hash,state='applied',reason=NULL,updated_at=now()`,[old.id,job.source_path,job.asset_id,face.id,personId,version]);\n\
    \  }\n}\nasync function apply(db,job) {\n  const identity=await state(db,'identity');\n\
    \  const current=await api('/assets/'+job.asset_id);\n  const mapped=mapAsset({path:job.source_path,size_bytes:job.payload.sizeBytes},[current],identity.ownerId,identity.libraryId);\n\
    \  if(!mapped.asset)throw Error('Target identity changed');\n  const file=await\
    \ verifyFile(job);\n  const desired={...job.payload,sourceRevision:job.source_hash,contentSha256:file.contentSha256};\n\
    \  const metadata=await api('/assets/'+job.asset_id+'/metadata');\n  const existing=metadata.find(x=>x.key===META_KEY)?.value??null;\n\
    \  const decision=metadataDecision(existing,desired,job.applied,job.intent);\n\
    \  if(decision==='conflict'){\n    await db.query(\"UPDATE immich_sync.jobs SET\
    \ state='conflict',reason='machine_metadata_edited',updated_at=now() WHERE source_path=$1\"\
    ,[job.source_path]);return;\n  }\n  await db.query('UPDATE immich_sync.jobs SET\
    \ intent=$2,content_sha256=$3,file_mtime_ms=$4 WHERE source_path=$1',[job.source_path,desired,file.contentSha256,file.mtimeMs]);\n\
    \  if(decision!=='unchanged')await api('/assets/'+job.asset_id+'/metadata','PUT',{items:[{key:META_KEY,value:desired}]});\n\
    \  const after=await api('/assets/'+job.asset_id+'/metadata');\n  if(stable(after.find(x=>x.key===META_KEY)?.value)!==stable(desired))throw\
    \ Error('Metadata readback mismatch');\n  // Human-visible description/GPS/date\
    \ writes deliberately gated for RO libraries.\n  // Source groups, tags and every\
    \ old label are preserved in the owned metadata record.\n  if(process.env.ENABLE_FACE_TRANSFER==='true')await\
    \ syncFaces(db,job);\n  await db.query(\"UPDATE immich_sync.jobs SET applied=$2,intent=NULL,state='applied',reason=NULL,attempts=0,applied_at=now(),verified_at=now(),updated_at=now()\
    \ WHERE source_path=$1\",[job.source_path,desired]);\n  counters.last_success=Date.now()/1000;\n\
    }\nasync function metrics(db) {\n  const rows=(await db.query('SELECT state,count(*)::int\
    \ n,count(*) FILTER(WHERE payload->>\\'summary\\' IS NOT NULL)::int summaries\
    \ FROM immich_sync.jobs GROUP BY state')).rows;\n  const lines=['# TYPE immich_sync_assets\
    \ gauge','# TYPE immich_sync_summaries gauge'];\n  for(const status of ['pending','applied','conflict','error','excluded','missing']){\n\
    \    const row=rows.find(x=>x.state===status);\n    lines.push(`immich_sync_assets{state=\"\
    ${status}\"} ${row?.n??0}`,`immich_sync_summaries{state=\"${status}\"} ${row?.summaries??0}`);\n\
    \  }\n  const faces=(await db.query('SELECT state,count(*)::int n FROM immich_sync.faces\
    \ GROUP BY state')).rows;\n  for(const status of ['pending','applied','conflict'])lines.push(`immich_sync_faces{state=\"\
    ${status}\"} ${faces.find(x=>x.state===status)?.n??0}`);\n  const preserved=(await\
    \ db.query(\"SELECT count(*)::int n FROM immich_sync.jobs j CROSS JOIN LATERAL\
    \ jsonb_array_elements(j.payload->'faces') f WHERE j.state='applied' AND f->>'label_source'='user'\"\
    )).rows[0].n;\n  lines.push(`immich_sync_confirmed_labels_preserved ${preserved}`);\n\
    \  lines.push(`immich_sync_visible_captions_enabled 0`,`immich_sync_mode{mode=\"\
    ${MODE}\"} 1`);\n  gauges=lines.join('\\n')+'\\n';\n}\nasync function cycle()\
    \ {\n  if(active)return;active=true;const started=Date.now();let db;\n  try {\n\
    \    db=await pool.connect();\n    const lock=(await db.query('SELECT pg_try_advisory_lock(217,8001)\
    \ locked')).rows[0].locked;\n    if(!lock)return;\n    await api('/users/me');counters.api_ready=1;\n\
    \    if(Date.now()/1000-counters.last_discovery>600)await discover(db);\n    if(MODE==='apply'){\n\
    \      const jobs=(await db.query(\"SELECT * FROM immich_sync.jobs WHERE state\
    \ IN ('pending','error') AND available_at<=now() ORDER BY (payload->>'summary'\
    \ IS NOT NULL) DESC,discovered_at,source_path LIMIT $1\",[BATCH])).rows;\n   \
    \   for(const job of jobs){\n        try{await apply(db,job);}catch(e){\n    \
    \      const reason=e.status?'http_'+e.status:e.message?.replace(/[^a-zA-Z0-9\
    \ _-]/g,'').slice(0,80)??'unknown';\n          await db.query(\"UPDATE immich_sync.jobs\
    \ SET state='error',reason=$2,attempts=attempts+1,available_at=now()+least(3600,power(2,least(attempts,10))*30)*interval\
    \ '1 second',updated_at=now() WHERE source_path=$1\",[job.source_path,reason]);\n\
    \          log('sync.asset_error',{source_id:digest(job.source_path).slice(0,16),reason});\n\
    \        }\n      }\n      log('sync.batch',{attempted:jobs.length});\n      //\
    \ Detect subsequent user edits/removals without restoring them.\n      const audit=(await\
    \ db.query(\"SELECT source_path,asset_id,applied FROM immich_sync.jobs WHERE state='applied'\
    \ AND (verified_at IS NULL OR verified_at<now()-interval '24 hours') ORDER BY\
    \ verified_at NULLS FIRST LIMIT 5\")).rows;\n      for(const job of audit){\n\
    \        const current=await api('/assets/'+job.asset_id+'/metadata');\n     \
    \   const matches=stable(current.find(x=>x.key===META_KEY)?.value)===stable(job.applied);\n\
    \        await db.query(\"UPDATE immich_sync.jobs SET verified_at=now(),state=$2,reason=$3\
    \ WHERE source_path=$1\",[job.source_path,matches?'applied':'conflict',matches?null:'machine_metadata_edited']);\n\
    \      }\n    }\n    await metrics(db);\n  } catch(e){counters.api_ready=0;log('sync.cycle_error',{reason:e.code??(e.status?'http_'+e.status:'unavailable')});}\n\
    \  finally{if(db){try{await db.query('SELECT pg_advisory_unlock(217,8001)');}catch{}db.release();}counters.cycle_seconds=(Date.now()-started)/1000;active=false;}\n\
    }\nhttp.createServer((req,res)=>{\n if(req.url==='/healthz'){res.end('ok');return;}\n\
    \ if(req.url!=='/metrics'){res.writeHead(404);res.end();return;}\n res.setHeader('Content-Type','text/plain;\
    \ version=0.0.4');\n res.end(gauges+Object.entries(counters).map(([k,v])=>`immich_sync_${k}\
    \ ${v}`).join('\\n')+'\\n');\n}).listen(9200,'0.0.0.0');\nawait cycle();setInterval(cycle,15000);\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: immich-sync-schema-v1
  namespace: database
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-pumped-piglet-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sync
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /code
          readOnly: true
        command:
        - node
        - /code/bootstrap.mjs
        env:
        - name: PGHOST
          value: postgres-postgresql.database.svc.cluster.local
        - name: PGDATABASE
          value: photo_enrichment
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: postgres-password
        - name: ROLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-sync-bootstrap
              key: password
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: code
        configMap:
          name: immich-sync-code
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-sync
  namespace: immich-pilot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: immich-sync
  template:
    metadata:
      labels: *id001
      annotations:
        checksum/code: 56937f416c04d2bde3436ce9a89d8035289a8f00787e9ad4a1381d5ea855157e
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-pumped-piglet-gpu
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: sync
        image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: code
          mountPath: /code
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: originals
          mountPath: /external/gphotos
          readOnly: true
        command:
        - node
        - /code/worker.mjs
        env:
        - name: PGHOST
          value: postgres-postgresql.database.svc.cluster.local
        - name: PGDATABASE
          value: photo_enrichment
        - name: PGUSER
          value: immich_reconciler
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-sync
              key: pg-password
        - name: SYNC_MODE
          value: dry-run
        - name: ENABLE_FACE_TRANSFER
          value: 'false'
        - name: SYNC_BATCH_SIZE
          value: '25'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 2Gi
        ports:
        - name: metrics
          containerPort: 9200
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          initialDelaySeconds: 30
      volumes:
      - name: code
        configMap:
          name: immich-sync-code
      - name: credentials
        secret:
          secretName: immich-sync
          items:
          - key: api-key
            path: api-key
      - name: originals
        hostPath:
          path: /mnt/gphotos/library
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: immich-sync
  namespace: immich-pilot
  labels: &id001
    app: immich-sync
spec:
  selector: *id001
  ports:
  - name: metrics
    port: 9200
    targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-sync
  namespace: immich-pilot
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: immich-sync
  endpoints:
  - port: metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: immich-sync
  namespace: immich-pilot
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: immich.reconciliation
    rules:
    - alert: ImmichReconciliationUnavailable
      expr: immich_sync_api_ready == 0 or absent(immich_sync_api_ready)
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Knowledge Index to Immich reconciliation is unavailable
    - alert: ImmichReconciliationFailures
      expr: sum(immich_sync_assets{state="error"}) > 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Immich enrichment transfers require diagnosis
        description: Inspect structured immich-sync pod logs. Failed transfers retry
          with bounded backoff; originals are read-only.
