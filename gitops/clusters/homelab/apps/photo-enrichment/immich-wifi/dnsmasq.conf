# DNS-only split horizon. No DHCP, router changes, or public DNS record changes.
listen-address=${RELAY_ADDRESS}
bind-interfaces
port=53
no-hosts
no-resolv
server=1.1.1.1
server=9.9.9.9
domain-needed
bogus-priv
cache-size=1000
local-ttl=60
local=/${IMMICH_HOSTNAME}/
host-record=${IMMICH_HOSTNAME},${RELAY_ADDRESS}
user=nobody
group=nogroup
pid-file=
log-facility=-
