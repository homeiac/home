apiVersion: batch/v1
kind: Job
metadata:
  name: immich-wifi-deploy
  annotations:
    # A ConfigMap content change changes the pod template; replace the completed
    # immutable Job so Git changes are also applied to the external PVE host.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deploy
          # Registry tag and digest verified 2026-11-26. Only POSIX sh is used.
          image: alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
          command: [/bin/sh, /bundle/deploy.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: bundle, mountPath: /bundle, readOnly: true}
            - {name: ssh, mountPath: /credentials, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: network, mountPath: /settings, readOnly: true}
      volumes:
        - name: bundle
          configMap:
            name: immich-wifi-code
        - name: ssh
          secret:
            secretName: nut-deploy-ssh-key
            defaultMode: 0440
            items:
              - {key: id_rsa, path: id_rsa}
        - name: network
          secret:
            secretName: immich-wifi-network
            defaultMode: 0440
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
