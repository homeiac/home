# TLS remains encrypted until Traefik; no certificate or application credential
# lives on PVE. A distinct Traefik TLSOption also rejects mismatched HTTP Hosts.
global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 10m
    timeout server 10m

frontend google_wifi_immich
    bind ${RELAY_ADDRESS}:443
    tcp-request connection reject unless { src ${GOOGLE_WAN_ADDRESS}/32 ${RELAY_ADDRESS}/32 }
    tcp-request inspect-delay 5s
    acl client_hello req.ssl_hello_type 1
    acl immich_sni req.ssl_sni -i ${IMMICH_HOSTNAME}
    tcp-request content reject if client_hello !immich_sni
    tcp-request content accept if client_hello immich_sni
    tcp-request content reject if WAIT_END
    default_backend existing_traefik

backend existing_traefik
    server traefik ${TRAEFIK_HOSTNAME}:443 check inter 10s
