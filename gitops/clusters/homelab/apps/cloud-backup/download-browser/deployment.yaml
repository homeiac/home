# Firefox in a web page, running in the homelab (design §5.4).
# Used to click Google Takeout download links: downloads go straight to the primary
# backup disk (SMB share), never through the machine displaying the browser.
#   Downloads (~/Downloads) -> /var/lib/cloud-backup/downloads  (VM root disk = NVMe pool, NOT the USB HDD)
#     2026-11-15: downloading onto the USB-HDD SMB disk saturated it (node outage), made Firefox's
#     resume re-read take 30-45 min and resumes then failed. The ingest job moves finished archives
#     onto the SMB disk one at a time (sequential), which the HDD handles well.
#   Profile   (/config)     -> /var/lib/cloud-backup/browser                     (NOT on the share: holds sign-in cookies)
# Runs as uid/gid 65534 (nobody) so files match the Samba share's `force user = nobody`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: download-browser
  namespace: cloud-backup
  labels:
    app: download-browser
spec:
  replicas: 1
  strategy:
    type: Recreate   # single profile directory; never two Firefox instances on it
  selector:
    matchLabels:
      app: download-browser
  template:
    metadata:
      labels:
        app: download-browser
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-vm-pumped-piglet-gpu   # the node with /mnt/samba-storage
      # Default is eviction 300s after the node goes NotReady/unreachable. On 2026-11-15 a disk stall made
      # the node NotReady for a few minutes and the eviction killed 7 in-flight Takeout downloads. The pod
      # can only run on this node anyway, so ride out stalls of up to an hour instead of being evicted.
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 3600
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 3600
      initContainers:
      - name: init-dirs
        image: busybox:1.37.0
        command:
        - sh
        - -c
        - |
          set -e
          mkdir -p /share/cloud-backup/gphotos/_incoming
          chown 65534:65534 /share/cloud-backup /share/cloud-backup/gphotos /share/cloud-backup/gphotos/_incoming
          chmod 0770 /share/cloud-backup /share/cloud-backup/gphotos /share/cloud-backup/gphotos/_incoming
          chown 65534:65534 /profile
          chmod 0700 /profile
          chown 65534:65534 /downloads
          chmod 0770 /downloads
        volumeMounts:
        - name: share
          mountPath: /share
        - name: profile
          mountPath: /profile
        - name: downloads
          mountPath: /downloads
      containers:
      - name: firefox
        image: lscr.io/linuxserver/firefox:1160.0build1-1xtradeb1.2404.1-ls136
        env:
        - name: PUID
          value: "65534"
        - name: PGID
          value: "65534"
        - name: TZ
          value: "America/Los_Angeles"
        - name: TITLE
          value: "Download Browser"
        # HTTP basic auth in front of the browser (it holds a Google session)
        - name: CUSTOM_USER
          valueFrom:
            secretKeyRef:
              name: download-browser-auth
              key: username
        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: download-browser-auth
              key: password
        ports:
        - containerPort: 3000
          name: http
        # No CPU/memory limits (single-user browser; several 50 GB downloads at once must not be capped).
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
        volumeMounts:
        - name: profile
          mountPath: /config
        - name: downloads
          mountPath: /config/Downloads
        - name: dev-shm
          mountPath: /dev/shm
      volumes:
      - name: share
        hostPath:
          path: /mnt/samba-storage
          type: Directory
      - name: downloads
        hostPath:
          path: /var/lib/cloud-backup/downloads
          type: DirectoryOrCreate
      - name: profile
        hostPath:
          path: /var/lib/cloud-backup/browser
          type: DirectoryOrCreate
      - name: dev-shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
