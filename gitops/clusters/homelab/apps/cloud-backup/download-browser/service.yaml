apiVersion: v1
kind: Service
metadata:
  name: download-browser
  namespace: cloud-backup
  labels:
    app: download-browser
spec:
  type: ClusterIP   # only reachable through Traefik (LAN / Tailscale), no LoadBalancer IP
  ports:
  - port: 3000
    targetPort: 3000
    name: http
  selector:
    app: download-browser
