apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-gpu
  namespace: ollama
  labels:
    app: ollama-gpu
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0  # Stop the existing model pod before its replacement.
      maxUnavailable: 1
  selector:
    matchLabels:
      app: ollama-gpu
  template:
    metadata:
      labels:
        app: ollama-gpu
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: ollama
          image: ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
          imagePullPolicy: IfNotPresent
          args:
            - serve
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_PORT
              value: "11434"
            - name: OLLAMA_GPU_OVERHEAD
              value: "1073741824"  # 1GB GPU memory overhead
            - name: OLLAMA_NUM_PARALLEL
              value: "1"  # Single parallel to reduce CPU usage
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"  # Limit to one model to prevent memory pressure
            - name: OLLAMA_FLASH_ATTENTION
              value: "true"  # Enable flash attention for GPU efficiency
            - name: CUDA_VISIBLE_DEVICES
              value: "0"  # Explicitly use GPU 0
          ports:
            - containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 5
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: "4"  # Scheduling weight under CPU contention; VPA tunes 4–5 cores.
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
