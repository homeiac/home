# Separate namespace scopes prevent overlap with the Immich recommender.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-vpa-recommender
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-vpa-recommender
  template:
    metadata:
      labels:
        app: ollama-vpa-recommender
        app.kubernetes.io/name: vertical-pod-autoscaler
        app.kubernetes.io/component: recommender
    spec:
      serviceAccountName: ollama-vpa-recommender
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - k3s-vm-pumped-piglet-gpu
      containers:
      - name: recommender
        image: registry.k8s.io/autoscaling/vpa-recommender:1.7.3@sha256:3b207e6e719e8a88b96b5777afa6f6fb261e73669fa39f487c04560d85bf2e7d
        args:
        - --vpa-object-namespace=ollama
        - --leader-elect=false
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 500Mi
          limits:
            cpu: 200m
            memory: 1000Mi
        ports:
        - name: prometheus
          containerPort: 8942
        livenessProbe:
          httpGet:
            path: /health-check
            port: prometheus
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health-check
            port: prometheus
          periodSeconds: 10
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-vpa-recommender
  namespace: kube-system
  labels:
    app: ollama-vpa-recommender
spec:
  selector:
    app: ollama-vpa-recommender
  ports:
  - name: prometheus
    port: 8942
    targetPort: prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama-vpa-recommender
  namespace: kube-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ollama-vpa-recommender
  endpoints:
  - port: prometheus
    interval: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-vpa-updater
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-vpa-updater
  template:
    metadata:
      labels:
        app: ollama-vpa-updater
        app.kubernetes.io/name: vertical-pod-autoscaler
        app.kubernetes.io/component: updater
    spec:
      serviceAccountName: ollama-vpa-updater
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - k3s-vm-pumped-piglet-gpu
      containers:
      - name: updater
        image: registry.k8s.io/autoscaling/vpa-updater:1.7.3@sha256:666e5fe1b933c85c0bc01dfca9cd7fac93bcc5618072e32d6bece16b77e39d14
        args:
        - --vpa-object-namespace=ollama
        - --leader-elect=false
        - --feature-gates=InPlace=true
        - --use-admission-controller-status=false
        - --in-place-skip-disruption-budget=true
        - --in-recommendation-bounds-eviction-lifetime-threshold=2m
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 500Mi
          limits:
            cpu: 200m
            memory: 1000Mi
        ports:
        - name: prometheus
          containerPort: 8943
        livenessProbe:
          httpGet:
            path: /health-check
            port: prometheus
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health-check
            port: prometheus
          periodSeconds: 10
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-vpa-updater
  namespace: kube-system
  labels:
    app: ollama-vpa-updater
spec:
  selector:
    app: ollama-vpa-updater
  ports:
  - name: prometheus
    port: 8943
    targetPort: prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama-vpa-updater
  namespace: kube-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: ollama-vpa-updater
  endpoints:
  - port: prometheus
    interval: 30s
