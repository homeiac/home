apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-knowledge-index
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Homelab"
data:
  knowledge-index.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Knowledge index: photo inventory, Google quota, GPU summaries, ingest pipeline, host and disk health. Generated by scripts/knowledge-index/gen-dashboard.py",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "title": "Photo app traces, logs & triage",
          "url": "/d/photo-app/photo-app"
        }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Value delivered",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Files indexed per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "clamp_min(deriv(knowledge_index_backfill_files_done{instance=~\"$instance\"}[5m]) * 60, 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Backfill speed: files read per minute (5 min window). Only while a run publishes progress."
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Summaries per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "expr": "clamp_min(sum(deriv(media_summaries_rows{status=\"ok\",instance=~\"$instance\"}[10m])) * 60, 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Photos and videos described by the local model per minute (10 min window)."
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Quota question answered in",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "expr": "knowledge_index_query_seconds{query=\"quota\",instance=~\"$instance\"}",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "How long 'what counts against Google quota?' takes against the index right now."
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Faster than before",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "$baseline_s / knowledge_index_query_seconds{query=\"quota\",instance=~\"$instance\"}",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "suffix:x",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Baseline: reading ~120k Takeout sidecars from the USB disk took about 38 min (2026-11-16). Edit the baseline_s variable to change it."
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Index size",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "expr": "knowledge_index_dataset_bytes{instance=~\"$instance\"}",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Parquet files plus the DuckDB view file."
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Index vs library",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "expr": "knowledge_index_dataset_bytes{instance=~\"$instance\"} / sum(knowledge_index_bytes{source=\"gphotos\",instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Index size as a share of the photo library it describes."
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Library size",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(knowledge_index_bytes{source=\"gphotos\",instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Photos described",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(media_summaries_ok_items{kind=\"photo\",instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Video minutes described",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(media_summaries_video_seconds{instance=~\"$instance\"}) / 60",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Cloud-equivalent cost avoided",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(media_summaries_ok_items{kind=\"photo\",instance=~\"$instance\"}) * $price_photo + sum(media_summaries_video_seconds{instance=~\"$instance\"}) / 60 * $price_video_min",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "ILLUSTRATIVE. No cloud service describes a Google Photos library like this. Priced as if a multimodal AI API charged per photo and per video minute; set the two price variables at the top to your own assumptions. Not a quote."
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Counts against Google quota",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(gphotos_quota_bytes{kind=\"media\",instance=~\"$instance\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Throughput per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "expr": "clamp_min(deriv(knowledge_index_backfill_files_done{instance=~\"$instance\"}[5m]) * 60, 0)",
              "legendFormat": "files indexed / min",
              "refId": "A"
            },
            {
              "expr": "clamp_min(sum(deriv(media_summaries_rows{status=\"ok\",instance=~\"$instance\"}[10m])) * 60, 0)",
              "legendFormat": "summaries / min",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Index size vs library size",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "expr": "knowledge_index_dataset_bytes{instance=~\"$instance\"}",
              "legendFormat": "index",
              "refId": "A"
            },
            {
              "expr": "sum(knowledge_index_bytes{source=\"gphotos\",instance=~\"$instance\"})",
              "legendFormat": "library",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 94,
          "type": "row",
          "title": "Pipeline bottlenecks",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "panels": []
        },
        {
          "id": 95,
          "type": "stat",
          "title": "Worker stage",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "expr": "(media_pipeline_worker_stage{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} and (time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60)) or (media_pipeline_worker_stage{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} * 0 - 1)",
              "legendFormat": "{{instance}} / {{enricher}}",
              "refId": "A",
              "interval": "30s",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "-1": {
                      "text": "No recent telemetry",
                      "color": "gray"
                    },
                    "0": {
                      "text": "Between stages",
                      "color": "gray"
                    },
                    "1": {
                      "text": "Selecting batch",
                      "color": "purple"
                    },
                    "2": {
                      "text": "Read / decode",
                      "color": "blue"
                    },
                    "3": {
                      "text": "Transcribing",
                      "color": "yellow"
                    },
                    "4": {
                      "text": "Building prompt",
                      "color": "light-blue"
                    },
                    "5": {
                      "text": "Ollama request",
                      "color": "green"
                    },
                    "6": {
                      "text": "Parsing answer",
                      "color": "light-purple"
                    },
                    "7": {
                      "text": "Writing Parquet",
                      "color": "orange"
                    },
                    "8": {
                      "text": "Finished",
                      "color": "dark-green"
                    },
                    "9": {
                      "text": "Failed",
                      "color": "red"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 96,
          "type": "stat",
          "title": "Time in current stage",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 8,
            "y": 17
          },
          "targets": [
            {
              "expr": "(time() - media_pipeline_stage_started_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}) and (time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} < 60) and (media_pipeline_running{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"} == 1)",
              "legendFormat": "{{instance}} / {{enricher}}",
              "refId": "A",
              "interval": "30s",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          }
        },
        {
          "id": 97,
          "type": "stat",
          "title": "Worker telemetry age",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 16,
            "y": 17
          },
          "targets": [
            {
              "expr": "time() - media_pipeline_heartbeat_timestamp_seconds{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}",
              "legendFormat": "",
              "refId": "A",
              "interval": "30s",
              "instant": true,
              "range": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "red",
                    "value": 60
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "description": "Published every 5 s by the instrumented worker. Missing data means it has not published yet. After 60 s, the state becomes unknown rather than claiming it is still busy."
        },
        {
          "id": 98,
          "type": "nodeGraph",
          "title": "Value stream map",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "targets": [
            {
              "refId": "nodes",
              "expr": "label_replace(((100 * sum by (id, title) (rate(media_pipeline_stage_seconds_total{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[$__rate_interval])) / scalar(sum(rate(media_pipeline_stage_seconds_total{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}[$__rate_interval]))) >= 0) or (sum by (id, title) (media_pipeline_stage_seconds_total{instance=~\"$instance\",enricher=~\"$pipeline_enricher\"}) * 0) or (100 * sum by (id, title) (rate(photo_enrichment_stage_seconds_total{instance=~\"$instance\"}[$__rate_interval])) / scalar(sum(rate(photo_enrichment_stage_seconds_total{instance=~\"$instance\"}[$__rate_interval]))) >= 0) or (sum by (id, title) (photo_enrichment_stage_seconds_total{instance=~\"$instance\"}) * 0)), \"title\", \"$1 (%)\", \"title\", \"(.+)\") or max by (id,title) (photo_frigate_processing_milliseconds{instance=~\"$instance\"} and on(instance) (time() - photo_frigate_last_poll_timestamp_seconds{instance=~\"$instance\"} < 60)) or max by (id,title) (photo_frigate_service_up{instance=~\"$instance\"} and on(instance) (time() - photo_frigate_last_poll_timestamp_seconds{instance=~\"$instance\"} < 60)) or label_replace(((100 * sum by(id,title) (rate(photo_review_stage_seconds_total{instance=~\"$instance\"}[$__rate_interval])) / scalar(sum(rate(photo_review_stage_seconds_total{instance=~\"$instance\"}[$__rate_interval]))) >= 0) or sum by(id,title)(photo_review_stage_seconds_total{instance=~\"$instance\"}) * 0), \"title\", \"$1 (%)\", \"title\", \"(.+)\") or label_replace(label_replace((sum(photo_enrichment_jobs{instance=~\"$instance\",kind=~\"ready|retry\"})), \"id\", \"photo_jobs\", \"\", \"\"), \"title\", \"PostgreSQL queue (jobs)\", \"\", \"\") or label_replace(label_replace((max(photo_snapshot_export_seconds{instance=~\"$instance\"})), \"id\", \"photo_export\", \"\", \"\"), \"title\", \"Parquet export (seconds)\", \"\", \"\") or label_replace(label_replace((time()-min(photo_snapshot_captured_timestamp_seconds{instance=~\"$instance\"})), \"id\", \"photo_analytics\", \"\", \"\"), \"title\", \"DuckDB snapshot age (seconds)\", \"\", \"\") or label_replace(label_replace((histogram_quantile(0.95,sum by(le)(rate(photo_app_db_duration_seconds_bucket{service_name=\"photo-review\",stage=\"duckdb.query\"}[$__rate_interval])))), \"id\", \"photo_gallery\", \"\", \"\"), \"title\", \"Gallery DuckDB query p95 (seconds)\", \"\", \"\") or label_replace(label_replace((histogram_quantile(0.95,sum by(le)(rate(photo_app_db_duration_seconds_bucket{service_name=\"photo-review\",stage=\"db.query\"}[$__rate_interval])))), \"id\", \"photo_live_db\", \"\", \"\"), \"title\", \"GUI PostgreSQL calls p95 (seconds)\", \"\", \"\")",
