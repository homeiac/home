        {
          "id": 11,
          "type": "stat",
          "title": "Cloud-equivalent cost avoided",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 8,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(media_summaries_ok_items{kind=\"photo\",instance=~\"$instance\"}) * $price_photo + sum(media_summaries_video_seconds{instance=~\"$instance\"}) / 60 * $price_video_min",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
