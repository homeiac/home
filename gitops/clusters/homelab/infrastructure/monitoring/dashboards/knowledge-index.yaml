                "id": "byRefId",
                "options": "nodes"
              },
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "Value #nodes": true
                }
              }
            },
            {
              "id": "organize",
              "filter": {
                "id": "byRefId",
                "options": "edges"
              },
              "options": {
                "excludeByName": {
                  "Time": true,
