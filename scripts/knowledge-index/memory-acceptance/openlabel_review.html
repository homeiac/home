<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Album · Face and action review</title>
<style>
*{box-sizing:border-box}body{margin:2rem auto;max-width:76rem;padding:0 1rem;color:#183128;background:#f8f7f2;font:17px/1.5 system-ui}
h1,h2{font-family:Georgia,serif}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:1.25rem;align-items:start}
article{background:white;padding:1rem;border:1px solid #ced8d0;border-radius:.7rem}figure{margin:0;position:relative}img{display:block;width:100%;height:auto}
.box{position:absolute;pointer-events:none;border:3px solid #ffea38;box-shadow:0 0 0 2px black}
.box.held_person,.box.recipient{border-color:#58deff}button{font:inherit;color:#145744;border:0;background:#eef5ef;text-decoration:underline;cursor:pointer;border-radius:.2rem}
button:focus-visible,a:focus-visible{outline:3px solid #705500}button[aria-pressed=true]{background:#174f41;color:white}output{display:block;min-height:1.5em}
.date-conflict{background:#fff1cf;border-left:4px solid #9a5a05;padding:.6rem .8rem;margin:.5rem 0}
a{color:#175441}h2{margin:.6rem 0}
</style>
<h1>Face and action review</h1><p>Select a name to see what that person is doing. Select an action to highlight its participants.</p>
<main></main><script id="scenes" type="application/json">PILOT_JSON</script>
<script>
function element(tag, parent, text) {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = text;
  parent.append(el);
  return el;
}
for (const item of JSON.parse(document.querySelector('#scenes').textContent)) {
  const article = element('article', document.querySelector('main'));
  article.id = item.asset;
  const figure = element('figure', article);
  const photo = element('img', figure);
  photo.src = item.image;
  photo.alt = 'Album photo from ' + item.date;
  element('h2', article, 'Recorded date · ' + item.date);
  if (item.date_conflict) {
    const facts = item.date_conflict;
    const year = Number(facts.recorded_date.slice(0, 4));
    const age = year - Number(facts.birth_year);
    const timing = age === 0 ? "The recorded year is the birth year" :
      "Someone born in " + facts.birth_year + " would turn " + age + " in " + year;
    const note = element('aside', article);
    note.className = 'date-conflict';
    element('strong', note, 'Capture date disputed');
    element('div', note, timing + '. The visual review indicates ' +
      facts.visual_stage.replaceAll('_', ' ') + ' age. The capture year is unknown.');
  }
  element('h3', article, item.scene ? 'Scene description' : 'What each person is doing');
  if (item.scene) {
    element('p', article, item.scene);
    element('small', article, 'Individual actions withheld · ' + item.reason);
  }
  const feedback = document.createElement('output');
  feedback.setAttribute('aria-live','polite');
  function select(button, roles, message) {
    figure.querySelectorAll('.box').forEach(box => box.remove());
    article.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === button)));
    for (const [role, id] of Object.entries(roles)) {
      const [cx, cy, w, h] = item.faces[id].box;
      const box = element('span', figure);
      box.className = 'box ' + role;
      box.dataset.face = id;
      Object.assign(box.style, {left: (cx-w/2)/item.width*100+'%', top: (cy-h/2)/item.height*100+'%',
                                width: w/item.width*100+'%', height: h/item.height*100+'%'});
    }
    feedback.textContent = message;
  }
  const descriptions = new Map();
  for (const claim of item.claims) {
    const actor = claim.subject;
    const sentence = claim.spans.map(s => s.text ?? s.verb ?? item.faces[s.face].name).join('');
    descriptions.set(actor, [...(descriptions.get(actor) || []), sentence]);
  }
  for (const claim of item.claims) {
    const p = element('p', article);
    for (const span of claim.spans) {
      if ('text' in span) { p.append(span.text); continue; }
      const face = item.faces[span.face];
      const b = element('button', p, face ? face.name : span.verb);
      b.type = 'button';
      b.setAttribute('aria-pressed','false');
      if (face) {
        b.dataset.face = span.face;
        b.title = face.face_namespace + ' face ID · ' + face.face_id;
        b.onclick = () => select(b, {person:span.face}, descriptions.get(span.face)?.join(" ") || face.name);
      } else {
        b.dataset.action = span.id;
        const labels = Object.entries(span.roles).map(([role,id]) =>
          ({actor:'Actor', held_person:'Held person', recipient:'Recipient'}[role] || role) + ' · ' + item.faces[id].name);
        b.onclick = () => select(b, span.roles, [span.verb, span.code, ...labels].join(' / '));
      }
    }
  }
  article.append(feedback);
  element('a', article, 'Open original in Immich').href = item.original;
}
</script></html>
